<template>
    <lightning-card>
        <div slot="title" class="head">
            <span class="title">Relevant Records</span>
            <span class="count">{subtitle}</span>
        </div>
        <div slot="actions" class="actions">
            <lightning-input type="checkbox" label="Include BOM" checked={includeBom} onchange={handleBom} class="bom"></lightning-input>
        </div>

        <template if:true={hasSuggested}>
            <div class="sub">
                <button class="pill sm" data-q={summaryWhy} onclick={handleWhy} title={summaryWhy}><span class="st">&#10022;</span>{summaryLabel}</button>
            </div>
        </template>

        <template if:true={error}>
            <div class="err">{error}</div>
        </template>
        <template if:true={notice}>
            <div class="ok">{notice}</div>
        </template>
        <template if:true={loading}>
            <div class="loading"><lightning-spinner alternative-text="Scouting" size="small"></lightning-spinner></div>
        </template>

        <div class="tabs" role="tablist">
            <template for:each={tabs} for:item="t">
                <button key={t.key} class={t.cls} role="tab" data-key={t.key} onclick={handleTab}>
                    {t.label}
                    <template if:true={t.badge}><span class="on-badge">{t.badge}</span></template>
                </button>
            </template>
        </div>

        <table class="grid">
            <thead>
                <tr>
                    <th class="c-score">Score</th>
                    <th>Record</th>
                    <th>Status</th>
                    <th>Title</th>
                    <th>Root Cause</th>
                    <th>Matched on</th>
                    <th class="c-why">&#10022;</th>
                    <th class="c-add">Add to PHR</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={rows} for:item="r">
                    <tr key={r.id}>
                        <td><span class={r.badgeClass}>{r.score}</span></td>
                        <td>
                            <a href={r.link} target="_blank" class="num">{r.recordNumber}</a>
                            <div class="line">{r.partText}</div>
                            <div class="line dim">{r.lotText}</div>
                        </td>
                        <td class="muted">{r.status}</td>
                        <td>{r.titleText}</td>
                        <td>{r.rootCauseText}</td>
                        <td class="muted">{r.match}</td>
                        <td class="c-why">
                            <template if:true={r.suggested}>
                                <button class="pill" data-q={r.why} onclick={handleWhy} title={r.why}><span class="st">&#10022;</span>CQ.AI Suggested</button>
                            </template>
                        </td>
                        <td>
                            <template if:true={r.added}>
                                <span class="added">Added</span>
                            </template>
                            <template if:true={r.canToggle}>
                                <button class={r.switchClass} data-id={r.id} onclick={handleToggle} role="switch" aria-checked={r.on} aria-label="Add to PHR"><span class="knob"></span></button>
                            </template>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <div class="pager">
            <span class="page-label">{pageLabel}</span>
            <template if:true={hasPages}>
                <lightning-button-icon icon-name="utility:chevronleft" variant="border-filled" size="small" alternative-text="Previous" onclick={handlePrev} disabled={prevDisabled}></lightning-button-icon>
                <lightning-button-icon icon-name="utility:chevronright" variant="border-filled" size="small" alternative-text="Next" onclick={handleNext} disabled={nextDisabled}></lightning-button-icon>
            </template>
            <span class="gap"></span>
            <lightning-button label={submitLabel} variant="brand" onclick={handleSubmit} disabled={submitDisabled}></lightning-button>
        </div>
    </lightning-card>
</template>
