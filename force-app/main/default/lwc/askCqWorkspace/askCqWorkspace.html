<template>
    <div class="ws" onask={handleAsk} onchanged={handleChanged}>
        <header class="hl">
            <div class="hl-top">
                <div class="hl-who">
                    <span class="hl-icon"><lightning-icon icon-name="standard:default" size="medium" alternative-text="Product History Review"></lightning-icon></span>
                    <div class="hl-name">
                        <span class="hl-obj">Product History Review</span>
                        <span class="hl-title">{title}</span>
                    </div>
                </div>
                <div class="hl-actions">
                    <lightning-button label="Edit" onclick={handleEdit}></lightning-button>
                    <lightning-button-icon icon-name="utility:refresh" variant="border" alternative-text="Refresh" onclick={handleRefresh}></lightning-button-icon>
                    <c-ask-cq-popover record-id={recordId} agent-id={agentId} suggestions={suggestions}></c-ask-cq-popover>
                </div>
            </div>
            <div class="hl-fields">
                <div class="f"><span class="k">Complaint</span><a href={complaintLink} target="_blank" class="v link">{complaintName}</a></div>
                <div class="f"><span class="k">Part</span><span class="v">{partName}</span></div>
                <div class="f"><span class="k">Lot</span><span class="v">{lotNumber}</span></div>
                <div class="f"><span class="k">Owner</span><span class="v">{ownerName}</span></div>
                <div class="f"><span class="k">Status</span><span class="v">{phrStatus}</span></div>
                <div class="f"><span class="k">Pending checklist</span><span class="v">{pendingChecklist}</span></div>
            </div>
        </header>

        <template if:true={error}>
            <div class="err">{error}</div>
        </template>

        <div class="body">
            <nav class="steps">
                <div class="steps-title">Review steps</div>
                <template for:each={steps} for:item="s">
                    <button key={s.key} class={s.cls} data-key={s.key} onclick={handleStep}>
                        <span class="mark">
                            <template if:true={s.done}>&#10003;</template>
                            <template if:true={s.notDone}>{s.n}</template>
                        </span>
                        <span class="txt">
                            <span class="lbl">{s.label}</span>
                            <span class="sub">{s.sub}</span>
                        </span>
                    </button>
                </template>
                <div class="progress">{progress}</div>
            </nav>

            <main class="work">
                <template if:true={isRecords}>
                    <c-ask-cq-records-demo record-id={recordId}></c-ask-cq-records-demo>
                </template>

                <template if:true={isChecklist}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Checklist</span>
                            <span class="sect-sub">CQ.AI suggested answers are pre-selected in purple · click Yes or No to answer or change · saved as you go</span>
                        </div>
                        <template if:false={hasChecklist}>
                            <p class="muted">No checklist questions on this review yet.</p>
                        </template>
                        <template if:true={saveNote}><div class="ok">{saveNote}</div></template>
                        <template for:each={checklist} for:item="q">
                            <div key={q.id} class="q">
                                <div class="qt">
                                    <div class="qh">
                                        <span class="question">{q.question}</span>
                                        <template if:true={q.showPill}>
                                            <button class="pill" data-q={q.why} onclick={handleWhy} title={q.why}><span class="st">&#10022;</span>CQ.AI Suggested</button>
                                        </template>
                                    </div>
                                    <template if:true={q.evidence}><div class="ev">{q.evidence}</div></template>
                                </div>
                                <div class="ynwrap">
                                    <template for:each={q.buttons} for:item="b">
                                        <button key={b.key} class={b.cls} data-id={q.id} data-value={b.value} aria-pressed={b.pressed} onclick={handleAnswer}>{b.value}</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={isSummary}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">PHR Summary</span>
                            <lightning-button label="Generate with ✦ CQ.AI" onclick={handleDraft}></lightning-button>
                        </div>
                        <template if:true={hasSummary}>
                            <lightning-formatted-rich-text value={summaryHtml}></lightning-formatted-rich-text>
                        </template>
                        <template if:false={hasSummary}>
                            <p class="muted">No summary on this review yet. Ask CQ.AI can draft one from the records, the checklist and the complaint; you say whether to save it.</p>
                        </template>
                    </div>
                </template>

                <template if:true={isReports}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Reports</span>
                            <lightning-button label="Generate with ✦ CQ.AI" onclick={handleReport}></lightning-button>
                        </div>
                        <template if:false={hasReports}>
                            <p class="muted">No report attached to the complaint yet.</p>
                        </template>
                        <template for:each={reports} for:item="r">
                            <div key={r.key} class="file">
                                <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                                <a href={r.link} target="_blank">{r.label}</a>
                                <lightning-formatted-date-time value={r.modified} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </div>
                        </template>
                    </div>
                </template>
            </main>
        </div>
    </div>
</template>
