<template>
    <div class="ws" onask={handleAsk} onchanged={handleChanged}>
        <header class="cq-hl">
            <div class="cq-hl-top">
                <div class="cq-hl-who">
                    <span class="cq-hl-icon"><lightning-icon icon-name="standard:custom" size="medium" alternative-text="Product History Review"></lightning-icon></span>
                    <div class="cq-hl-name">
                        <span class="cq-hl-obj">Product History Review</span>
                        <span class="cq-hl-title">{title}</span>
                    </div>
                </div>
                <div class="cq-hl-actions">
                    <c-ask-cq-popover record-id={recordId} agent-name={agentName} suggestions={suggestions}></c-ask-cq-popover>
                    <button class="cq-btn-outline" onclick={handleEdit}>Edit</button>
                </div>
            </div>
            <div class="cq-hl-fields">
                <div class="cq-hl-f"><span class="cq-hl-k">Complaint</span><a href={complaintLink} target="_blank" class="cq-hl-v link">{complaintName}</a></div>
                <div class="cq-hl-f"><span class="cq-hl-k">Part</span><span class="cq-hl-v">{partName}</span></div>
                <div class="cq-hl-f"><span class="cq-hl-k">Lot</span><span class="cq-hl-v">{lotNumber}</span></div>
                <div class="cq-hl-f"><span class="cq-hl-k">Owner</span><span class="cq-hl-v">{ownerName}</span></div>
                <div class="cq-hl-f"><span class="cq-hl-k">Status</span><span class="cq-hl-v">{phrStatus}</span></div>
                <div class="cq-hl-f"><span class="cq-hl-k">Pending Checklist</span><span class="cq-hl-v">{pendingChecklist}</span></div>
            </div>
        </header>

        <template if:true={error}>
            <div class="cq-msg crit err">{error}</div>
        </template>

        <div class="body">
            <nav class="steps">
                <div class="steps-title">Review Steps</div>
                <template for:each={steps} for:item="s">
                    <button key={s.key} class={s.cls} data-key={s.key} onclick={handleStep}>
                        <span class="mark">
                            <template if:true={s.done}>&#10003;</template>
                            <template if:true={s.notDone}>{s.n}</template>
                        </span>
                        <span class="txt">
                            <span class="lbl">{s.label}</span>
                            <span class="sub">{s.sub}</span>
                        </span>
                    </button>
                </template>
                <div class="progress">{progress}</div>
            </nav>

            <main class="work">
                <template if:true={isRecords}>
                    <c-ask-cq-records-demo record-id={recordId}></c-ask-cq-records-demo>
                </template>

                <template if:true={isChecklist}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Checklist</span>
                            <span class="sect-sub">CQ.AI suggested answers are pre-selected in purple · Save keeps a draft · Submit Checklist puts the answers on the record</span>
                        </div>
                        <template if:false={hasChecklist}>
                            <p class="muted">No checklist questions on this review yet.</p>
                        </template>
                        <template if:true={saveNote}><div class="cq-msg pos ok">{saveNote}</div></template>
                        <template for:each={checklist} for:item="q">
                            <div key={q.id} class="q">
                                <div class="qt">
                                    <div class="qh">
                                        <span class="question">{q.question}</span>
                                        <template if:true={q.showPill}>
                                            <c-cq-ai-why variant="pill" text="CQ.AI Suggested" question={q.why}></c-cq-ai-why>
                                        </template>
                                    </div>
                                    <template if:true={q.evidence}><div class="ev">{q.evidence}</div></template>
                                </div>
                                <div class="cq-chips ynwrap">
                                    <template for:each={q.buttons} for:item="b">
                                        <button key={b.key} class={b.cls} data-id={q.id} data-value={b.value} aria-pressed={b.pressed} onclick={handleAnswer}>{b.value}</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={isSummary}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">PHR Summary</span>
                            <button class="cq-btn-ai" onclick={handleDraft}>Generate with &#10022; CQ.AI</button>
                        </div>
                        <template if:true={hasSummary}>
                            <lightning-formatted-rich-text value={summaryHtml}></lightning-formatted-rich-text>
                        </template>
                        <template if:false={hasSummary}>
                            <p class="muted">No summary on this review yet. Ask CQ.AI can draft one from the records, the checklist and the complaint; you say whether to save it.</p>
                        </template>
                    </div>
                </template>

                <template if:true={isReports}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Reports</span>
                            <button class="cq-btn-ai" onclick={handleReport}>Generate with &#10022; CQ.AI</button>
                        </div>
                        <template if:false={hasReports}>
                            <p class="muted">No report attached to the complaint yet.</p>
                        </template>
                        <template for:each={reports} for:item="r">
                            <div key={r.key} class="file">
                                <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                                <a href={r.link} target="_blank">{r.label}</a>
                                <lightning-formatted-date-time value={r.modified} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </div>
                        </template>
                    </div>
                </template>
                <footer class="foot">
                    <span class="grow"></span>
                    <span class={footCls}>{footNote}</span>
                    <template if:true={isChecklist}>
                        <button class="cq-btn-outline" onclick={handleSaveDraft} disabled={cantSaveDraft}>Save</button>
                        <button class="cq-btn-primary" onclick={handleSubmitChecklist} disabled={cantSubmit}>Submit Checklist</button>
                    </template>
                    <template if:true={hasBack}><button class="cq-btn-outline" onclick={handleBack}>Back</button></template>
                    <template if:true={hasNext}><button class={nextCls} onclick={handleNext}>Next</button></template>
                </footer>
            </main>
        </div>
    </div>
</template>
