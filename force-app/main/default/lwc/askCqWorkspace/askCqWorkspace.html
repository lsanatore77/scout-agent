<template>
    <div class="ws" onask={handleAsk} onchanged={handleChanged}>
        <c-cq-ws-shell record-id={recordId} icon="standard:custom" icon-color="#747e96" object-label="Product History Review" record-name={title}
            fields={headerFields} show-edit agent-name={agentName} ask-suggestions={askSuggestions}
            steps={railSteps} progress={progress} error={error}
            show-foot={notRecords} back-disabled={noBack} next-disabled={noNext} next-outline={canSubmit}
            onstep={handleStep} onback={handleBack} onnext={handleNext} onedit={handleEdit} onopen={handleShellOpen}>
                <template if:true={isRecords}>
                    <c-ask-cq-records-demo record-id={recordId}>
                        <button slot="actions" class="cq-btn-primary" onclick={handleNext}>Next</button>
                    </c-ask-cq-records-demo>
                </template>

                <template if:true={isChecklist}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Checklist</span>
                            <span class="sect-sub">CQ.AI suggested answers are pre-selected in purple · Save keeps a draft · Submit Checklist puts the answers on the record</span>
                        </div>
                        <template if:false={hasChecklist}>
                            <p class="cq-note">No checklist questions on this review yet.</p>
                        </template>
                        <template if:true={saveNote}><div class="cq-msg pos ok">{saveNote}</div></template>
                        <template for:each={checklist} for:item="q">
                            <div key={q.id} class="q">
                                <div class="qt">
                                    <div class="qh">
                                        <span class="question">{q.question}</span>
                                        <template if:true={q.showPill}>
                                            <c-cq-ai-why variant="pill" question={q.why}></c-cq-ai-why>
                                        </template>
                                    </div>
                                    <template if:true={q.evidence}><div class="ev">{q.evidence}</div></template>
                                </div>
                                <div class="cq-chips ynwrap">
                                    <template for:each={q.buttons} for:item="b">
                                        <button key={b.key} class={b.cls} data-id={q.id} data-value={b.value} aria-pressed={b.pressed} onclick={handleAnswer}>{b.value}</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={isSummary}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">PHR Summary</span>
                            <button class="cq-btn-ai" onclick={handleDraft}>Generate with &#10022; CQ.AI</button>
                        </div>
                        <template if:true={hasSummary}>
                            <lightning-formatted-rich-text value={summaryHtml}></lightning-formatted-rich-text>
                        </template>
                        <template if:false={hasSummary}>
                            <p class="cq-note">No summary on this review yet. Ask CQ.AI can draft one from the records, the checklist and the complaint; you say whether to save it.</p>
                        </template>
                    </div>
                </template>

                <template if:true={isReports}>
                    <div class="sect">
                        <div class="sect-head">
                            <span class="sect-title">Reports</span>
                            <button class="cq-btn-ai" onclick={handleReport}>Generate with &#10022; CQ.AI</button>
                        </div>
                        <template if:false={hasReports}>
                            <p class="cq-note">No report attached to the complaint yet.</p>
                        </template>
                        <template for:each={reports} for:item="r">
                            <div key={r.key} class="file">
                                <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                                <a href={r.link} target="_blank">{r.label}</a>
                                <lightning-formatted-date-time value={r.modified} year="numeric" month="short" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={isRecords}><span slot="foot" class="footacts">
                    <span class={footCls}>{footNote}</span>
                    <template if:true={isChecklist}>
                        <button class="cq-btn-outline" onclick={handleSaveDraft} disabled={cantSaveDraft}>Save</button>
                        <button class="cq-btn-primary" onclick={handleSubmitChecklist} disabled={cantSubmit}>Submit Checklist</button>
                    </template>
                </span></template>
        </c-cq-ws-shell>
    </div>
</template>
