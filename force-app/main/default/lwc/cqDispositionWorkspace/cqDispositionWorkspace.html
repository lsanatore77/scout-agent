<template>
    <template if:true={loadError}><div class="cq-msg crit">{loadError}</div></template>
    <template if:true={ready}>
        <c-cq-ws-shell record-id={recordId} icon="standard:incident" object-label="Nonconformance" record-name={v.name}
            fields={headerFields} show-edit agent-name="CQAI_Quality" placeholder="Ask about this disposition…" ask-step={askStep} ask-suggestions={askSuggestions}
            steps={railSteps} progress={progress} error={error}
            show-foot={notDone} blocker={blocker} back-disabled={cantBack} next-disabled={cantNext} next-outline={cantNext}
            onstep={handleStep} onback={handleBack} onnext={handleNext} onedit={handleEdit} onopen={handleShellOpen}>
                    <template if:true={showGlance}>
                        <div class="cq-cols wide">
                            <div class="cq-pcard">
                                <div class="cq-card-title">What's Wrong</div>
                                <div class="ww">
                                    <template if:true={photoUrl}><a class="wphoto" href={photoUrl} target="_blank" title="Open the photo"><img src={photoUrl} alt="Photo of the problem" /></a></template>
                                    <dl class="wkv">
                                        <dt>Failure Code</dt><dd>{failureText}<template if:true={v.failureCategory}> <span class="cq-pill soft neu">{v.failureCategory}</span></template></dd>
                                        <dt>Severity</dt><dd>{severityText}</dd>
                                        <template if:true={v.spec}><dt>Specification</dt><dd>{v.spec}</dd></template>
                                        <template if:true={v.actual}><dt>Actual</dt><dd class="bad">{v.actual}</dd></template>
                                        <template if:true={v.defective}><dt>Defective</dt><dd>{defectiveText}</dd></template>
                                    </dl>
                                </div>
                                <p class="cq-prob">{problemText}</p>
                                <div class="cq-tiles">
                                    <div class="cq-tile"><div class="cq-tile-k">Left to Dispose</div><div class="cq-tile-v">{leftText}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Lots</div><div class="cq-tile-v">{lotCount}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Approval</div><div class="cq-tile-v">{approvalText}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Due</div><div class="cq-tile-v">{dueText}</div></div>
                                </div>
                                <template if:true={v.investigationId}>
                                    <div class="winv">
                                        <span class="cq-strong">Investigation</span>
                                        <a class="cq-link" href={invHref} target="_blank">{v.investigationName}</a>
                                        <span class={invPillCls}>{invStatusText}</span>
                                        <span class="cq-muted">{causeLine}</span>
                                    </div>
                                </template>
                            </div>
                            <div class="rcol">
                            <div class="cq-ai-card">
                                <div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" question="Why does CQ.AI suggest this disposition?"></c-cq-ai-why><template if:true={v.confidence}> <span class="cq-pill soft ai">{confidenceText}</span></template></div>
                                <div class="cq-ai-verdict">{suggestHeadline}</div>
                                <div class="cq-ai-text">{v.suggestWhy}</div>
                                <template if:true={hasFactors}>
                                    <ul class="factors"><template for:each={factorRows} for:item="f"><li key={f.key}>{f.text}</li></template></ul>
                                </template>
                            </div>
                            <section class="lotscard">
                                <div class="cq-card-title">Parts and Lots to Dispose</div>
                                <div class="cq-tblwrap">
                                    <table class="cq-tbl">
                                        <thead><tr><th>Part</th><th>Lot</th><th class="num">Impacted</th><th class="num">Disposed</th><th class="num">Left</th><th>Disposition Records</th></tr></thead>
                                        <tbody>
                                            <template for:each={lotRows} for:item="l">
                                                <tr key={l.impactedId}>
                                                    <td class="cq-nowrap">
                                                        <template if:true={l.partHref}><a class="cq-link" href={l.partHref} target="_blank" title={l.partName}>{l.partLabel}</a></template>
                                                        <template if:false={l.partHref}><span title={l.partName}>{l.partLabel}</span></template>
                                                    </td>
                                                    <td class="cq-strong">{l.lot}</td>
                                                    <td class="num">{l.impactedText}</td>
                                                    <td class="num">{l.disposedText}</td>
                                                    <td class={l.leftCls}>{l.leftText}</td>
                                                    <td>
                                                        <template for:each={l.recs} for:item="r">
                                                            <div key={r.id}><a class="cq-link" href={r.href} target="_blank">{r.name}</a><span class="cq-muted">&nbsp;{r.meta}</span></div>
                                                        </template>
                                                        <template if:true={l.noRecs}><span class="cq-muted">None Yet</span></template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <template if:true={noLots}><p class="cq-note">This NC has no impacted parts or lots, so there is nothing to dispose.</p></template>
                            </section>
                            </div>
                        </div>


                        <div class="cq-cols cq-mt16">
                            <div class="yours">
                                <div class="cq-card-title">Decided at Triage</div>
                                <div class="triaged"><span class="cq-okdot sm">&#10003;</span> {triagedText}</div>
                                <ul class="flist">
                                    <li>{decidedDisp}</li>
                                    <template if:true={v.investigationId}><li>Investigation <a class="cq-link" href={invHref} target="_blank">{v.investigationName}</a></li></template>
                                </ul>
                            </div>
                            <div class="yours">
                                <div class="cq-card-title">Dispositions on This Part</div>
                                <template if:true={hasHistory}>
                                    <div class="cq-tiles">
                                        <template for:each={historyByType} for:item="h">
                                            <div key={h.type} class={h.cls}><div class="cq-tile-k">{h.type}</div><div class="cq-tile-v">{h.text}</div></div>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasHistory}><p class="cq-note">No other dispositions have been completed on this part.</p></template>
                            </div>
                        </div>
                    </template>

                    <template if:true={showDispose}>
                        <h3 class="cq-step-title">Dispose by Lot</h3>
                        <p class="cq-step-intro">{disposeIntro}</p>
                        <template if:true={v.needsApproval}>
                            <div class="cq-msg warn">This NC needs disposition approval, which this workspace does not do yet. Use the Disposition tab to send it for approval.</div>
                        </template>
                        <div class="dispgrid">
                        <div class="dispmain">
                        <template for:each={lotForms} for:item="l">
                            <section key={l.impactedId} class="lot">
                                <div class="lothead">
                                    <span class="lotname">Lot {l.lot}</span>
                                    <span class="cq-muted cq-grow">{l.partName}</span>
                                    <template if:true={l.doneText}><span class="count green">{l.doneText}</span></template>
                                </div>
                                <template if:true={l.open}>
                                    <template if:true={l.suggestText}><div class="cq-ai-card fsug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Why does CQ.AI suggest this disposition?"></c-cq-ai-why> <strong>{l.suggestText}.</strong></div></template>
                                    <template for:each={l.rows} for:item="r">
                                        <div key={r.key} class="drow">
                                            <div class="cq-field"><span class="cq-label">Type<span class="cq-req">*</span></span>
                                                <div class="cq-chips">
                                                    <template for:each={r.typeOpts} for:item="t">
                                                        <button key={t.label} class={t.cls} data-lot={l.idx} data-row={r.idx} data-type={t.label} aria-pressed={t.pressed} onclick={handleType}>{t.label}</button>
                                                    </template>
                                                </div>
                                            </div>
                                            <div class="cq-fields">
                                                <label class="cq-field"><span class="cq-label">Quantity<span class="cq-req">*</span></span>
                                                    <input class="qty" type="number" min="1" step="1" value={r.qty} data-lot={l.idx} data-row={r.idx} data-f="qty" onchange={handleField} oninput={handleField}>
                                                </label>
                                                <label class="cq-field"><span class="cq-label">Completed On<span class="cq-req">*</span></span>
                                                    <input class="date" type="date" value={r.completedOn} data-lot={l.idx} data-row={r.idx} data-f="completedOn" onchange={handleField}>
                                                </label>
                                                <label class="cq-field growf"><span class="cq-label">Comment</span>
                                                    <input type="text" value={r.comment} placeholder="For example, scrapped per the lot's SOP" data-lot={l.idx} data-row={r.idx} data-f="comment" onchange={handleField}>
                                                </label>
                                                <template if:true={r.canRemove}><button class="cq-btn-outline" data-lot={l.idx} data-row={r.idx} onclick={handleRemove}>Remove</button></template>
                                            </div>
                                            <template if:true={r.nowOk}><p class="okline">&#10003; {r.nowOk}</p></template>
                                            <template if:true={r.waitText}><div class="cq-msg warn waitbox"><strong>The root cause is not known yet.</strong> {r.waitText}</div></template>
                                            <template if:true={r.needsWhy}>
                                                <label class="cq-field"><span class="cq-label">{r.whyLabel}<span class="cq-req">*</span></span>
                                                    <textarea rows="2" value={r.justification} placeholder={r.whyHint} data-lot={l.idx} data-row={r.idx} data-f="justification" onchange={handleField} oninput={handleField}></textarea>
                                                    <span class="cq-hint">{r.whyNote}</span>
                                                </label>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="cq-splitline">
                                        <button class="cq-btn-outline" data-lot={l.idx} onclick={handleSplit}>+ Split Quantity</button>
                                        <span class="cq-note">For example, rework some units and scrap the rest.</span>
                                    </div>
                                    <template if:true={l.qtyMsg}><p class="qtymsg" role="alert">{l.qtyMsg}</p></template>
                                    <template if:true={l.draftName}><p class="cq-note">The draft {l.draftName} from triage is used for the first row, not duplicated.</p></template>
                                </template>
                            </section>
                        </template>
                        </div>
                        <aside class="signsec">
                            <div class="signhead"><span class="cq-card-title nom">Sign the Disposition</span></div>
                            <c-cq-sign-seat record-id={recordId} policy-key="compliancequest__SQX_Nonconformance__c" actions={seatActions}
                                seat="Dispositioned By" person="You" sub={signFor} status="Your Signature" tone="you" mine
                                meaning={signMeaning} comment-hint="Optional, for example scrapped per SOP-QA-021." submit={seatSubmit} disabled={cantComplete}>
                            </c-cq-sign-seat>
                            <p class="snote">On Complete Disposition each row is saved as a CQ disposition and marked Complete by you, signed for every lot and split on the left. CQ updates each lot's disposed quantity, and when nothing is left the NC's disposition is complete. Anything left on a lot gets a new draft for later.</p>
                        </aside>
                        </div>
                    </template>

                    <template if:true={showDone}>
                        <div class="cq-donehead"><span class="cq-okdot">&#10003;</span><h3 class="cq-step-title nom">{doneHeading}</h3></div>
                        <div class="cq-tblwrap cq-sum"><table class="cq-tbl">
                            <thead><tr><th>Item</th><th>Recorded</th></tr></thead>
                            <tbody><template for:each={doneRows} for:item="r"><tr key={r.key}><td class="k">{r.k}</td><td class="v">{r.v}</td></tr></template></tbody>
                        </table></div>
                        <template if:true={doneLeftNote}><div class="cq-msg warn">{doneLeftNote}</div></template>
                        <div class="cq-opts"><button class="cq-btn-primary" onclick={handleFinish}>Done</button></div>
                    </template>

        </c-cq-ws-shell>
    </template>
</template>
