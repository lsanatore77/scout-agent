<template>
    <template if:true={error}><div class="cq-msg crit">{error}</div></template>

    <template if:true={hasReview}>
        <div class="cq-box">
            <!-- standard workspace header -->
            <header class="cq-hl">
                <div class="cq-hl-top">
                    <div class="cq-hl-who">
                        <span class="cq-hl-icon"><lightning-icon icon-name="standard:incident" size="medium" alternative-text="Quality Event"></lightning-icon></span>
                        <div class="cq-hl-name">
                            <span class="cq-hl-obj">Event Review</span>
                            <span class="cq-hl-title">{review.name}</span>
                        </div>
                    </div>
                    <div class="cq-hl-actions">
                        <c-ask-cq-popover record-id={recordId} agent-name="CQAI_Quality" placeholder="Ask about this event…" step={askStep} suggestions={askSuggestions}></c-ask-cq-popover>
                        <button class="cq-btn-outline" onclick={handleEdit}>Edit</button>
                    </div>
                </div>
            </header>

            <div class="body">
                <div class="cols">
                    <!-- LEFT: the problem, its facts, and the decision -->
                    <div class="colmain">
                        <div class="card">
                            <div class="cq-card-title probhd">The Problem <span class="probby">&middot; reported by {review.reportedBy}</span></div>
                            <p class="stmt">{review.problem}</p>
                            <div class="facts">
                                <div class="factrow"><span class="factlabel">Where</span><span class="factval">{review.whereFound}</span></div>
                                <div class="factrow"><span class="factlabel">Product</span><span class="factval">{review.partLine}</span></div>
                                <div class="factrow"><span class="factlabel">Lot</span><span class="factval">{review.lot}</span></div>
                                <div class="factrow"><span class="factlabel">Units</span><span class="factval">{review.units}</span></div>
                                <div class="factrow"><span class="factlabel">Urgent</span>
                                    <template if:true={review.urgent}><span class="cq-pill crit">Yes</span></template>
                                    <template if:false={review.urgent}><span class="factval">No</span></template>
                                </div>
                            </div>
                        </div>

                        <div class="decide">
                            <div class="cq-card-title becomes">What Should This Event Become?</div>
                            <div class="choices">
                                <template for:each={review.choices} for:item="c">
                                    <button key={c.key} class={c.cls} disabled>{c.label}</button>
                                </template>
                            </div>
                            <p class="cq-note">Confirming a choice (create the NC or complaint, add to a record, or close it) is the next build. This panel is the review, read-only for now.</p>
                        </div>
                    </div>

                    <!-- RIGHT: CQ.AI recommendation, its reasoning, and the answers it flagged -->
                    <div class="cq-ai-card">
                        <div class="cq-ai-eyebrow">&#10022; CQ.AI Suggests</div>
                        <div class="cq-ai-verdict">{review.suggestion.becomes}</div>
                        <p class="cq-ai-text">{review.summary}</p>

                        <div class="cq-ai-rule"></div>

                        <div class="cq-ai-sub">Reported Answers <span class="cq-hint">&mdash; purple = what CQ.AI flagged</span></div>
                        <div class="cq-qa">
                            <template for:each={review.answers} for:item="a">
                                <div key={a.question} class={a.cls}><span class="cq-qa-k">{a.question}</span><span class="cq-qa-v">{a.answer}</span></div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
