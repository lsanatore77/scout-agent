<template>
    <template if:false={ready}><template if:true={error}><div class="cq-msg crit errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="cq-sechead">
            <h3 class="cq-step-title nom">Closure</h3>
            <span class={statePill}>{stateText}</span>
            <template if:true={closedLine}><span class="cq-sub">{closedLine}</span></template>
        </div>
        <p class="cq-step-intro">{intro}</p>

        <div class="cq-cols">
            <section class="cq-stepcard">
                <div class="cq-stepcard-head"><span class="cq-stepcard-n">1</span><span class="cq-stepcard-title">Closure Checklist</span><span class="cq-grow"></span><span class="cq-stepcard-tot">{checkLine}</span></div>
                <template for:each={groups} for:item="g">
                    <div key={g.key} class="cq-checks">
                        <div class="cq-grouplabel">{g.label}</div>
                        <template for:each={g.rows} for:item="c">
                            <div key={c.key} class="cq-check">
                                <span class={c.markCls} aria-label={c.state}>{c.mark}</span>
                                <span class="cq-check-body"><span>{c.text}</span><span class="cq-sub block">{c.detail}</span>
                                    <template if:true={c.createCapa}><button class="cq-link" onclick={handleCreateCapa}>Create CAPA</button></template>
                                </span>
                                <template if:true={c.hasGo}><button class="cq-link" data-step={c.goStep} onclick={handleGo}>{c.goLabel}</button></template>
                            </div>
                        </template>
                    </div>
                </template>
                <span class="cq-hint">Ticked automatically from the earlier steps. &#10005; items must be done before closing; ! items are flagged but do not stop it.</span>
            </section>

            <div class="cq-col lead">
                <section class="cq-stepcard">
                    <div class="cq-stepcard-head"><span class="cq-stepcard-n">2</span><span class="cq-stepcard-title">Closure Summary</span><span class="cq-grow"></span>
                        <template if:true={isDraft}><span class="aitag">&#10022; Drafted by CQ.AI</span></template>
                        <template if:true={canRedraft}><button class="cq-link" onclick={handleRedraft} disabled={busy}>&#10022; Redraft</button></template></div>
                    <div class="cq-field"><textarea class="ta" rows="5" value={summaryText} disabled={locked} oninput={handleSummaryInput} onchange={handleSummary} aria-label="Closure summary"></textarea></div>
                    <template if:false={locked}><span class="cq-hint">Edit freely. Redraft brings back CQ.AI's draft from the current checklist.</span></template>
                </section>
                <section class="cq-stepcard">
                    <div class="cq-stepcard-head"><span class="cq-stepcard-n">3</span><span class="cq-stepcard-title">What Follows</span></div>
                    <div class="cq-field">
                        <span class="cq-label">CAPA<span class="cq-req">*</span></span>
                        <template if:true={hasCapa}>
                            <div class="capa">
                                <span class="cq-stack"><a class="cq-link" href={capaUrl} target="_blank">{v.capaName}</a><span class="cq-sub block">{v.capaTitle}</span></span>
                                <template if:true={v.capaStatus}><span class={capaStatusCls}>{v.capaStatus}</span></template>
                                <template if:false={locked}><button class="cq-btn-outline" onclick={handleUnlink} disabled={busy}>Unlink</button></template>
                            </div>
                            <span class="cq-hint">Root cause and prevention continue in this CAPA. The field action can close while the CAPA carries on.</span>
                        </template>
                        <template if:true={noCapa}>
                            <div class="capaopts">
                                <button class="cq-btn-primary" onclick={handleCreateCapa} disabled={cantCreate}>Create CAPA</button>
                                <span class="or">or</span>
                                <select class="cq-grow" onchange={handleCapa} disabled={cantCreate} aria-label="Link an Existing CAPA">
                                    <template for:each={capaOpts} for:item="o">
                                        <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                    </template>
                                </select>
                            </div>
                            <span class="cq-hint">Create CAPA makes a new CAPA - Field Action record for this field action, due in 60 days, and links it here. Fill it in on the CAPA.</span>
                        </template>
                    </div>
                </section>
            </div>
        </div>
        <template if:true={error}><div class="cq-msg crit errbox">{error}</div></template>
    </template>
</template>
