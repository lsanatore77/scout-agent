<template>
    <template if:false={ready}><template if:true={error}><div class="errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="box">
            <header class="hl">
                <div class="hl-top">
                    <div class="hl-who">
                        <span class="hl-icon"><lightning-icon icon-name="custom:custom87" size="medium" alternative-text="Field Action"></lightning-icon></span>
                        <div class="hl-name">
                            <span class="hl-obj">Field Action</span>
                            <span class="hl-title">{v.name}</span>
                        </div>
                    </div>
                    <div class="hl-actions">
                        <button class="btn" onclick={handleEdit}>Edit</button>
                        <button class="btn icon" onclick={handleRefresh} title="Refresh" aria-label="Refresh"><lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon></button>
                        <c-ask-cq-popover record-id={recordId} suggestions="Summarize this field action,Which lots are in scope?,What is left on this field action?"></c-ask-cq-popover>
                    </div>
                </div>
                <div class="hl-fields">
                    <div class="f"><span class="k">Part</span><span class="v">{partText}</span></div>
                    <div class="f"><span class="k">Action Type</span><span class="v">{v.actionType}</span></div>
                    <div class="f"><span class="k">Recall Class</span><span class="v">{classText}</span></div>
                    <div class="f"><span class="k">Scope</span><span class="v">{scopeText}</span></div>
                    <div class="f"><span class="k">Status</span><span class="v">{v.status}</span></div>
                </div>
            </header>
            <div class="body">
                <nav class="steps" aria-label="Field action steps">
                    <div class="steps-title">Field action steps</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt"><span class="lbl">{s.label}</span><span class="ssub">{s.sub}</span></span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                </nav>
                <div class="main">

                    <template if:true={is0}>
                        <h3 class="q">Field Action at a Glance</h3>
                        <div class="cols wide">
                            <div class="col lead">
                                <div class="card sug sumcard">
                                    <div class="lab">What Was Decided</div>
                                    <div class="big">{v.title}</div>
                                    <div class="sumrow">
                                        <span class="spill state">{v.actionType}</span>
                                        <template if:true={v.recallClass}><span class="spill state">{v.recallClass}</span></template>
                                        <template if:true={v.scope}><span class={scopePill}>{v.scope} Scope</span></template>
                                        <span class="rk">{decidedLine}</span>
                                    </div>
                                    <template if:true={v.rationale}><div class="para">{v.rationale}</div></template>
                                    <div class="tiles">
                                        <template for:each={tiles} for:item="t">
                                            <div key={t.key} class="tile"><div class="tl">{t.label}</div><div class="tv">{t.value}</div></div>
                                        </template>
                                    </div>
                                </div>
                                <template if:true={v.hazard}>
                                    <div class="card">
                                        <div class="lab">Health Hazard Summary</div>
                                        <div class="para">{v.hazard}</div>
                                    </div>
                                </template>
                                <div class="card">
                                    <div class="lab">Reviews That Led Here</div>
                                    <template if:true={hasReviews}>
                                        <template for:each={reviews} for:item="r">
                                            <div key={r.id} class="revrow">
                                                <span class="fn">
                                                    <span><button class="link" data-id={r.id} onclick={handleOpen}>{r.name}</button> <span class="rk">{r.meta}</span></span>
                                                    <span class="rk">{r.approval}</span>
                                                    <template if:true={r.rationale}><span class="rk">{r.rationale}</span></template>
                                                </span>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={hasReviews}><p class="note">No review is linked to this field action.</p></template>
                                </div>
                            </div>
                            <div class="card">
                                <div class="lab">Signals on This Part</div>
                                <template if:true={hasSignals}>
                                    <template for:each={signals} for:item="s">
                                        <div key={s.id} class="krow">
                                            <span class="fn"><span class="sgh"><span class="sgt">{s.rule}</span><span class={s.pillCls}>{s.strength}</span><span class="rk">{s.where}</span></span><span class="rk">{s.label}</span></span>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasSignals}><p class="note">No signals at Assess or above on this part.</p></template>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <div class="sechead"><h3 class="q nom">Scope</h3>
                            <template if:true={v.scope}><span class={scopePill}>{v.scope}</span></template>
                            <span class={statePill}>{stateText}</span>
                        </div>
                        <p class="p top14">{scopeIntro}</p>

                        <template if:true={hasLots}>
                            <div class="tbar">
                                <div class="togs" role="group" aria-label="Which lots to show">
                                    <button class={allTab} data-v="all" onclick={handleView} aria-pressed={allPressed}>All Lots</button>
                                    <button class={inTab} data-v="in" onclick={handleView} aria-pressed={inPressed}>In Scope</button>
                                </div>
                                <span class="rk">{countLine}</span>
                                <span class={pendingCls}>{pendingLine}</span>
                                <template if:true={isPartial}>
                                    <div class="cact">
                                        <span class="rk">{confirmHint}</span>
                                        <button class="btn" onclick={handleDiscard} disabled={cantDiscard}>Discard Changes</button>
                                        <button class="btn primary" onclick={handleConfirm} disabled={cantConfirm}>{confirmLabel}</button>
                                    </div>
                                </template>
                            </div>
                            <div class="tblwrap tree">
                                <table class="lottable">
                                    <thead><tr>
                                        <th class="cscope"><span class="sc"><button class="chev" onclick={handleAll} aria-label={allLabel} title={allLabel} aria-expanded={allExpanded}>{allChev}</button>Scope</span></th><th>Level / Item</th><th>Part &middot; Rev</th><th>Lot</th><th class="num">Qty</th><th>Supplier</th><th>Trace</th>
                                        <th class="num">Shipped</th><th class="num">On Hand</th><th>Location</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={rows} for:item="r">
                                            <tr key={r.key} class={r.rowCls}>
                                                <template if:true={r.isNote}>
                                                    <td></td>
                                                    <td colspan="9"><span class="ind" style={r.indentStyle}></span><span class="chev0"></span><span class="rk">{r.text}</span></td>
                                                </template>
                                                <template if:true={r.isLot}>
                                                    <td class="cscope">
                                                        <span class="sc">
                                                            <template if:true={r.showCheck}>
                                                                <input class="tick" type="checkbox" data-name={r.name} checked={r.checked} disabled={r.checkDisabled} onchange={handleTick} aria-label={r.checkLabel} />
                                                            </template>
                                                            <template if:true={r.added}><span class="spill added" title={r.addedTitle}>Added</span></template>
                                                            <template if:true={r.removing}><span class="spill removing">Removing</span></template>
                                                        </span>
                                                    </td>
                                                    <td class="nw">
                                                        <span class="ind" style={r.indentStyle}></span>
                                                        <template if:true={r.hasKids}><button class="chev" data-key={r.key} onclick={handleToggle} aria-label={r.toggleLabel} aria-expanded={r.openText}>{r.chev}</button></template>
                                                        <template if:true={r.noKids}><span class="chev0"></span></template>
                                                        <span class={r.itemCls}>{r.item}</span>
                                                        <template if:true={r.pendingAdd}><span class="spill notconf">Not Confirmed</span></template>
                                                        <template if:true={r.suggested}><span class="pill ai" title={r.why}>&#10022; CQ.AI Suggests</span></template>
                                                    </td>
                                                    <td class="nw mut">{r.partRev}</td>
                                                    <td class="nw">{r.lot}</td>
                                                    <td class="num">{r.qty}</td>
                                                    <td class="nw mut">{r.supplier}</td>
                                                    <td class="nw"><span class={r.traceCls}>{r.trace}</span></td>
                                                    <template if:true={r.editable}>
                                                        <template if:true={r.isEditing}>
                                                            <td class="num"><input class="ta ni" type="number" min="0" data-id={r.rowId} data-f="shipped" value={r.shippedVal} onchange={handleQty} aria-label="Units shipped" /></td>
                                                            <td class="num"><input class="ta ni" type="number" min="0" data-id={r.rowId} data-f="onHand" value={r.onHandVal} onchange={handleQty} aria-label="Units on hand" /></td>
                                                            <td><span class="locwrap"><input class="ta ti" type="text" data-id={r.rowId} data-f="location" value={r.locVal} onchange={handleQty} aria-label="Location" />
                                                                <button class="btn xs primary" data-id={r.rowId} onclick={handleSaveLot} disabled={saving}>Save</button>
                                                                <button class="btn xs" onclick={handleCancelEdit}>Cancel</button></span></td>
                                                        </template>
                                                        <template if:true={r.notEditing}>
                                                            <td class="num"><button class="cell num" data-id={r.rowId} onclick={handleStartEdit} title="Click to edit" aria-label={r.editLabel}>{r.shippedText}</button></td>
                                                            <td class="num"><button class="cell num" data-id={r.rowId} onclick={handleStartEdit} title="Click to edit" aria-label={r.editLabel}>{r.onHandText}</button></td>
                                                            <td><button class="cell" data-id={r.rowId} onclick={handleStartEdit} title="Click to edit" aria-label={r.editLabel}>{r.locText}<span class="pen" aria-hidden="true">&#9998;</span></button></td>
                                                        </template>
                                                    </template>
                                                    <template if:false={r.editable}><td></td><td></td><td></td></template>
                                                </template>
                                                <template if:true={r.isNode}>
                                                    <td class="cscope"></td>
                                                    <td class="nw">
                                                        <span class="ind" style={r.indentStyle}></span>
                                                        <template if:true={r.hasKids}><button class="chev" data-key={r.key} onclick={handleToggle} aria-label={r.toggleLabel} aria-expanded={r.openText}>{r.chev}</button></template>
                                                        <template if:true={r.noKids}><span class="chev0"></span></template>
                                                        <span class={r.itemCls}>{r.item}</span>
                                                    </td>
                                                    <td class="nw mut">{r.partRev}</td>
                                                    <td class="nw">{r.lot}</td>
                                                    <td class="num">{r.qty}</td>
                                                    <td class="nw mut">{r.supplier}</td>
                                                    <td class="nw"><span class={r.traceCls}>{r.trace}</span></td>
                                                    <td></td><td></td><td></td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <p class="note">Click shipped, on hand or location to edit them: no distribution or inventory data is connected. Sub-assemblies and components come with their lot, so they have no tick box.</p>
                        </template>
                        <template if:false={hasLots}><p class="note">No lots of this part were found.</p></template>

                        <div class="sec">
                            <div class="lab">Scope Changes</div>
                            <template if:true={hasChanges}>
                                <template for:each={changes} for:item="c">
                                    <div key={c.key} class="logrow"><span class="logwhen">{c.at}</span><span class="fn"><span>{c.line}</span><span class="rk">{c.by}</span></span></div>
                                </template>
                            </template>
                            <template if:false={hasChanges}><p class="note">No confirmed changes yet.</p></template>
                        </div>
                    </template>

                    <template if:true={error}><div class="errbox">{error}</div></template>
                    <div class="foot">
                        <button class="btn" onclick={handleBack} disabled={cantBack}>Back</button>
                        <button class="btn primary" onclick={handleNext} disabled={cantNext}>Next</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
