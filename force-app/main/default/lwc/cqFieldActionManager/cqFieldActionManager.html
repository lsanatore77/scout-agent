<template>
    <template if:false={ready}><template if:true={error}><div class="cq-msg crit errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="cq-box">
            <header class="cq-hl">
                <div class="cq-hl-top">
                    <div class="cq-hl-who">
                        <span class="cq-hl-icon"><lightning-icon icon-name="custom:custom87" size="medium" alternative-text="Field Action"></lightning-icon></span>
                        <div class="cq-hl-name">
                            <span class="cq-hl-obj">Field Action</span>
                            <span class="cq-hl-title">{v.name}</span>
                        </div>
                    </div>
                    <div class="cq-hl-actions">
                        <c-ask-cq-popover record-id={recordId} agent-name="CQAI_Field_Action" step={askStep} suggestions={askSuggestions} onaskcqaction={handleAskAction}></c-ask-cq-popover>
                        <button class="cq-btn-outline" onclick={handleEdit}>Edit</button>
                    </div>
                </div>
                <div class="cq-hl-fields">
                    <div class="cq-hl-f"><span class="cq-hl-k">Part</span><span class="cq-hl-v">{partText}</span></div>
                    <div class="cq-hl-f"><span class="cq-hl-k">Action Type</span><span class="cq-hl-v">{v.actionType}</span></div>
                    <div class="cq-hl-f"><span class="cq-hl-k">Recall Class</span><span class="cq-hl-v">{classText}</span></div>
                    <div class="cq-hl-f"><span class="cq-hl-k">Scope</span><span class="cq-hl-v">{scopeText}</span></div>
                    <div class="cq-hl-f"><span class="cq-hl-k">Status</span><span class="cq-hl-v">{v.status}</span></div>
                </div>
            </header>
            <div class="cq-ws-body">
                <nav class="cq-rail" aria-label="Field Action Steps">
                    <div class="cq-rail-title"><span class="star">&#10022;</span> CQ.AI Field Action Steps</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt"><span class="lbl">{s.label}</span><span class={s.subCls}>{s.sub}</span></span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                </nav>
                <div class="cq-ws-main">

                    <template if:true={is0}>
                        <h3 class="cq-step-title">Field Action at a Glance</h3>
                        <div class="cq-cols top wide32">
                            <div class="cq-col lead">
                                <div class="card sumcard">
                                    <div class="lab quiet">What Was Decided</div>
                                    <div class="cq-big">{v.title}</div>
                                    <div class="sumrow">
                                        <span class="cq-pill soft neu">{v.actionType}</span>
                                        <template if:true={v.recallClass}><span class="cq-pill soft neu">{v.recallClass}</span></template>
                                        <template if:true={v.scope}><span class={scopePill}>{v.scope} Scope</span></template>
                                        <span class="cq-sub">{decidedLine}</span>
                                    </div>
                                    <template if:true={v.rationale}><div class="cq-para">{v.rationale}</div></template>
                                    <template if:true={v.hazard}><div class="hazline"><span class="hazk">Health Hazard</span><span class="hazv">{v.hazard}</span></div></template>
                                    <div class="cq-tiles">
                                        <template for:each={tiles} for:item="t">
                                            <div key={t.key} class="cq-tile"><div class="cq-tile-k">{t.label}</div><div class="cq-tile-v">{t.value}</div></div>
                                        </template>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="lab">Reviews That Led Here</div>
                                    <template if:true={hasReviews}>
                                        <div class="cq-tblwrap">
                                            <table class="cq-tbl">
                                                <thead><tr><th class="chcol"><span class="sr">Open</span></th><th>Review</th><th>Source</th><th>Lot</th><th>Risk</th><th>Decided</th></tr></thead>
                                                <tbody>
                                                    <template for:each={reviewRows} for:item="r">
                                                        <template if:true={r.isRev}>
                                                            <tr key={r.key}>
                                                                <td class="chcol"><template if:true={r.rationale}><button class="rchevbtn" data-id={r.id} onclick={handleRevToggle} aria-expanded={r.expanded} aria-label={r.toggleLabel}><span class={r.chevCls} aria-hidden="true">&#8250;</span></button></template></td>
                                                                <td class="wide"><button class="cq-link" data-id={r.id} onclick={handleOpen}>{r.name}</button><div class="cq-sub">{r.approval}</div></td>
                                                                <td class="cq-nowrap">{r.source}</td>
                                                                <td class="cq-nowrap">{r.lotText}</td>
                                                                <td class="cq-nowrap">{r.riskText}</td>
                                                                <td class="cq-nowrap">{r.dayText}</td>
                                                            </tr>
                                                        </template>
                                                        <template if:true={r.isWhy}>
                                                            <tr key={r.key} class="evrow"><td></td><td colspan="5" class="cq-sub">{r.text}</td></tr>
                                                        </template>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>
                                    <template if:false={hasReviews}><p class="cq-note">No review is linked to this field action.</p></template>
                                </div>
                            </div>
                            <div class="card">
                                <div class="lab">Signals on This Part</div>
                                <template if:true={hasSignals}>
                                    <div class="cq-tblwrap sigwrap" style={sigTableStyle}>
                                        <table class="cq-tbl">
                                            <thead><tr><th>Signal</th><th>What We See</th></tr></thead>
                                            <tbody>
                                                <template for:each={signalPage} for:item="s">
                                                    <tr key={s.id}>
                                                        <td class="sigcell"><div class="sgh"><span class="cq-strong">{s.rule}</span><span class={s.pillCls}>{s.strength}</span></div><div class="cq-sub">{s.where}</div></td>
                                                        <td class="wide">{s.label}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <template if:true={hasSigPages}>
                                        <div class="cq-pager">
                                            <nav class="cq-pages" aria-label="Signal pages">
                                                <button class="pg" onclick={handleSigPrev} disabled={cantPrevSig} aria-label="Previous page">&laquo;</button>
                                                <template for:each={sigPageItems} for:item="p">
                                                    <button key={p.key} class={p.cls} data-p={p.p} onclick={handleSigPage} disabled={p.off} aria-current={p.current} aria-label={p.label}>{p.text}</button>
                                                </template>
                                                <button class="pg" onclick={handleSigNext} disabled={cantNextSig} aria-label="Next page">&raquo;</button>
                                            </nav>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasSignals}><p class="cq-note">No signals at Assess or above on this part.</p></template>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <div class="cq-sechead"><h3 class="cq-step-title nom">Scope</h3>
                            <template if:true={v.scope}><span class={scopePill}>{v.scope}</span></template>
                            <span class={statePill}>{stateText}</span>
                        </div>
                        <template if:true={noScope}><p class="cq-step-intro cq-mt14">This field action has no scope set. It was decided before scope was part of the review.</p></template>

                        <template if:true={hasLots}>
                            <div class="tbar">
                                <div class="cq-chips" role="group" aria-label="Which lots to show">
                                    <button class={allTab} data-v="all" onclick={handleView} aria-pressed={allPressed}>All Lots</button>
                                    <button class={inTab} data-v="in" onclick={handleView} aria-pressed={inPressed}>In Scope</button>
                                </div>
                                <template if:true={pendingLine}><span class="pendline warn">{pendingLine}</span></template>
                            </div>
                            <div class="cq-tblwrap tree" style={tableStyle}>
                                <table class="cq-tbl">
                                    <thead><tr>
                                        <th class="cscope"><span class="sc"><button class="chev" onclick={handleAll} aria-label={allLabel} title={allLabel} aria-expanded={allExpanded}>{allChev}</button>Scope</span></th><th>Level / Item</th><th>Part &middot; Rev</th><th>Lot</th><th class="num">Qty</th><th>Supplier</th><th>Trace</th>
                                        <th class="num">Shipped</th><th class="num">On Hand</th><th>Location</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={rows} for:item="r">
                                            <tr key={r.key} class={r.rowCls}>
                                                <template if:true={r.isNote}>
                                                    <td></td>
                                                    <td colspan="9"><span class="ind" style={r.indentStyle}></span><span class="chev0"></span><span class="cq-sub">{r.text}</span></td>
                                                </template>
                                                <template if:true={r.isLot}>
                                                    <td class="cscope">
                                                        <span class="sc">
                                                            <template if:true={r.showCheck}>
                                                                <input class="tick" type="checkbox" data-name={r.name} checked={r.checked} disabled={r.checkDisabled} onchange={handleTick} aria-label={r.checkLabel} />
                                                            </template>
                                                            <template if:true={r.added}><span class="cq-pill soft pos" title={r.addedTitle}>Added</span></template>
                                                            <template if:true={r.removing}><span class="cq-pill soft crit">Removing</span></template>
                                                        </span>
                                                    </td>
                                                    <td class="cq-nowrap">
                                                        <span class="ind" style={r.indentStyle}></span>
                                                        <template if:true={r.hasKids}><button class="chev" data-key={r.key} onclick={handleToggle} aria-label={r.toggleLabel} aria-expanded={r.openText}>{r.chev}</button></template>
                                                        <template if:true={r.noKids}><span class="chev0"></span></template>
                                                        <span class={r.itemCls}>{r.item}</span>
                                                        <template if:true={r.pendingAdd}><span class="cq-pill soft warn notconf">Not Confirmed</span></template>
                                                        <template if:true={r.suggested}>&nbsp;&nbsp;<c-cq-ai-why variant="pill" tip={r.why} lead="Why does CQ.AI suggest including " subject={r.item}></c-cq-ai-why></template>
                                                    </td>
                                                    <td class="cq-nowrap cq-muted">{r.partRev}</td>
                                                    <td class="cq-nowrap">{r.lot}</td>
                                                    <td class="num">{r.qty}</td>
                                                    <td class="cq-nowrap cq-muted">{r.supplier}</td>
                                                    <td class="cq-nowrap"><span class={r.traceCls}>{r.trace}</span></td>
                                                    <template if:true={r.showStock}>
                                                        <td class="num">{r.shippedText}</td>
                                                        <td class="num pos">
                                                            <template if:true={r.canOpen}><button class="ohbtn" data-key={r.key} onclick={handleStock} aria-expanded={r.stockExpanded} aria-label={r.popLabel}>{r.onHandText}</button></template>
                                                            <template if:false={r.canOpen}>{r.onHandText}</template>
                                                            <template if:true={r.stockOpen}>
                                                                <div class="pop" role="dialog" aria-label={r.popLabel}>
                                                                    <div class="pophead"><span class="b">Lot {r.name}</span><span class="cq-grow"></span><span class="cq-sub">{r.onHandText} on hand</span></div>
                                                                    <template for:each={r.places} for:item="k">
                                                                        <div key={k.key} class="poprow"><a class="cq-ploc" href={k.href} target="_blank">{k.location}</a><span class="cq-grow"></span><span>{k.units}</span></div>
                                                                    </template>
                                                                    <span class="cq-sub">{r.asOfText}</span>
                                                                </div>
                                                            </template>
                                                        </td>
                                                        <td class="cq-nowrap">
                                                            <template if:true={r.noPlaces}><span class="cq-muted">{r.locText}</span></template>
                                                            <template for:each={r.places} for:item="k">
                                                                <span key={k.key}><a class="cq-ploc" href={k.href} target="_blank">{k.location}</a> {k.units}<template if:true={k.sep}><span class="cq-dotsep"> &middot; </span></template></span>
                                                            </template>
                                                        </td>
                                                    </template>
                                                    <template if:false={r.showStock}><td></td><td></td><td></td></template>
                                                </template>
                                                <template if:true={r.isNode}>
                                                    <td class="cscope"></td>
                                                    <td class="cq-nowrap">
                                                        <span class="ind" style={r.indentStyle}></span>
                                                        <template if:true={r.hasKids}><button class="chev" data-key={r.key} onclick={handleToggle} aria-label={r.toggleLabel} aria-expanded={r.openText}>{r.chev}</button></template>
                                                        <template if:true={r.noKids}><span class="chev0"></span></template>
                                                        <span class={r.itemCls}>{r.item}</span>
                                                    </td>
                                                    <td class="cq-nowrap cq-muted">{r.partRev}</td>
                                                    <td class="cq-nowrap">{r.lot}</td>
                                                    <td class="num">{r.qty}</td>
                                                    <td class="cq-nowrap cq-muted">{r.supplier}</td>
                                                    <td class="cq-nowrap"><span class={r.traceCls}>{r.trace}</span></td>
                                                    <td></td><td></td><td></td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <template if:true={hasPages}>
                                <div class="cq-pager">
                                    <nav class="cq-pages" aria-label="Lot pages">
                                        <button class="pg" onclick={handlePrevPage} disabled={cantPrevPage} aria-label="Previous page">&laquo;</button>
                                        <template for:each={pageItems} for:item="p">
                                            <button key={p.key} class={p.cls} data-p={p.p} onclick={handlePage} disabled={p.off} aria-current={p.current} aria-label={p.label}>{p.text}</button>
                                        </template>
                                        <button class="pg" onclick={handleNextPage} disabled={cantNextPage} aria-label="Next page">&raquo;</button>
                                    </nav>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasLots}><p class="cq-note">No lots of this part were found.</p></template>

                        <div class="sec">
                            <div class="lab">Scope Changes</div>
                            <template if:true={hasChanges}>
                                <template for:each={changes} for:item="c">
                                    <div key={c.key} class="logrow"><span class="logwhen">{c.at}</span><span class="cq-stack"><span>{c.line}</span><span class="cq-sub">{c.by}</span></span></div>
                                </template>
                            </template>
                            <template if:false={hasChanges}><p class="cq-note">No confirmed changes yet.</p></template>
                        </div>
                    </template>

                    <template if:true={is2}>
                        <c-cq-field-action-strategy data-step="strategy" record-id={recordId} onstrategychange={handleStrategyChange} onfootchange={handleFootChange}></c-cq-field-action-strategy>
                    </template>
                    <template if:true={is5}>
                        <c-cq-field-action-recovery data-step="recovery" record-id={recordId} onrailchange={handleRailChange} onfootchange={handleFootChange}></c-cq-field-action-recovery>
                    </template>
                    <template if:true={is6}>
                        <c-cq-field-action-closure data-step="closure" record-id={recordId} onrailchange={handleRailChange} onfootchange={handleFootChange}></c-cq-field-action-closure>
                    </template>

                    <template if:true={error}><div class="cq-msg crit errbox">{error}</div></template>
                    <div class="cq-ws-foot">
                        <template if:true={showStepAction}>
                            <span class="cq-blocker">{foot.blocker}</span>
                            <button class="cq-btn-primary" onclick={handleStepAction} disabled={foot.disabled}>{foot.label}</button>
                        </template>
                        <template if:true={is1}><template if:true={isPartial}><template if:true={hasLots}>
                            <button class="cq-btn-primary" onclick={handleConfirm} disabled={cantConfirm}>{confirmLabel}</button>
                        </template></template></template>
                        <button class="cq-btn-outline" onclick={handleBack} disabled={cantBack}>Back</button>
                        <button class={nextCls} onclick={handleNext} disabled={cantNext}>Next</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
