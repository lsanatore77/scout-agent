<template>
    <template if:false={ready}><template if:true={error}><div class="errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="sechead">
            <h3 class="q">Recovery and Effectiveness</h3>
            <span class={statePill}>{stateText}</span>
            <template if:true={verdictLine}><span class="rk in">{verdictLine}</span></template>
        </div>
        <template if:true={needsStrategy}><p class="note">Confirm the strategy first: recovery is measured against it.</p></template>

        <template if:true={showStep}>
            <p class="p">{intro}</p>

            <template if:true={isNotice}><p class="note">An advisory notice leaves the product in use, so there are no units to recover. Effectiveness rests on the customers acknowledging.</p></template>
            <template if:true={showRecovery}>
            <section class="card">
                <div class="ch"><span class="cn">1</span><span class="ct">Recovery by Lot</span><span class="grow"></span><span class="tot">{recoveryLine}</span></div>
                <div class="tblwrap">
                    <table class="ht">
                        <thead><tr>
                            <th>Lot</th><th class="num">Shipped</th>
                            <template if:true={showCorrected}><th class="num">Corrected</th></template>
                            <th class="num">Returned</th>
                            <template if:true={showDestroyed}><th class="num">Destroyed</th></template>
                            <th class="num">Still in Field</th><th class="barcol">Recovered</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={lotRows} for:item="l">
                                <tr key={l.id}>
                                    <td class="b nw">{l.lot}</td>
                                    <td class="num">{l.shippedText}</td>
                                    <template if:true={showCorrected}><td class="num">{l.correctedText}</td></template>
                                    <td class="num">{l.returnedText}</td>
                                    <template if:true={showDestroyed}><td class="num">{l.destroyedText}</td></template>
                                    <td class={l.fieldCls}>{l.fieldText}</td>
                                    <td class="barcol"><template if:true={l.hasPct}><span class="barrow"><span class="track"><span class="fill" style={l.barStyle}></span></span><span class="pct">{l.pctText}</span></span></template></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <span class="hint">{tableHint}</span>
            </section>
            </template>

            <div class="tcards" role="group" aria-label="Filter tasks">
                <template for:each={cards} for:item="c">
                    <button key={c.key} class={c.cls} data-key={c.key} aria-pressed={c.pressed} onclick={handleCard}>
                        <span class="tlab">{c.label}</span><span class={c.numCls}>{c.n}</span>
                    </button>
                </template>
            </div>

            <div class="grid">
                <section class="card">
                    <div class="ch mid"><span class="cn">2</span><span class="ct">Customers and Tasks</span><span class="grow"></span>
                        <template if:true={filterLine}><span class="hint">{filterLine}</span></template>
                        <button class="btn sm" onclick={handleOpenAdd} disabled={locked}>+ Add Task</button>
                    </div>

                    <template if:true={adding}>
                        <div class="addform">
                            <label class="fld"><span class="fl">Customer</span>
                                <select class="sel" data-f="customerId" onchange={handleForm}>
                                    <template for:each={custOpts} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                                </select></label>
                            <template if:true={isNewCustomer}>
                                <label class="fld"><span class="fl">New customer *</span>
                                    <input class="ta in" type="text" data-f="newCustomer" value={form.newCustomer} oninput={handleForm} /></label>
                            </template>
                            <label class="fld"><span class="fl">Lot</span>
                                <select class="sel" data-f="lot" onchange={handleForm}>
                                    <template for:each={lotOpts} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                                </select></label>
                            <label class="fld"><span class="fl">Type</span>
                                <select class="sel" data-f="type" onchange={handleForm}>
                                    <template for:each={typeOpts} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                                </select></label>
                            <label class="fld wide"><span class="fl">Task</span>
                                <input class="ta in" type="text" data-f="subject" value={form.subject} placeholder={subjectHint} oninput={handleForm} /></label>
                            <label class="fld"><span class="fl">Assigned to</span>
                                <select class="sel" data-f="ownerId" onchange={handleForm}>
                                    <template for:each={ownerOpts} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template>
                                </select></label>
                            <label class="fld"><span class="fl">Due</span>
                                <input class="ta in" type="date" data-f="due" value={form.due} onchange={handleForm} /></label>
                            <template if:true={formHasUnits}>
                                <label class="fld"><span class="fl">Units so far</span>
                                    <input class="ta in w80" type="number" min="0" data-f="units" value={form.units} oninput={handleForm} /></label>
                            </template>
                            <div class="formbtns">
                                <button class="btn sm primary" onclick={handleAdd} disabled={cantAdd}>Add</button>
                                <button class="btn sm" onclick={handleOpenAdd}>Cancel</button>
                            </div>
                        </div>
                    </template>

                    <template if:true={hasSuggestions}>
                        <div class="ai row">
                            <span class="grow"><span class="aih">&#10022; CQ.AI Suggests:</span> {t.suggestLine}</span>
                            <button class="btn xs ghost" onclick={handleReview} aria-expanded={reviewing}>Review</button>
                        </div>
                        <template if:true={reviewing}>
                            <div class="sugg">
                                <template for:each={suggestRows} for:item="s">
                                    <label key={s.key} class="srow">
                                        <input type="checkbox" data-key={s.key} checked={s.checked} onchange={handleKeep} aria-label={s.label} />
                                        <span class="grow">{s.subject}</span><span class="rk in nw">{s.due}</span>
                                    </label>
                                </template>
                                <div class="formbtns">
                                    <button class="btn sm primary" onclick={handleCreate} disabled={cantCreate}>{createLabel}</button>
                                    <button class="btn sm" onclick={handleReview}>Cancel</button>
                                    <span class="hint">Assigned to you; reassign any task from the Add Task form or the Task record.</span>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:true={hasRows}>
                        <div class="tblwrap">
                            <table class="ht tt">
                                <thead><tr>
                                    <th><span class="hcell"><button class="chev" onclick={handleToggleAll} aria-label={allLabel}>{allChev}</button>Customer / Lot / Task</span></th>
                                    <th>Owner</th><th>Due</th><th class="num">Status</th>
                                </tr></thead>
                                <tbody>
                                    <template for:each={rows} for:item="r">
                                        <tr key={r.key}>
                                            <template if:true={r.isCust}>
                                                <td class="crow"><span class="cell2">
                                                    <button class="chev" data-id={r.id} onclick={handleToggle} aria-label={r.toggleLabel}>{r.chev}</button>
                                                    <span class="fn"><span class="b">{r.title}</span><span class="rk">{r.sub}</span></span></span></td>
                                                <td class="crow"></td><td class="crow"></td>
                                                <td class="crow num"><template if:true={r.hasPill}><span class={r.pillCls}>{r.pill}</span></template></td>
                                            </template>
                                            <template if:true={r.isLot}>
                                                <td><span class="cell2"><span class="ind i1"></span>
                                                    <span class="fn"><span class="lotn">{r.title}</span><span class="rk">{r.sub}</span></span></span></td>
                                                <td></td><td></td><td></td>
                                            </template>
                                            <template if:true={r.isTask}>
                                                <td><span class="cell2"><span class={r.indentCls}></span>
                                                    <input class="tick" type="checkbox" data-id={r.id} checked={r.done} onchange={handleCheck} disabled={locked} aria-label={r.checkLabel} />
                                                    <span class="fn">
                                                        <a class="tlink" href={r.href} target="_blank">{r.title}</a>
                                                        <template if:true={r.hasUnits}>
                                                            <template if:true={r.notEditingUnits}>
                                                                <button class="ulink" data-id={r.id} onclick={handleEditUnits} disabled={locked} title="Click to edit">{r.unitsText}</button>
                                                            </template>
                                                            <template if:true={r.editingUnits}>
                                                                <span class="locwrap">
                                                                    <input class="ta ni" type="number" min="0" value={r.unitsVal} oninput={handleUnitsInput} aria-label="Units" />
                                                                    <button class="btn xs primary" onclick={handleUnitsSave} disabled={busy}>Save</button>
                                                                    <button class="btn xs" onclick={handleUnitsCancel}>Cancel</button>
                                                                </span>
                                                            </template>
                                                        </template>
                                                    </span></span></td>
                                                <td class="nw">{r.owner}</td>
                                                <td class={r.dueCls}>{r.due}</td>
                                                <td class="num"><span class={r.pillCls}>{r.pill}</span></td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasRows}><p class="note">{emptyLine}</p></template>
                    <span class="hint">Customers come from the lot shipments of the lots in scope. Tick a task to complete it: a completed Collect response marks the customer Acknowledged, and units on a task add up in the lot table. {respLine}; {targetText}.</span>
                </section>

                <section class="card">
                    <div class="ch"><span class="cn">3</span><span class="ct">Held Stock</span><span class="grow"></span><span class="tot">{dispLine}</span></div>
                    <template if:true={hasHolds}>
                        <div class="list">
                            <template for:each={holdRows} for:item="h">
                                <div key={h.id} class="hrow">
                                    <span class="hl"><span class="b">{h.lot}</span><span class="rk in ell">{h.what}</span></span>
                                    <select class="sel full" data-id={h.id} onchange={handleDisposition} disabled={locked} aria-label={h.label}>
                                        <template for:each={h.opts} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:false={hasHolds}><p class="note">No stock was held in the strategy.</p></template>
                    <span class="hint">Stock still in our control, held in the Strategy step. A finished lot's disposition also covers the units customers send back. &#10022; marks CQ.AI's suggestion; dispositions are fixed when the verdict is confirmed.</span>
                </section>
            </div>

            <section class="card">
                <div class="ch"><span class="cn">4</span><span class="ct">Effectiveness Verdict</span></div>
                <div class="vrow">
                    <div class="fld">
                        <span class="fl">Verdict *</span>
                        <div class="segs" role="group" aria-label="Verdict">
                            <template for:each={verdicts} for:item="o">
                                <button key={o.key} class={o.cls} data-value={o.value} aria-pressed={o.pressed} disabled={locked} onclick={handleVerdict}>{o.label}</button>
                            </template>
                        </div>
                    </div>
                    <template if:true={notEffective}>
                        <label class="fld">
                            <span class="fl">What happens next *</span>
                            <select class="sel" onchange={handleNext} disabled={locked}>
                                <template for:each={nextOpts} for:item="o">
                                    <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                </template>
                            </select>
                        </label>
                    </template>
                    <div class="ai grow"><span class="aih">&#10022; CQ.AI Suggests:</span> {v.aiLine}</div>
                </div>
            </section>

            <template if:true={error}><div class="errbox">{error}</div></template>
        </template>
    </template>
</template>
