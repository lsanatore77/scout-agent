<template>
    <div class={boxClass}>
        <div class="left">
            <div class="ttl">Field Action Review</div>
            <div class="val">{statusText}</div>
        </div>
        <div class="mid">
            <template if:true={fa}>
                <div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" subject={fa.suggestion}></c-cq-ai-why></div>
                <div class="cq-ai-verdict">{fa.suggestion}</div>
                <div class="why">{fa.suggestionWhy}</div>
            </template>
            <template if:true={asking}>
                <label class="cq-field"><span class="cq-label">Why Does This Need Field Action Review?<span class="cq-req">*</span></span>
                    <textarea rows="2" oninput={handleReason} placeholder="For example: this lot may have shipped before the hold"></textarea>
                </label>
            </template>
            <template if:true={doneNote}><div class={noteClass}>{doneNote}</div></template>
            <template if:true={hasReview}>
                <div class="rev">
                    <button class="link" data-id={fa.reviewId} onclick={handleOpen}>{fa.reviewName}</button>
                    <span class="revs">{reviewLine}</span>
                    <template if:true={hasFa}><button class="link" data-id={fa.faId} onclick={handleOpen}>{fa.faName}</button></template>
                </div>
            </template>
            <template if:true={error}><div class="cq-msg crit err">{error}</div></template>
        </div>
        <div class="btns">
            <template if:true={isOpen}>
                <button class="cq-btn-outline" onclick={handleNotNeeded} disabled={busy}>Not Needed</button>
                <button class="cq-btn-outline serious" onclick={handleAsk} disabled={busy}>Send for Review</button>
            </template>
            <template if:true={asking}>
                <button class="link grey" onclick={handleCancel}>Cancel</button>
                <button class="cq-btn-primary serious" onclick={handleSend} disabled={cannotSend}>Send for Review</button>
            </template>
            <template if:true={canChange}>
                <button class="link" onclick={handleChange} disabled={busy}>Change</button>
            </template>
        </div>
    </div>
</template>
