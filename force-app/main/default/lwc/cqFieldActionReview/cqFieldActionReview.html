<template>
    <div class="kard">
        <div>
            <div class="dname">Field Action Review</div>
            <div class="dstate">{statusText}<template if:true={hasReview}> &middot; <button class="cq-link" data-id={fa.reviewId} onclick={handleOpen}>{fa.reviewName}</button></template><template if:true={canDetail}> &middot; <button class="cq-link" onclick={handleDetails}>Details</button></template></div>
        </div>
        <div class="dsug">
            <template if:true={fa}>
                <c-cq-ai-why variant="label" text="CQ.AI Suggests:" subject={fa.suggestion}></c-cq-ai-why> <strong>{fa.suggestion}.</strong> {fa.suggestionWhy}
            </template>
            <template if:true={rowError}><div class="cq-msg crit err">{error}</div></template>
        </div>
        <div class="dchips">
            <template for:each={opts} for:item="o">
                <button key={o.id} class={o.cls} data-id={o.id} aria-pressed={o.pressed} disabled={o.off} onclick={handlePick}>{o.label}</button>
            </template>
        </div>
    </div>

    <template if:true={asking}>
        <div class="cq-modal-back" onkeydown={handleKey}>
            <section class="cq-modal" role="dialog" aria-modal="true" aria-labelledby="far-head">
                <header class="cq-modal-head">
                    <h2 id="far-head" class="cq-modal-title">Send for Field Action Review</h2>
                    <button class="cq-modal-x" aria-label="Close" onclick={handleCancel}>&times;</button>
                </header>
                <div class="cq-modal-body">
                    <label class="cq-field"><span class="cq-label">Why Does This Need Field Action Review?<span class="cq-req">*</span></span>
                        <textarea class="reason" rows="4" oninput={handleReason} placeholder="For example: this lot may have shipped before the hold"></textarea>
                        <span class="cq-hint">The reviewer sees this reason. Sending opens a Field Action Review for this nonconformance.</span>
                    </label>
                    <template if:true={error}><div class="cq-msg crit">{error}</div></template>
                </div>
                <footer class="cq-modal-foot">
                    <button class="cq-btn-outline" onclick={handleCancel}>Cancel</button>
                    <button class="cq-btn-primary" onclick={handleSend} disabled={cannotSend}>Send for Review</button>
                </footer>
            </section>
        </div>
    </template>

    <template if:true={detailing}>
        <div class="cq-modal-back" onkeydown={handleKey}>
            <section class="cq-modal" role="dialog" aria-modal="true" aria-labelledby="fard-head">
                <header class="cq-modal-head">
                    <h2 id="fard-head" class="cq-modal-title">Field Action Review</h2>
                    <button class="cq-modal-x" aria-label="Close" onclick={handleCloseDetails}>&times;</button>
                </header>
                <div class="cq-modal-body">
                    <template for:each={details} for:item="d">
                        <div key={d.k} class="drowk"><span class="cq-kv-k">{d.k}</span><span class="cq-kv-v">{d.v}</span></div>
                    </template>
                    <template if:true={hasFa}><div class="drowk"><span class="cq-kv-k">Field Action</span><span class="cq-kv-v"><button class="cq-link" data-id={fa.faId} onclick={handleOpen}>{fa.faName}</button></span></div></template>
                </div>
                <footer class="cq-modal-foot">
                    <button class="cq-btn-primary closebtn" onclick={handleCloseDetails}>Close</button>
                </footer>
            </section>
        </div>
    </template>
</template>
