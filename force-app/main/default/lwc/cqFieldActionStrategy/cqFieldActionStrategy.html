<template>
    <template if:false={ready}><template if:true={error}><div class="cq-msg crit errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="cq-sechead">
            <h3 class="cq-step-title nom">Strategy</h3>
            <span class={statePill}>{stateText}</span>
            <template if:true={confirmedLine}><span class="cq-sub">{confirmedLine}</span></template>
            <template if:true={backToSummary}><button class="cq-link" onclick={handleSummary}>Show Summary</button></template>
        </div>

        <template if:true={needsScope}>
            <p class="cq-note">Confirm the scope first: the strategy works from the confirmed lot list.</p>
        </template>

        <template if:true={showStep}>
            <template if:true={showSummary}>
                <section class="sumbox" aria-label="Strategy">
                    <template for:each={summaryRows} for:item="r">
                        <div key={r.key} class="srow">
                            <span class="sk">{r.k}</span>
                            <span class="sv"><span class="svv">{r.v}</span><template if:true={r.d}><span class="cq-sub">{r.d}</span></template></span>
                            <span class={r.aiCls}>{r.ai}</span>
                        </div>
                    </template>
                    <div class="sfoot"><button class="cq-btn-outline" onclick={handleEdit}>{changeLabel}</button><template if:false={locked}><span class="cq-sub">Changing a confirmed strategy sends it back for confirming.</span></template></div>
                </section>
            </template>
            <template if:true={showTabs}>
            <section class="tabbox">
                <div class="tabs" role="tablist" aria-label="Strategy">
                    <template for:each={tabs} for:item="t">
                        <button key={t.key} class={t.cls} role="tab" aria-selected={t.sel} data-tab={t.key} onclick={handleTab}><template if:true={t.mark}><span class={t.numCls} aria-hidden="true">{t.mark}</span></template>{t.label}</button>
                    </template>
                </div>
                <div class="panel" role="tabpanel">
                    <template if:true={isAction}>
                    <template if:true={v.whyAction}>
                        <div class="cq-ai-card"><div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" question="Why does CQ.AI suggest this action and how far it goes?"></c-cq-ai-why></div><template if:true={v.sHeadline}><div class="cq-ai-verdict">{v.sHeadline}</div></template><div class="cq-ai-text">{v.whyAction}</div></div>
                    </template>
                    <div class="two">
                        <div class="cq-field">
                            <span class="cq-label">Action<span class="cq-req">*</span></span>
                            <c-cq-ws-choice variant="rows" name="Action" data-field="action" options={actionOptions} value={action} disabled={locked} onchoose={handleChoose}></c-cq-ws-choice>
                        </div>
                        <div class="cq-field">
                            <span class="cq-label">How Far It Goes<span class="cq-req">*</span></span>
                            <c-cq-ws-choice variant="rows" name="How Far It Goes" data-field="depth" options={depthOptions} value={depth} disabled={locked} onchoose={handleChoose}></c-cq-ws-choice>
                        </div>
                    </div>
                    </template>
                    <template if:true={isTell}>
                    <div class="two">
                        <div class="cq-field">
                            <span class="cq-label">Instruction<span class="cq-req">*</span></span>
                            <c-cq-ws-choice variant="rows" name="Instruction" data-field="instruction" options={instructionOptions} value={instruction} disabled={locked} onchoose={handleChoose}></c-cq-ws-choice>
                        </div>
                        <label class="cq-field">
                            <span class="cq-label">Key Message<span class="cq-req">*</span></span>
                            <textarea rows="8" data-field="message" disabled={locked} onchange={handleText}></textarea>
                            <span class="cq-hint">The Notifications step builds the customer letter from this.</span>
                        </label>
                    </div>
                    </template>
                    <template if:true={isHolds}>
                    <template if:true={holdAi}>
                        <div class="cq-ai-card"><div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" question="Why does CQ.AI suggest these holds?"></c-cq-ai-why></div><div class="cq-ai-verdict">{holdAi.headline}</div><div class="cq-ai-text">{holdAi.why}</div></div>
                    </template>
                    <div class="cq-tblwrap">
                        <table class="cq-tbl compact">
                            <thead><tr><template for:each={holdHeads} for:item="c"><th key={c.key} scope="col" class={c.thCls} aria-sort={c.aria}><template if:true={c.sortable}><button class="cq-sortbtn" data-key={c.key} onclick={handleHoldSort} title={c.title}>{c.label}<span class={c.arrowCls} aria-hidden="true"></span></button></template><template if:true={c.plain}>{c.label}</template></th></template></tr></thead>
                            <tbody>
                                <template for:each={holdRows} for:item="h">
                                    <tr key={h.key} class={h.rowCls}>
                                        <template if:true={h.isGroup}><td colspan="6" class="grptitle">{h.title}</td></template>
                                        <template if:false={h.isGroup}>
                                            <td class="hc"><input class="cq-tick" type="checkbox" data-id={h.id} checked={h.hold} disabled={locked} onchange={handleHold} aria-label={h.label} /></td>
                                            <td class="cq-nowrap b">{h.lot}</td>
                                            <td><span class="what">{h.item} <template if:true={h.ai}><c-cq-ai-why variant="tag" lead="Why does CQ.AI suggest holding " subject={h.item}></c-cq-ai-why></template></span><span class="cq-sub block">{h.why}</span><template if:true={h.stays}><span class="stillheld" role="note">Not held by this field action, but the lot stays <span class="b">{h.stays.status}</span><template if:true={h.stays.who}> by <a href={h.stays.href} target="_blank">{h.stays.who}</a></template><template if:true={h.stays.manual}>, set by hand</template>{h.stays.whyText}.</span></template></td>
                                            <td class="num cq-ohcell">
                                                <template if:true={h.canOpen}><button class="cq-ohbtn" data-key={h.key} onclick={handleStock} aria-expanded={h.stockExpanded} aria-label={h.popLabel}>{h.onHand}</button></template>
                                                <template if:false={h.canOpen}>{h.onHand}</template>
                                                <template if:true={h.stockOpen}>
                                                    <div class="cq-ohpop" role="dialog" aria-label={h.popLabel} onclick={handlePopClick}>
                                                        <div class="cq-ohpop-head"><span class="b">Lot {h.lot}</span><span class="cq-grow"></span><span class="cq-sub">{h.onHand} on hand</span></div>
                                                        <template for:each={h.places} for:item="k">
                                                            <div key={k.key} class="cq-ohpop-row"><a class="cq-ploc" href={k.href} target="_blank">{k.location}</a><span class="cq-grow"></span><span>{k.units}</span></div>
                                                        </template>
                                                        <template if:true={h.asOfText}><span class="cq-sub">{h.asOfText}</span></template>
                                                    </div>
                                                </template>
                                            </td>
                                            <td class="cq-nowrap">{h.heldText}</td>
                                            <td class="cq-nowrap"><template if:true={h.hasState}><span class={h.stateCls}>{h.stateText}</span></template></td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template if:true={hasComps}>
                        <div class="addrow">
                            <span class="cq-field addsel"><select aria-label="Add a Component Lot" disabled={locked} onchange={handleAddPick}>
                                <template for:each={compOptions} for:item="o">
                                    <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                </template>
                            </select></span>
                            <button class="cq-btn-outline" onclick={handleAdd} disabled={cantAdd}>Add Hold</button>
                        </div>
                    </template>
                    <span class="cq-hint">{holdLine}</span>
                    </template>
                    <template if:true={isCheck}>
                    <template if:true={v.whyLevel}>
                        <div class="cq-ai-card"><div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" question="Why does CQ.AI suggest this effectiveness check level?"></c-cq-ai-why></div><template if:true={v.sLevelHeadline}><div class="cq-ai-verdict">{v.sLevelHeadline}</div></template><div class="cq-ai-text">{v.whyLevel}</div></div>
                    </template>
                    <div class="two">
                    <div class="cq-field">
                        <span class="cq-label">Check Level<span class="cq-req">*</span></span>
                        <c-cq-ws-choice variant="rows" name="Check Level" data-field="level" options={levelOptions} value={level} disabled={locked} onchoose={handleChoose}></c-cq-ws-choice>
                    </div>
                    <template if:true={needsCheck}>
                        <div class="checkf">
                            <label class="cq-field">
                                <span class="cq-label">How We Check<span class="cq-req">*</span></span>
                                <select data-field="method" disabled={locked} onchange={handleText}>
                                    <template for:each={methods} for:item="m">
                                        <option key={m.value} value={m.value} selected={m.selected}>{m.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="cq-field">
                                <span class="cq-label">Check by<span class="cq-req">*</span></span>
                                <input type="date" data-field="checkBy" value={checkBy} disabled={locked} onchange={handleText} />
                            </label>
                            <template if:true={isLevelB}>
                                <label class="cq-field">
                                    <span class="cq-label">Share of Customers Checked (%)<span class="cq-req">*</span></span>
                                    <input type="number" min="11" max="99" data-field="percent" value={percent} disabled={locked} onchange={handleText} />
                                </label>
                            </template>
                        </div>
                    </template>
                    </div>
                    </template>
                </div>
            </section>
            </template>

            <template if:true={error}><div class="cq-msg crit errbox">{error}</div></template>
        </template>
    </template>
</template>
