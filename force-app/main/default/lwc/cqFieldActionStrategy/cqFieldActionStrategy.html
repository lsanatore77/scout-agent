<template>
    <template if:false={ready}><template if:true={error}><div class="errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="sechead">
            <h3 class="q">Strategy</h3>
            <span class={statePill}>{stateText}</span>
            <template if:true={confirmedLine}><span class="rk">{confirmedLine}</span></template>
        </div>

        <template if:true={needsScope}>
            <p class="note">Confirm the scope first: the strategy works from the confirmed lot list.</p>
        </template>

        <template if:true={showStep}>
            <section class="tabbox">
                <div class="tabs" role="tablist" aria-label="Strategy">
                    <template for:each={tabs} for:item="t">
                        <button key={t.key} class={t.cls} role="tab" aria-selected={t.sel} data-tab={t.key} onclick={handleTab}><span class={t.numCls}>{t.num}</span>{t.label}</button>
                    </template>
                </div>
                <div class="panel" role="tabpanel">
                    <template if:true={isAction}>
                    <template if:true={v.whyAction}>
                        <div class="ai"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Why does CQ.AI suggest this action and how far it goes?"></c-cq-ai-why> {v.whyAction}</div>
                    </template>
                    <div class="fld">
                        <span class="fl">Action *</span>
                        <div class="cards c3" role="group" aria-label="Action">
                            <template for:each={actionCards} for:item="o">
                                <button key={o.key} class={o.cls} data-field={o.field} data-value={o.value} aria-pressed={o.pressed} disabled={locked} onclick={handlePick}>
                                    <span class="oh"><span class="ot">{o.title}</span><template if:true={o.ai}><c-cq-ai-why variant="tag" subject={o.title}></c-cq-ai-why></template></span>
                                    <span class="od">{o.desc}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="fld">
                        <span class="fl">How Far It Goes *</span>
                        <div class="cards c3" role="group" aria-label="How Far It Goes">
                            <template for:each={depthCards} for:item="o">
                                <button key={o.key} class={o.cls} data-field={o.field} data-value={o.value} aria-pressed={o.pressed} disabled={locked} onclick={handlePick}>
                                    <span class="oh"><span class="ot">{o.title}</span><template if:true={o.ai}><c-cq-ai-why variant="tag" subject={o.title}></c-cq-ai-why></template></span>
                                    <span class="od">{o.desc}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    </template>
                    <template if:true={isTell}>
                    <div class="fld">
                        <span class="fl">Instruction *</span>
                        <div class="cards c2" role="group" aria-label="Instruction">
                            <template for:each={instructions} for:item="o">
                                <button key={o.key} class={o.cls} data-field={o.field} data-value={o.value} aria-pressed={o.pressed} disabled={locked} onclick={handlePick}>
                                    <span class="oh"><span class="ot">{o.title}</span><template if:true={o.ai}><c-cq-ai-why variant="tag" subject={o.title}></c-cq-ai-why></template></span>
                                    <span class="od">{o.desc}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <label class="fld">
                        <span class="fl">Key Message *</span>
                        <textarea class="ta" rows="5" data-field="message" disabled={locked} onchange={handleText}></textarea>
                        <span class="hint">The Notifications step builds the customer letter from this.</span>
                    </label>
                    </template>
                    <template if:true={isHolds}>
                    <div class="tblwrap">
                        <table class="ht">
                            <thead><tr><th class="hc">Hold</th><th>Lot</th><th>What</th><th class="num">On Hand</th><th>Location</th><th>Held Since</th><th>Status</th></tr></thead>
                            <tbody>
                                <template for:each={holdRows} for:item="h">
                                    <tr key={h.key} class={h.rowCls}>
                                        <template if:true={h.isGroup}><td colspan="7">{h.title}</td></template>
                                        <template if:false={h.isGroup}>
                                            <td class="hc"><input class="tick" type="checkbox" data-id={h.id} checked={h.hold} disabled={locked} onchange={handleHold} aria-label={h.label} /></td>
                                            <td class="nw b">{h.lot}</td>
                                            <td><span class="what">{h.item} <template if:true={h.ai}><c-cq-ai-why variant="tag" text="Suggested" lead="Why does CQ.AI suggest holding " subject={h.item}></c-cq-ai-why></template></span><span class="rk">{h.why}</span></td>
                                            <td class="num">{h.onHand}</td>
                                            <td class="nw">
                                                <template if:true={h.noPlaces}><span class="mut">{h.locText}</span></template>
                                                <template for:each={h.places} for:item="k">
                                                    <span key={k.key}><a class="ploc" href={k.href} target="_blank">{k.location}</a> {k.units}<template if:true={k.sep}><span class="dotsep"> &middot; </span></template></span>
                                                </template>
                                            </td>
                                            <td class="nw">{h.heldText}</td>
                                            <td class="nw"><template if:true={h.hasState}><span class={h.stateCls}>{h.stateText}</span></template></td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template if:true={hasComps}>
                        <div class="addrow">
                            <select class="sel" aria-label="Add a Component Lot" disabled={locked} onchange={handleAddPick}>
                                <template for:each={compOptions} for:item="o">
                                    <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                </template>
                            </select>
                            <button class="btn sm" onclick={handleAdd} disabled={cantAdd}>Add Hold</button>
                        </div>
                    </template>
                    <span class="hint">{holdLine}</span>
                    </template>
                    <template if:true={isCheck}>
                    <template if:true={v.whyLevel}>
                        <div class="ai"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Why does CQ.AI suggest this effectiveness check level?"></c-cq-ai-why> {v.whyLevel}</div>
                    </template>
                    <div class="fld">
                        <span class="fl">Check Level *</span>
                        <div class="cards c5" role="group" aria-label="Check Level">
                            <template for:each={levelCards} for:item="o">
                                <button key={o.key} class={o.cls} data-field={o.field} data-value={o.value} aria-pressed={o.pressed} disabled={locked} onclick={handlePick}>
                                    <span class="oh"><span class="ot">{o.title}</span><template if:true={o.ai}><c-cq-ai-why variant="star" lead="Why does CQ.AI suggest check level " subject={o.title}></c-cq-ai-why></template></span>
                                    <span class="od">{o.desc}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <template if:true={needsCheck}>
                        <div class="row3">
                            <label class="fld">
                                <span class="fl">How We Check *</span>
                                <select class="sel" data-field="method" disabled={locked} onchange={handleText}>
                                    <template for:each={methods} for:item="m">
                                        <option key={m.value} value={m.value} selected={m.selected}>{m.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label class="fld">
                                <span class="fl">Check by *</span>
                                <input class="ta in" type="date" data-field="checkBy" value={checkBy} disabled={locked} onchange={handleText} />
                            </label>
                            <template if:true={isLevelB}>
                                <label class="fld">
                                    <span class="fl">Share of Customers Checked (%) *</span>
                                    <input class="ta in" type="number" min="11" max="99" data-field="percent" value={percent} disabled={locked} onchange={handleText} />
                                </label>
                            </template>
                        </div>
                    </template>
                    </template>
                </div>
            </section>

            <template if:true={error}><div class="errbox">{error}</div></template>
        </template>
    </template>
</template>
