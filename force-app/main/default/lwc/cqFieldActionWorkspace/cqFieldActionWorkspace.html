<template>
    <template if:false={ready}><template if:true={error}><div class="errbox">{error}</div></template></template>
    <template if:true={ready}>
        <div class="box">
            <header class="hl">
                <div class="hl-top">
                    <div class="hl-who">
                        <span class="hl-icon"><lightning-icon icon-name="custom:custom83" size="medium" alternative-text="Field Action Review"></lightning-icon></span>
                        <div class="hl-name">
                            <span class="hl-obj">Field Action Review</span>
                            <span class="hl-title">{v.name}</span>
                        </div>
                    </div>
                    <div class="hl-actions">
                        <button class="btn" onclick={handleEdit}>Edit</button>
                        <button class="btn icon" onclick={handleRefresh} title="Refresh" aria-label="Refresh"><lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon></button>
                        <c-ask-cq-popover record-id={recordId} suggestions="Summarize this review,What other records are on this lot?,What is left on this review?"></c-ask-cq-popover>
                    </div>
                </div>
                <div class="hl-fields">
                    <div class="f"><span class="k">Source</span>
                        <template if:true={hasSource}><button class="v link" data-id={v.sourceId} onclick={handleOpen}>{v.sourceName}</button></template>
                        <template if:false={hasSource}><span class="v">&mdash;</span></template>
                    </div>
                    <div class="f"><span class="k">Part</span><span class="v">{partText}</span></div>
                    <div class="f"><span class="k">Lot</span><span class="v">{lotText}</span></div>
                    <div class="f"><span class="k">Reviewer</span><span class="v">{reviewerText}</span></div>
                    <div class="f"><span class="k">Status</span><span class="v">{statusText}</span></div>
                    <div class="f"><span class="k">Due</span><span class="v">{dueText}</span></div>
                </div>
            </header>
            <div class="body">
                <nav class="steps" aria-label="Review steps">
                    <div class="steps-title">Review steps</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt"><span class="lbl">{s.label}</span><span class="ssub">{s.sub}</span></span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                    <template if:true={canRestart}><button class="restart" onclick={handleRestart}>Start over</button></template>
                    <template if:true={canReopen}><button class="restart" onclick={handleReopen}>Reopen review</button></template>
                </nav>
                <div class="main">
                    <template if:true={showResumed}><div class="resumed">Picked up where you left off.</div></template>
                    <template if:true={sentBack}>
                        <div class="errbox back"><span class="fname">The committee sent this back.</span><span class="backtext">{sentBack}</span></div>
                    </template>

                    <template if:true={is0}>
                        <template if:true={done}>
                            <div class="decided"><span class="okdot sm">&#10003;</span><span>{decidedLine}</span>
                                <template if:true={hasFa}><button class="link" data-id={v.faId} onclick={handleOpen}>Open {v.faName}</button></template>
                            </div>
                        </template>
                        <div class="cols wide">
                            <div class="col lead">
                                <div class="problem">
                                    <div class={photoCls}>
                                        <template if:true={photoUrl}><img src={photoUrl} alt="Photo of the problem" /></template>
                                        <template if:false={photoUrl}>
                                            <lightning-icon icon-name="utility:photo" size="small" alternative-text="Photo"></lightning-icon>
                                            <span class="nophoto">No photo on the source record</span>
                                        </template>
                                    </div>
                                    <div class="ptext">
                                        <div class="plabel">The problem
                                            <template if:true={hasSource}><span class="from">from <button class="link" data-id={v.sourceId} onclick={handleOpen}>{sourceLabel}</button></span></template>
                                        </div>
                                        <div class="quote">{problem}</div>
                                        <div class="tiles">
                                            <template for:each={tiles} for:item="t">
                                                <div key={t.key} class="tile"><div class="tl">{t.label}</div><div class="tv">{t.value}</div></div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="card sug">
                                    <div class="rec">&#10022; CQ.AI Suggests:</div>
                                    <div class="sughead"><span class="big">{v.suggestedOutcome}</span></div>
                                    <div class="para">{v.suggestedWhy}</div>
                                    <template if:true={showReason}>
                                        <div class="ftable">
                                            <div class="lab top14">{reasonLabel}</div>
                                            <div class="para">{v.reason}</div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            <div class="card">
                                <div class="lab">What We Know</div>
                                <div class="ktable">
                                    <template for:each={v.know} for:item="k">
                                        <div key={k.q} class="krow">
                                            <span class="fn"><span class="kq">{k.q}</span><span class="rk">{k.src}</span></span>
                                            <template if:true={k.unknown}><span class="ka unk">Not known</span></template>
                                            <template if:false={k.unknown}><span class="ka">{k.a}</span></template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <h3 class="q">Signals and Evidence</h3>
                        <p class="p">Patterns CQ.AI has found across complaints, nonconformances and reviews on this part. Every signal is shown, and the committee sees the same set.</p>
                        <div class="sigcols">
                        <div class="sigl">
                        <template for:each={signals} for:item="s">
                            <details key={s.id} class={s.sigCls} data-id={s.id} onmouseenter={handleSigOver} onmouseleave={handleSigOut}>
                                <summary>
                                    <span class="chev" aria-hidden="true">&#8250;</span>
                                    <span class="sgb">
                                        <span class="sgh"><span class="sgt">{s.rule}</span><span class={s.pillCls}>{s.strength}</span><span class="rk">{s.meta}</span></span>
                                        <span class="sgl">{s.label}</span>
                                        <template if:true={s.why}><span class="rk">{s.why}</span></template>
                                    </span>
                                    <span class="rk cnt">{s.count}</span>
                                </summary>
                                <template for:each={s.records} for:item="r">
                                    <div key={r.id} class="evt">
                                        <span class="rt"><span><button class="link" data-id={r.id} onclick={handleOpen}>{r.name}</button>{r.line}</span><span class="rk">{r.meta}</span></span><template if:true={r.sameLot}><span class="lot">This Lot</span></template>
                                    </div>
                                </template>
                                <template if:true={s.hasRest}><div class="evt"><button class="link" data-id={s.id} onclick={handleShowAll}>{s.restLabel}</button></div></template>
                            </details>
                        </template>
                        <template if:false={hasSignals}>
                            <p class="note">No signals at Assess or above on this part or lot.</p>
                            <template if:true={hasRecs}>
                                <div class="lab top14">Relevant Records on This Part</div>
                                <template for:each={recs} for:item="r">
                                    <div key={r.id} class="evt">
                                        <span class="rt"><span><button class="link" data-id={r.id} onclick={handleOpen}>{r.name}</button>{r.line}</span><span class="rk">{r.meta}</span></span>
                                    </div>
                                </template>
                            </template>
                        </template>
                        <template if:true={hasMore}>
                            <details class="know">
                                <summary>{moreLabel}</summary>
                                <template for:each={moreSignals} for:item="s">
                                    <details key={s.id} class="sig">
                                        <summary>
                                            <span class="chev" aria-hidden="true">&#8250;</span>
                                            <span class="sgb">
                                                <span class="sgh"><span class="sgt">{s.rule}</span><span class={s.pillCls}>{s.strength}</span><span class="rk">{s.meta}</span></span>
                                                <span class="sgl">{s.label}</span>
                                                <template if:true={s.why}><span class="rk">{s.why}</span></template>
                                            </span>
                                            <span class="rk cnt">{s.count}</span>
                                        </summary>
                                        <template for:each={s.records} for:item="r">
                                            <div key={r.id} class="evt">
                                                <span class="rt"><span><button class="link" data-id={r.id} onclick={handleOpen}>{r.name}</button>{r.line}</span><span class="rk">{r.meta}</span></span><template if:true={r.sameLot}><span class="lot">This Lot</span></template>
                                            </div>
                                        </template>
                                        <template if:true={s.hasRest}><div class="evt"><button class="link" data-id={s.id} onclick={handleShowAll}>{s.restLabel}</button></div></template>
                                    </details>
                                </template>
                            </details>
                        </template>
                        </div>
                        <div class="sigr">
                            <template if:true={hasBars}>
                                <div class="card chart">
                                    <div class="chead"><span class="lab">Against Normal</span><span class="rk">How many times its normal level each signal is now</span></div>
                                    <template for:each={normalBars} for:item="b">
                                        <div key={b.id} class={b.rowCls} data-id={b.id} onmouseenter={handleSigOver} onmouseleave={handleSigOut}>
                                            <span class="nl"><span class="nt">{b.rule}</span><span class="rk">{b.where}</span></span>
                                            <span class="ntrack"><template if:true={b.has}><span class="nbar" style={b.barStyle}></span></template></span>
                                            <span class="nx" style={b.timesStyle}>{b.times}</span>
                                        </div>
                                    </template>
                                    <span class="rk">The grey line is normal, from the last 12 months. Bars use a log scale so 2&times; and 67&times; both fit.</span>
                                </div>
                            </template>
                            <template if:true={hasTrend}>
                                <div class="card chart">
                                    <div class="chead"><span class="lab">Records on This Part by Month</span><span class="rk">{trendChart.range}</span></div>
                                    <svg class="trend" viewBox="0 0 600 210" role="img" aria-label={trendChart.label}>
                                        <template for:each={trendChart.ticks} for:item="t">
                                            <g key={t.key}>
                                                <line x1="36" x2="592" y1={t.y} y2={t.y} stroke="#eef0f3" stroke-width="1"></line>
                                                <text x="28" y={t.ty} text-anchor="end" font-size="11" fill="#5b6470">{t.v}</text>
                                            </g>
                                        </template>
                                        <template for:each={trendChart.labels} for:item="m">
                                            <text key={m.key} x={m.x} y="204" text-anchor="middle" font-size="11" fill="#5b6470">{m.label}</text>
                                        </template>
                                        <template for:each={trendChart.lines} for:item="l">
                                            <g key={l.key}>
                                                <polyline points={l.points} fill="none" stroke={l.color} stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
                                                <template for:each={l.dots} for:item="d">
                                                    <circle key={d.key} cx={d.x} cy={d.y} r="3.5" fill={l.color}><title>{d.title}</title></circle>
                                                </template>
                                                <text x={l.endX} y={l.endY} font-size="11" font-weight="700" fill={l.color}>{l.endLabel}</text>
                                            </g>
                                        </template>
                                    </svg>
                                    <div class="legend">
                                        <template for:each={trendChart.lines} for:item="l">
                                            <span key={l.key} class="lg"><span class="sw" style={l.swatch}></span>{l.name}</span>
                                        </template>
                                        <span class="rk">Nonconformances on lots of this part only.</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                        </div>
                        <p class="note">Shipments, customers and markets are not shown: there is no distribution data connected.</p>
                    </template>

                    <template if:true={is2}>
                        <h3 class="q">Risk</h3>
                        <div class="cols">
                            <div class="card sug">
                                <div class="rec">&#10022; CQ.AI Suggests:</div>
                                <div class="sughead"><span class="score">{v.score}</span><span class="rk">out of 100</span><span class={bandCls}>{v.band}</span></div>
                                <div class="ftable">
                                    <template for:each={factors} for:item="f">
                                        <div key={f.key} class="frow"><span class="fn"><span class="fname">{f.name}</span><span class="rk">{f.detail}</span></span><span class="fpts">{f.of}</span></div>
                                    </template>
                                </div>
                                <p class="note">Bands: 0&ndash;39 Low &middot; 40&ndash;69 Medium &middot; 70&ndash;100 High. The score supports the decision; it does not make it.</p>
                            </div>
                            <div class="col">
                                <div class="lab">Risk level *</div>
                                <div class="opts tight">
                                    <template for:each={levels} for:item="l">
                                        <button key={l.id} class={l.cls} data-id={l.id} onclick={handleLevel}><template if:true={l.cq}><span class="star">&#10022;</span>&nbsp;</template>{l.id}</button>
                                    </template>
                                </div>
                                <label class="fl">Health hazard summary *
                                    <textarea class="ta" rows="7" data-f="hazard" value={hazard} oninput={handleInput} placeholder="What could happen to a patient or user, how likely, and how serious."></textarea>
                                </label>
                            </div>
                        </div>
                    </template>

                    <template if:true={is3}>
                        <h3 class="q">Reviewer Checklist</h3>
                        <template for:each={questions} for:item="q">
                            <div key={q.id} class="cq">
                                <div class="cqt"><span class="question">{q.text}</span></div>
                                <div class="ynwrap">
                                    <template for:each={q.opts} for:item="o">
                                        <button key={o.key} class={o.cls} data-q={o.q} data-a={o.a} onclick={handleCheck} aria-pressed={o.pressed}>{o.a}</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:true={is4}>
                        <h3 class="q">Recommendation</h3>
                        <p class="p">Choose what you recommend. The committee approves it in the next step.</p>
                        <div class="paths">
                            <template for:each={outcomes} for:item="o">
                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handleOutcome}>
                                    <template if:true={o.cq}><span class="pill">&#10022; CQ.AI Suggests</span></template>
                                    <span class="pl">{o.id}</span>
                                    <span class="rk">{o.why}</span>
                                </button>
                            </template>
                        </div>
                        <template if:true={needed}>
                            <div class="lab top14">Which field action?</div>
                            <div class="list">
                                <template for:each={faOpts} for:item="f">
                                    <button key={f.id} class={f.cls} data-id={f.id} onclick={handleFa}>
                                        <span class="tick round">{f.tick}</span>
                                        <span class="rt"><span class="rv">{f.label}</span><span class="rk">{f.why}</span></span>
                                        <template if:true={f.cq}><span class="pill">&#10022; CQ.AI Suggests</span></template>
                                    </button>
                                </template>
                            </div>
                            <template if:true={isNew}>
                                <div class="newfa">
                                    <label class="fl">Title *
                                        <input class="ta" type="text" data-f="faTitle" value={faTitle} oninput={handleInput} />
                                    </label>
                                    <div class="pair">
                                        <label class="fl">Action type *
                                            <select class="ta" data-f="actionType" onchange={handleInput}>
                                                <option value="">Choose</option>
                                                <template for:each={typeOpts} for:item="t"><option key={t.value} value={t.value} selected={t.selected}>{t.value}</option></template>
                                            </select>
                                        </label>
                                        <label class="fl">Recall class
                                            <select class="ta" data-f="recallClass" onchange={handleInput}>
                                                <option value="">Not yet determined</option>
                                                <template for:each={classOpts} for:item="t"><option key={t.value} value={t.value} selected={t.selected}>{t.value}</option></template>
                                            </select>
                                        </label>
                                    </div>
                                    <div class="lab top14">Scope *</div>
                                    <div class="opts tight">
                                        <template for:each={scopeOpts} for:item="o">
                                            <button key={o.id} class={o.cls} data-id={o.id} onclick={handleScope}><template if:true={o.cq}><span class="star">&#10022;</span>&nbsp;</template>{o.id}</button>
                                        </template>
                                    </div>
                                    <p class="note">Full covers every lot of the part, including lots found later. Partial starts with this review's lot; the rest are chosen and approved in the Field Action.</p>
                                    <template if:true={scopeSuggests}><p class="note"><span class="star">&#10022;</span> {scopeSuggests}</p></template>
                                    <template if:true={isFull}><p class="note">{fullLine}</p></template>
                                    <template if:true={isPartial}><p class="note">{startLine}</p></template>
                                </div>
                            </template>
                        </template>
                        <label class="fl">Rationale *
                            <textarea class="ta" rows="3" data-f="rationale" value={rationale} oninput={handleInput}></textarea>
                        </label>
                    </template>

                    <template if:true={is5}>
                        <h3 class="q">Committee Approval</h3>
                        <template if:true={live}>
                            <p class="p">Build the committee by functional role, then submit your recommendation for approval.</p>
                            <div class="cols">
                                <div class="card">
                                    <div class="lab">Committee</div>
                                    <template if:true={normal}>
                                        <template for:each={seats} for:item="s">
                                            <label key={s.functionId} class="fl">{s.name}
                                                <select class="ta" data-id={s.functionId} onchange={handleSeat}>
                                                    <option value="">Choose</option>
                                                    <template for:each={s.opts} for:item="p"><option key={p.value} value={p.value} selected={p.selected}>{p.label}</option></template>
                                                </select>
                                                <template if:true={s.none}><span class="rk">No one holds this function yet.</span></template>
                                            </label>
                                        </template>
                                    </template>
                                    <template if:true={emergency}>
                                        <label class="fl">Emergency Approver
                                            <select class="ta" data-f="emergencyUser" onchange={handleInput}>
                                                <option value="">Choose</option>
                                                <template for:each={emergencyOpts} for:item="p"><option key={p.value} value={p.value} selected={p.selected}>{p.label}</option></template>
                                            </select>
                                        </label>
                                        <label class="fl">Reason for Emergency *
                                            <textarea class="ta" rows="4" data-f="emergencyReason" value={emergencyReason} oninput={handleInput} placeholder="Why this cannot wait for the full committee."></textarea>
                                        </label>
                                    </template>
                                </div>
                                <div class="col">
                                    <label class="chk"><input type="checkbox" checked={emergency} onchange={handleEmergency} />Escalate to Emergency Approval</label>
                                    <p class="note">For emergencies only. One emergency approver signs off, so the decision does not wait for every function.</p>
                                    <div class="card sug">
                                        <div class="lab">Your Recommendation</div>
                                        <div class="sughead"><span class="big">{outcomeNow}</span></div>
                                        <div class="para">{rationale}</div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:true={waiting}>
                            <div class="cols">
                                <div class="card">
                                    <div class="lab">Recommendation</div>
                                    <template for:each={recRows} for:item="r">
                                        <div key={r.key} class="rr"><div class="rk">{r.k}</div><div class="rv2">{r.v}</div></div>
                                    </template>
                                </div>
                                <div class="card">
                                    <div class="lab">{committeeTitle}</div>
                                    <template for:each={csteps} for:item="s">
                                        <div key={s.id} class="crow">
                                            <span class="fn"><span class="fname">{s.seat}</span><span class="rk">{s.line}</span><template if:true={s.quote}><span class="rk">{s.quote}</span></template></span>
                                            <span class={s.cls}>{s.label}</span>
                                            <template if:true={s.canAct}>
                                                <button class="btn sm primary" data-id={s.id} data-a="approve" onclick={handleAct} disabled={saving}>Approve</button>
                                                <button class="btn sm" data-id={s.id} data-a="reject" onclick={handleAct} disabled={saving}>Send Back</button>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={canActAny}>
                                        <label class="fl">Comment
                                            <textarea class="ta" rows="2" data-f="comment" value={comment} oninput={handleInput} placeholder="Required when you send it back."></textarea>
                                        </label>
                                    </template>
                                    <p class="note">Approvals run on CQ Approvals. The Field Action starts when every member has approved.</p>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:true={showSummary}>
                        <div class="donehead"><span class="okdot">&#10003;</span><h3 class="q nom">Decision submitted</h3></div>
                        <template for:each={summaryRows} for:item="r">
                            <div key={r.key} class="row"><span class="dk">{r.k}</span><span class="dv">{r.v}</span></div>
                        </template>
                        <div class="opts">
                            <button class="btn primary" onclick={handleFinish}>Done</button>
                            <template if:true={hasFa}><button class="btn" data-id={v.faId} onclick={handleOpen}>Open {v.faName}</button></template>
                        </div>
                    </template>
                    <template if:true={error}><div class="errbox">{error}</div></template>
                    <template if:true={live}>
                        <div class="foot">
                            <span class="blocker">{blocker}</span>
                            <button class="btn" onclick={handleBack} disabled={cantBack}>Back</button>
                            <button class="btn primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>
</template>
