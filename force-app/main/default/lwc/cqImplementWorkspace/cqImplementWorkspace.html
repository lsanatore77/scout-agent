<template>
    <template if:true={loadError}><div class="cq-msg crit">{loadError}</div></template>
    <template if:true={ready}>
        <c-cq-ws-shell record-id={recordId} icon="standard:task" object-label="Nonconformance" record-name={v.ncName}
            fields={headerFields} agent-name="CQAI_Quality" placeholder="Ask about these corrections…" ask-step="Implement" ask-suggestions={askSuggestions}
            error={error}>

            <h3 class="cq-step-title headgap">Corrections</h3>
            <p class="cq-step-intro">Each assignee completes their own. You follow them here, chase what is late, and verify what is done when CQ asks for it.</p>

            <template if:true={note}>
                <div class="cq-msg pos notebar"><span>{note}</span><button class="cq-link plainbtn" onclick={handleDismiss}>Dismiss</button></div>
            </template>

            <div class="cq-statcards tcards">
                <template for:each={cards} for:item="c">
                    <div key={c.key} class="cq-statcard flat"><span class="cq-statcard-k">{c.label}</span><span class={c.numCls}>{c.n}</span></div>
                </template>
            </div>

            <template if:true={hasRows}>
                <div class="cq-tblwrap"><table class="cq-tbl">
                    <thead><tr><th>Correction</th><th>Assignee</th><th>Due</th><th>Status</th><th>Verification</th><th class="acts"><span class="slds-assistive-text">Actions</span></th></tr></thead>
                    <tbody>
                        <template for:each={rows} for:item="r">
                            <tr key={r.key} class={r.rowCls}>
                                <td><a class="cq-link cq-strong titlelink" href={r.href} target="_blank" title="Open the correction">{r.title}</a><span class="sub">{r.name}</span></td>
                                <td>{r.assigneeText}</td>
                                <td><div>{r.dueText}</div><div class={r.dueSubCls}>{r.dueSub}</div></td>
                                <td><span class={r.statusCls}>{r.statusText}</span></td>
                                <td><span class={r.verCls}>{r.verText}</span></td>
                                <td class="acts">
                                    <template if:true={r.showComplete}><button class="cq-btn-primary cq-btn-sm" data-id={r.id} onclick={handleOpenComplete}>Complete</button></template>
                                    <template if:true={r.showVerify}><button class="cq-btn-primary cq-btn-sm" data-id={r.id} onclick={handleOpenVerify}>Verify</button></template>
                                    <template if:true={r.showRemind}><button class="cq-btn-outline cq-btn-sm" data-id={r.id} onclick={handleRemind} disabled={busy}>Send Reminder</button></template>
                                    <template if:true={r.showReassign}><button class="cq-link plainbtn" data-id={r.id} onclick={handleOpenReassign}>Reassign</button></template>
                                </td>
                            </tr>
                            <template if:true={r.open}>
                                <tr key={r.panelKey} class="panelrow"><td colspan="6">
                                    <!-- the owner's own correction: complete or skip -->
                                    <template if:true={r.panelComplete}>
                                        <div class="grid">
                                            <div class="main">
                                                <template if:true={r.description}><div class="cq-note sm0">{r.description}</div></template>
                                                <template if:true={isComplete}>
                                                    <label class="cq-field"><span class="cq-label">What Was Done<span class="cq-req">*</span></span>
                                                        <textarea rows="3" value={whatWasDone} oninput={handleDone} placeholder="For example, fitted a new pin to nominal; first-piece check passed on 5 units."></textarea>
                                                    </label>
                                                    <div class="two">
                                                        <label class="cq-field"><span class="cq-label">Completed On<span class="cq-req">*</span></span>
                                                            <input class="date" type="date" value={completedOn} max={today} onchange={handleDate}>
                                                        </label>
                                                        <div class="cq-field"><span class="cq-label">Evidence</span>
                                                            <lightning-file-upload label="Attach evidence" variant="label-hidden" record-id={r.id} accept={acceptTypes} multiple onuploadfinished={handleUploadFinished}></lightning-file-upload>
                                                            <template if:true={hasNewFiles}><ul class="files"><template for:each={files} for:item="f"><li key={f.key}>&#128206; {f.name}</li></template></ul></template>
                                                            <span class="cq-hint">Attached to {r.name}.</span>
                                                        </div>
                                                    </div>
                                                    <div class="links"><span class="cq-muted">No longer needed?</span><button class="cq-link plainbtn" onclick={handleSkipMode}>Skip</button><button class="cq-link plainbtn" onclick={handleCancel}>Cancel</button></div>
                                                </template>
                                                <template if:true={isSkip}>
                                                    <label class="cq-field"><span class="cq-label">Why It Is No Longer Needed<span class="cq-req">*</span></span>
                                                        <textarea rows="3" value={skipReason} oninput={handleReason}></textarea>
                                                    </label>
                                                    <div class="links"><button class="cq-link plainbtn" onclick={handleCompleteMode}>Back to Complete</button><button class="cq-link plainbtn" onclick={handleCancel}>Cancel</button></div>
                                                </template>
                                                <template if:true={workBlocker}><span class="cq-blocker">{workBlocker}</span></template>
                                            </div>
                                            <aside class="signsec">
                                                <c-cq-sign-seat record-id={r.id} policy-key="compliancequest__SQX_Action__c" actions={seatActions}
                                                    seat="Completed By" person="You" sub={signFor} status="Your Signature" tone="you" mine
                                                    meaning={workMeaning} comment-hint="Optional" submit={workSubmit} disabled={cantWork}>
                                                </c-cq-sign-seat>
                                            </aside>
                                        </div>
                                    </template>
                                    <!-- verify a done correction -->
                                    <template if:true={r.panelVerify}>
                                        <div class="grid">
                                            <div class="main">
                                                <div class="cq-tblwrap cq-sum"><table class="cq-tbl"><tbody>
                                                    <tr><td class="k">What Was Done</td><td class="v">{r.doneText}</td></tr>
                                                    <tr><td class="k">Done</td><td class="v">{r.dueSub}</td></tr>
                                                    <tr><td class="k">Evidence</td><td class="v"><template if:true={r.hasFiles}>&#128206; {r.filesText}</template><template if:false={r.hasFiles}>None attached</template></td></tr>
                                                </tbody></table></div>
                                                <label class="cq-field"><span class="cq-label">How You Checked It<span class="cq-req">*</span></span>
                                                    <textarea rows="3" value={howChecked} oninput={handleChecked} placeholder="For example, checked 5 bonded units from the next run: all within tolerance."></textarea>
                                                </label>
                                                <div class="links"><span class="cq-muted">Not done properly?</span><button class="cq-link plainbtn" onclick={handleSendBack}>Send Back<svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button class="cq-link plainbtn" onclick={handleCancel}>Cancel</button></div>
                                                <template if:true={verifyBlocker}><span class="cq-blocker">{verifyBlocker}</span></template>
                                            </div>
                                            <aside class="signsec">
                                                <c-cq-sign-seat record-id={r.id} policy-key="compliancequest__SQX_Action__c" actions={seatActions}
                                                    seat="Verified By" person="You" sub={signFor} status="Your Signature" tone="you" mine
                                                    meaning={verifyMeaning} comment-hint="Optional" submit={verifySubmit} disabled={cantVerify}>
                                                </c-cq-sign-seat>
                                            </aside>
                                        </div>
                                    </template>
                                    <!-- give an open correction to someone else -->
                                    <template if:true={r.panelReassign}>
                                        <div class="reassign">
                                            <lightning-record-picker label="Give It To" object-api-name="User" filter={userFilter} onchange={handlePick} placeholder="Search people"></lightning-record-picker>
                                            <button class="cq-btn-primary" onclick={handleReassign} disabled={cantReassign}>Reassign</button>
                                            <button class="cq-link plainbtn" onclick={handleCancel}>Cancel</button>
                                        </div>
                                        <span class="cq-hint">Now with {r.assigneeText}. The due date stays the same.</span>
                                    </template>
                                </td></tr>
                            </template>
                        </template>
                    </tbody>
                </table></div>
            </template>

            <!-- Verification: the owner closes the NC once CQ has completed it -->
            <template if:true={showClose}>
                <div class="grid closegrid divided">
                    <div class="main">
                        <div>
                            <h3 class="cq-step-title headgap">Close the Nonconformance</h3>
                            <p class="cq-step-intro sm0">Did the corrections hold? Look at what was done above, then pick the resolution and sign. CQ asks for a signature to close.</p>
                        </div>
                        <div class="cq-field"><span class="cq-label">Resolution<span class="cq-req">*</span></span>
                            <div class="rchips">
                                <template for:each={resolutionOpts} for:item="o">
                                    <button key={o.key} class={o.cls} data-key={o.key} onclick={handleResolution} aria-pressed={o.pressed}>
                                        <span class="rt">{o.title}</span><span class="rd">{o.desc}</span>
                                    </button>
                                </template>
                            </div>
                        </div>
                        <template if:true={isIneffective}>
                            <div class="cq-msg warn ineff">
                                <strong>The fix did not hold. Closing now records that, but leaves the problem open.</strong>
                                <span>Usually you do one of these instead:</span>
                                <div class="links">
                                    <button class="cq-btn-outline cq-btn-sm" onclick={handleReopenImpl}>Reopen Implementation<svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
                                    <template if:false={hasCapa}><button class="cq-btn-outline cq-btn-sm" onclick={handleEscalate}>Escalate to a CAPA<svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></template>
                                    <template if:true={hasCapa}><a class="cq-link" href={capaHref} target="_blank">Already escalated: {v.capaName}</a></template>
                                </div>
                                <span class="sm">Reopen sends the NC back to Implement to add or redo corrections. Escalate opens CQ's Escalate to CAPA, where the cause gets fixed. Or close it as Ineffective, for example when a CAPA already covers it.</span>
                            </div>
                        </template>
                        <label class="cq-field"><span class="cq-label">Closing Summary<span class="cq-req">*</span></span>
                            <textarea rows="4" value={closeSummary} oninput={handleSummary} placeholder="For example, lot L26-0915 re-tested: 2 scrapped, 16 released. No repeat on the 3 lots built since."></textarea>
                            <span class="cq-hint">Saved on the NC as CQ's closing comments.</span>
                        </label>
                        <template if:true={closeBlocker}><span class="cq-blocker">{closeBlocker}</span></template>
                    </div>
                    <aside class="signsec">
                        <c-cq-sign-seat record-id={recordId} policy-key="compliancequest__SQX_Nonconformance__c" actions={closeActions}
                            seat="Closed By" person="You" sub={closeFor} status="Your Signature" tone="you" mine
                            meaning={closeLabelMeaning} comment-hint="Optional" submit={closeSubmit} disabled={cantClose}>
                        </c-cq-sign-seat>
                    </aside>
                </div>
            </template>
            <template if:true={showClosed}>
                <div class="cq-donehead divided"><span class="cq-okdot">&#10003;</span><h3 class="cq-step-title nom">{v.ncName} Closed</h3></div>
                <div class="cq-tblwrap cq-sum closedtbl"><table class="cq-tbl">
                    <tbody><template for:each={closedRows} for:item="r"><tr key={r.key}><td class="k">{r.k}</td><td class="v">{r.v}</td></tr></template></tbody>
                </table></div>
            </template>

            <p class="cq-note nextline"><strong>Next:</strong> {nextLine}</p>
        </c-cq-ws-shell>
    </template>
</template>
