<template>
    <template if:true={loadError}><div class="cq-msg crit">{loadError}</div></template>
    <template if:true={ready}>
        <c-cq-ws-shell record-id={v.investigationId} icon="standard:search" object-label="Investigation" record-name={v.investigationName}
            fields={headerFields} show-edit agent-name="CQAI_Quality" placeholder="Ask about this investigation…" ask-step={askStep} ask-suggestions={askSuggestions} pin-label={pinLabel}
            steps={railSteps} progress={progress} error={error}
            show-foot={notDone} blocker={blocker} back-disabled={cantBack} next-disabled={cantNext} next-outline={cantNext}
            onstep={handleStep} onback={handleBack} onnext={handleNext} onedit={handleEdit} onopen={handleShellOpen} onaskcqpin={handleAskPin}>
                    <!-- 1 Investigation at a Glance -->
                    <template if:true={showGlance}>
                        <div class="cq-cols wide">
                            <div class="cq-pcard">
                                <div class="cq-card-title">The Problem</div>
                                <p class="cq-prob">{problemText}</p>
                                <div class="cq-tiles">
                                    <div class="cq-tile"><div class="cq-tile-k">Risk</div><div class={riskCls}>{riskText}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Units Affected</div><div class="cq-tile-v">{unitsText}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Disposition</div><div class="cq-tile-v">{dispTile}</div></div>
                                    <div class="cq-tile"><div class="cq-tile-k">Approval</div><div class="cq-tile-v">{approvalText}</div></div>
                                </div>
                            </div>
                            <div class="cq-ai-card">
                                <div class="cq-ai-head"><lightning-icon icon-name="utility:summary" size="x-small" class="cq-ai-icon" alternative-text="Worded from the records"></lightning-icon> Where This Stands</div>
                                <div class="cq-ai-says">{standsText}</div>
                                <template if:true={recurGlance}><div class="cq-ai-says redtext">{recurGlance}</div></template>
                                <template if:true={gapsText}><div class="cq-ai-says"><strong>Gaps:</strong> {gapsText}</div></template>
                                <div class="cq-ai-says"><strong>Next:</strong> {nextText}</div>
                            </div>
                        </div>
                        <div class="cq-card-title cq-mt16">What We Already Know</div>
                        <div class="cq-tblwrap">
                            <table class="cq-tbl">
                                <thead><tr><template for:each={knownHeads} for:item="h"><th key={h.key} scope="col" class={h.thCls} aria-sort={h.aria}><template if:true={h.sortable}><button class="cq-sortbtn" data-t="known" data-key={h.key} onclick={handleSort} title={h.title}>{h.label}<span class={h.arrowCls} aria-hidden="true"></span></button></template><template if:true={h.plain}>{h.label}</template></th></template></tr></thead>
                                <tbody>
                                    <template for:each={knownRows} for:item="r">
                                        <tr key={r.key}>
                                            <td class="cq-strong">
                                                <template if:true={r.hasHref}><a class="cq-link" href={r.href} target="_blank">{r.source}</a></template>
                                                <template if:false={r.hasHref}>{r.source}</template>
                                            </td>
                                            <td>{r.says}</td>
                                            <td><span class={r.chipCls}>{r.chip}</span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                    <!-- 2 What Changed -->
                    <template if:true={showChanged}>
                        <h3 class="cq-step-title">What Changed</h3>
                        <template if:true={wcLoading}><div class="cq-spinwrap"><lightning-spinner alternative-text="Reading the changes" size="small" class="cq-spin"></lightning-spinner><span class="cq-muted">Reading the changes CQ holds…</span></div></template>
                        <template if:true={wcReady}>
                            <div class="cq-ai-card">
                                <div class="cq-ai-head"><lightning-icon icon-name="utility:summary" size="x-small" class="cq-ai-icon" alternative-text="Worded from the records"></lightning-icon> What Stands Out</div>
                                <div class="cq-ai-says"><span class="wc-lead">{standOutLead}</span>{standOutRest}</div>
                            </div>
                            <div class="wc-side">
                                <div class="card wc-chart">
                                    <div class="wc-chead">
                                        <div class="cq-card-title">Changes Around the Start Date</div>
                                        <div class="wc-lb" onkeydown={handleLbKey}>
                                            <button class="cq-link" aria-haspopup="menu" aria-expanded={lbExpanded} onclick={toggleLookBack}>Look back {wcDays} days &#9662;</button>
                                            <template if:true={lbOpen}>
                                                <div class="wc-veil" onclick={closeLookBack}></div>
                                                <div class="wc-lbmenu" role="menu" aria-label="Look back">
                                                    <template for:each={lookBackOpts} for:item="o">
                                                        <button key={o.d} class={o.cls} role="menuitemradio" aria-checked={o.checked} data-d={o.d} onclick={handleLookBack}><span class="wc-tick" aria-hidden="true">{o.tick}</span>{o.label}</button>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="wc-tl" style={timeline.height}>
                                        <span class="wc-shade" style={timeline.shade}></span>
                                        <span class="wc-axis" style={timeline.axis}></span>
                                        <template for:each={timeline.ticks} for:item="t">
                                            <span key={t.key} class={t.cls} style={t.style}>{t.label}</span>
                                        </template>
                                        <template for:each={timeline.others} for:item="o">
                                            <span key={o.key} class={o.cls} style={o.style}></span>
                                        </template>
                                        <span class="wc-start" style={timeline.start}></span>
                                        <template for:each={timeline.bands} for:item="b">
                                            <div key={b.key} class="wc-band" style={b.style} title={b.label}><span class="wc-num xs dev">{b.n}</span><span class="wc-bandtext">{b.label}</span></div>
                                        </template>
                                        <template for:each={timeline.marks} for:item="m">
                                            <span key={m.kStem} class={m.stemCls} style={m.stem}></span>
                                        </template>
                                        <template for:each={timeline.marks} for:item="m">
                                            <span key={m.kKind} class={m.kindCls} style={m.kindStyle} aria-hidden="true">{m.kind}</span>
                                        </template>
                                        <template for:each={timeline.marks} for:item="m">
                                            <button key={m.key} class={m.cls} style={m.style} data-key={m.key} aria-label={m.aria}
                                                onmouseenter={handleTip} onmouseleave={handleTipOff} onfocus={handleTip} onblur={handleTipOff}>{m.n}</button>
                                        </template>
                                        <template if:true={timeline.tip}>
                                            <div class={timeline.tip.cls} style={timeline.tip.style} role="tooltip">
                                                <div class="wc-tiphead">{timeline.tip.head}</div>
                                                <div>{timeline.tip.text}</div>
                                                <div class="wc-tipwhen">{timeline.tip.rel}</div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="tl-legend">
                                        <span><span class="lg change">&#9679;</span> Change on this page</span>
                                        <span><span class="lg lot">&#9679;</span> Lot</span>
                                        <span><span class="lg other">&#9679;</span> On another page</span>
                                        <template if:true={hasBands}><span><span class="lg band">&#9632;</span> In effect across the period</span></template>
                                    </div>
                                </div>
                                <div class="card wc-list">
                                    <template if:true={hasChanges}>
                                        <div class="cq-tblwrap">
                                            <table class="cq-tbl wc-tbl">
                                                <thead><tr><template for:each={chgHeads} for:item="h"><th key={h.key} scope="col" class={h.thCls} aria-sort={h.aria}><template if:true={h.sortable}><button class="cq-sortbtn" data-t="chg" data-key={h.key} onclick={handleSort} title={h.title}>{h.label}<span class={h.arrowCls} aria-hidden="true"></span></button></template><template if:true={h.plain}>{h.label}</template></th></template></tr></thead>
                                                <tbody>
                                                    <template for:each={changeRows} for:item="r">
                                                        <tr key={r.key}>
                                                            <td class="wc-ncol"><span class={r.numCls}>{r.n}</span></td>
                                                            <td class="cq-nowrap">
                                                                <template if:true={r.hasHref}><a class="cq-link" href={r.href} target="_blank">{r.name}</a></template>
                                                                <template if:true={r.byHand}><span class="cq-pill soft neu">Added by You</span></template>
                                                            </td>
                                                            <td class="wc-what"><div class="wc-one" title={r.whatChanged}>{r.whatChanged}</div></td>
                                                            <td><span class={r.ratingCls}>{r.rating}</span></td>
                                                            <td class="cq-nowrap">
                                                                <template if:true={r.added}><span class="added">{r.added}</span></template>
                                                                <template if:true={r.canAdd}><button class="cq-btn-outline" data-key={r.key} onclick={handleHypOpen}>Add as Hypothesis</button></template>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <template if:true={wcPaged}>
                                            <div class="cq-pager">
                                                <nav class="cq-pages" aria-label="Change pages">
                                                    <button class="pg" onclick={handleWcPrev} disabled={cantPrevWc} aria-label="Previous page">&laquo;</button>
                                                    <template for:each={wcPageItems} for:item="p">
                                                        <button key={p.key} class={p.cls} data-p={p.p} onclick={handleWcPage} disabled={p.off} aria-current={p.current} aria-label={p.label}>{p.text}</button>
                                                    </template>
                                                    <button class="pg" onclick={handleWcNext} disabled={cantNextWc} aria-label="Next page">&raquo;</button>
                                                </nav>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={hasChanges}><p class="cq-note">CQ holds no changes on this part in the window. Try a longer Look back, or add what you found by hand.</p></template>
                                </div>
                            </div>

                            <template if:false={changeForm}>
                                <div class="notincq">
                                    <span class="cq-strong">Not in CQ:</span>
                                    <span class="cq-grow cq-muted">fixture maintenance, operator assignments and line moves come from systems not connected to CQ. Add what you find by hand.</span>
                                    <button class="cq-btn-outline" onclick={handleChangeOpen}>+ Add a Change</button>
                                </div>
                            </template>
                            <template if:true={changeForm}>
                                <div class="addchange">
                                    <div class="cq-strong big2">Add a Change</div>
                                    <div class="cq-fields">
                                        <label class="cq-field growf"><span class="cq-label">What Changed<span class="cq-req">*</span></span>
                                            <input type="text" value={changeForm.whatChanged} data-f="whatChanged" onchange={handleChangeField} placeholder="For example, locating pin not checked after the fixture move">
                                        </label>
                                        <label class="cq-field"><span class="cq-label">When<span class="cq-req">*</span></span>
                                            <input class="date" type="date" value={changeForm.changeDate} data-f="changeDate" onchange={handleChangeField}>
                                        </label>
                                    </div>
                                    <div class="cq-field"><span class="cq-label">Category<span class="cq-req">*</span></span>
                                        <div class="cq-chips">
                                            <template for:each={changeCatOpts} for:item="c">
                                                <button key={c.label} class={c.cls} data-c={c.label} aria-pressed={c.pressed} onclick={handleChangeCat}>{c.label}</button>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="cq-fields">
                                        <label class="cq-field growf"><span class="cq-label">Where Found</span>
                                            <input type="text" value={changeForm.whereFound} data-f="whereFound" onchange={handleChangeField} placeholder="For example, maintenance log, line 3">
                                        </label>
                                        <label class="cq-field growf"><span class="cq-label">Link or Reference</span>
                                            <input type="text" value={changeForm.reference} data-f="reference" onchange={handleChangeField} placeholder="Optional">
                                        </label>
                                    </div>
                                    <div class="cq-opts tight">
                                        <button class="cq-btn-primary" onclick={handleChangeSave} disabled={cantSaveChange}>Save Change</button>
                                        <button class="cq-btn-outline" onclick={handleChangeSaveHyp} disabled={cantSaveChangeHyp}>Save and Add as Hypothesis</button>
                                        <button class="cq-btn-outline" onclick={handleChangeCancel}>Cancel</button>
                                        <span class="cq-blocker">{changeBlocker}</span>
                                    </div>
                                </div>
                            </template>

                            <template if:true={hasHyps}>
                                <div class="card">
                                    <div class="cq-card-title">Hypotheses So Far</div>
                                    <template for:each={hypRows} for:item="h">
                                        <div key={h.key} class="hyprow"><span class="cq-note sm0 cq-strong">{h.label}</span><span class="cq-grow cq-strong">{h.title}</span><span class={h.statusCls}>{h.status}</span></div>
                                    </template>
                                    <div class="cq-note">Each one starts Open. You test them in Find the Cause, where Confirmed hypotheses become CQ root causes.</div>
                                </div>
                            </template>
                            <template if:true={wcNotice}><div class="cq-msg pos okbox">{wcNotice}</div></template>
                        </template>
                        <template if:true={wcError}><div class="cq-msg crit errbox">{wcError}</div></template>
                    </template>

                    <!-- 3 Check History -->
                    <template if:true={showHistory}>
                        <h3 class="cq-step-title">Check History</h3>
                        <template if:true={histLoading}><div class="cq-spinwrap"><lightning-spinner alternative-text="Reading the history" size="small" class="cq-spin"></lightning-spinner><span class="cq-muted">Ranking past records on this part…</span></div></template>
                        <template if:true={histReady}>
                            <div class="cq-ai-card">
                                <div class="cq-ai-head"><lightning-icon icon-name="utility:summary" size="x-small" class="cq-ai-icon" alternative-text="Worded from the records"></lightning-icon> What Stands Out</div>
                                <div class="cq-ai-says">{histStandOut}</div>
                            </div>
                            <template for:each={recurBoxes} for:item="r">
                                <div key={r.key} class="cq-recur">
                                    <div class="cq-recur-head"><span aria-hidden="true">&#9888;</span> Happened Before, and the Fix Didn&rsquo;t Hold</div>
                                    <div class="lh"><a class="cq-link" href={r.ncHref} target="_blank">{r.ncName}</a>{r.text1}<a class="cq-link" href={r.capaHref} target="_blank">{r.capaName}</a>{r.text2}</div>
                                    <template if:true={r.efrText}>
                                        <div class={r.efrCls}><a class="cq-redlink" href={r.efrHref} target="_blank">{r.efrName}</a>{r.efrText}</div>
                                    </template>
                                    <template if:true={r.noReview}><div class="lh cq-muted">{r.capaName} closed with no effectiveness review on record.</div></template>
                                    <div class="cq-opts tight top8x">
                                        <template if:true={r.added}><span class="added">{r.added}</span></template>
                                        <template if:true={r.canAdd}><button class="cq-btn-outline" data-key={r.histKey} onclick={handleHistHypOpen}>Add as Hypothesis</button></template>
                                        <a class="cq-btn-outline cq-linkbtn" href={r.capaHref} target="_blank">Open {r.capaName}</a>
                                    </div>
                                </div>
                            </template>
                            <template if:true={hasHistRows}>
                                <div class="cq-tblwrap cq-mt16">
                                    <table class="cq-tbl">
                                        <thead><tr><template for:each={histHeads} for:item="h"><th key={h.key} scope="col" class={h.thCls} aria-sort={h.aria}><template if:true={h.sortable}><button class="cq-sortbtn" data-t="hist" data-key={h.key} onclick={handleSort} title={h.title}>{h.label}<span class={h.arrowCls} aria-hidden="true"></span></button></template><template if:true={h.plain}>{h.label}</template></th></template></tr></thead>
                                        <tbody>
                                            <template for:each={histRows} for:item="r">
                                                <tr key={r.key}>
                                                    <td><a class="cq-link" href={r.href} target="_blank">{r.name}</a><div class="cq-note sm0">{r.sub}</div></td>
                                                    <td>{r.what}</td>
                                                    <td>
                                                        <template if:false={r.causeIsNone}><span class="cq-strong">{r.cause}</span></template>
                                                        <template if:true={r.causeIsNone}><span class="cq-muted">{r.cause}</span></template>
                                                        <template if:true={r.causeNote}><div class="cq-note sm0">{r.causeNote}</div></template>
                                                    </td>
                                                    <td>
                                                        <template if:true={r.fix}><a class="cq-link" href={r.fixHref} target="_blank">{r.fix}</a> {r.capaTitle}</template>
                                                        <div class="cq-note sm0">{r.fixNote}</div>
                                                    </td>
                                                    <td><span class={r.matchCls}>{r.matchText}</span><div class="cq-note sm0">{r.why}</div></td>
                                                    <td class="cq-nowrap">
                                                        <div class="actcol">
                                                            <template if:true={r.added}><span class="added">{r.added}</span></template>
                                                            <template if:true={r.canAdd}><button class="cq-btn-outline" data-key={r.key} onclick={handleHistHypOpen}>Add as Hypothesis</button></template>
                                                            <a class="smalllink" data-key={r.key} onclick={handleNotRelevant}>Not Relevant</a>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template if:false={hasHistRows}><p class="cq-note">Nothing in CQ matches this problem on this part.</p></template>
                            <template if:true={histNotice}><div class="cq-msg pos okbox">{histNotice}</div></template>

                            <template if:true={hasOthers}>
                                <div class="notincq">
                                    <span class="cq-strong">{otherCount} Other Records</span>
                                    <span class="cq-grow cq-muted">{othersText}</span>
                                    <button class="cq-btn-outline" onclick={handleToggleOthers}>{othersLabel}</button>
                                </div>
                                <template if:true={histShowOthers}>
                                    <div class="cq-tblwrap">
                                        <table class="cq-tbl">
                                            <thead><tr><template for:each={othHeads} for:item="h"><th key={h.key} scope="col" class={h.thCls} aria-sort={h.aria}><template if:true={h.sortable}><button class="cq-sortbtn" data-t="oth" data-key={h.key} onclick={handleSort} title={h.title}>{h.label}<span class={h.arrowCls} aria-hidden="true"></span></button></template><template if:true={h.plain}>{h.label}</template></th></template></tr></thead>
                                            <tbody>
                                                <template for:each={otherRows} for:item="r">
                                                    <tr key={r.key}>
                                                        <td><a class="cq-link" href={r.href} target="_blank">{r.name}</a><div class="cq-note sm0">{r.sub}</div></td>
                                                        <td>{r.what}</td>
                                                        <td><span class={r.matchCls}>{r.matchText}</span><div class="cq-note sm0">{r.why}</div></td>
                                                        <td class="cq-nowrap"><a class="smalllink" data-key={r.key} onclick={handleNotRelevant}>Not Relevant</a></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </template>
                            <template if:true={hasDismissed}>
                                <div class="notincq">
                                    <span class="cq-strong">Marked Not Relevant</span>
                                    <template for:each={dismissedRows} for:item="d">
                                        <span key={d.key} class="dismissed">{d.name} <button class="cq-btn-outline" data-id={d.id} onclick={handleRestore}>Restore</button></span>
                                    </template>
                                </div>
                            </template>
                            <div class="cq-card-title cq-mt16">How These Were Found</div>
                            <p class="cq-note sm0 lh">The same relevance ranking as the Product History Review: the part, its bill of materials components and products that share them; the words in the title and description, the defect code and failed inspections; and whether the record is open or recent. Red meets three of these, Yellow two. Records you mark Not Relevant drop off this list for this investigation.</p>
                        </template>
                        <template if:true={histError}><div class="cq-msg crit errbox">{histError}</div></template>
                    </template>

                    <!-- 4 Find the Cause -->
                    <template if:true={showCause}>
                        <h3 class="cq-step-title">Find the Cause</h3>
                        <c-cq-investigation-cause record-id={v.investigationId} onaddhyp={handleCauseAddHyp} oncausestate={handleCauseState} oncausechanged={handleCauseChanged}></c-cq-investigation-cause>
                    </template>

                    <!-- 5 Actions -->
                    <template if:true={showActions}>
                        <h3 class="cq-step-title">Actions</h3>
                        <p class="cq-step-intro">A correction fixes what is broken now; a corrective action removes the cause; a preventive action stops it happening elsewhere.</p>
                        <template if:true={hasPlans}>
                            <div class="cq-tblwrap">
                                <table class="cq-tbl">
                                    <thead><tr><template for:each={planHeads} for:item="h"><th key={h.key} scope="col" class={h.thCls} aria-sort={h.aria}><template if:true={h.sortable}><button class="cq-sortbtn" data-t="plan" data-key={h.key} onclick={handleSort} title={h.title}>{h.label}<span class={h.arrowCls} aria-hidden="true"></span></button></template><template if:true={h.plain}>{h.label}</template></th></template></tr></thead>
                                    <tbody>
                                        <template for:each={planRows} for:item="p">
                                            <tr key={p.key}>
                                                <td class="ttl"><div class="cq-strong">{p.title}</div><template if:true={p.unsaved}><div class="cq-note sm0">Not saved yet</div></template></td>
                                                <td class="wide">{p.descText}</td>
                                                <td class="cq-nowrap">{p.type}</td>
                                                <td class="cq-nowrap">{p.ownerText}</td>
                                                <td class="cq-nowrap">{p.dueText}</td>
                                                <td class="cq-nowrap"><button class="smalllink plainbtn" data-i={p.idx} onclick={handleEditPlan}>Edit</button><span class="cq-note sm0"> &middot; </span><button class="smalllink plainbtn" data-i={p.idx} onclick={handleRemovePlan}>Remove</button></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasPlans}><p class="cq-note">No actions yet. Add one for each thing to be done.</p></template>
                        <div class="cq-splitline cq-mt16"><button class="cq-btn-outline" onclick={handleAddPlan}>+ Add Action</button><span class="cq-grow"></span><button class="cq-btn-outline" onclick={handlePlanDoc} title="Build an FDA warning letter response or an 8D customer report from these actions">Create Action Plan Document</button></div>
                        <template if:true={planDocNote}><div class="cq-infobox cq-mt16"><strong>Action Plan Document:</strong> {planDocNote}</div></template>
                        <div class="cq-infobox cq-mt16"><strong>What happens to these:</strong> they are saved as CQ action plans on the investigation. When the investigation is complete, the NC moves to Implement and CQ turns them into actions with their owners and due dates.</div>
                        <template if:true={notice}><div class="cq-msg pos okbox">{notice}</div></template>
                    </template>

                    <!-- 6 Conclusion -->
                    <template if:true={showConclusion}>
                        <h3 class="cq-step-title">Conclusion</h3>
                        <div class="cq-field"><span class="cq-label">Conclusion<span class="cq-req">*</span></span>
                            <div class="cq-chips">
                                <template for:each={conclusionOpts} for:item="c">
                                    <button key={c.label} class={c.cls} data-c={c.label} aria-pressed={c.pressed} onclick={handleConclusion}>{c.label}</button>
                                </template>
                            </div>
                        </div>
                        <template if:true={recurWarn}><div class="cq-msg warn">{recurWarn}</div></template>
                        <template if:true={noCauseWarn}><div class="cq-msg warn">Confirmed usually means the root cause is known, but no root cause is recorded on this investigation yet.</div></template>
                        <label class="cq-field cq-mt16"><span class="cq-label">Investigation Summary<span class="cq-req">*</span></span>
                            <template if:true={showSumBox}><textarea class="summary" rows="9" value={summary} onchange={handleSummary} placeholder="Write the summary, or use CQ.AI Suggested Summary."></textarea></template>
                            <template if:true={sumWriting}><div class="sumbusy"><span class="pspin"></span>CQ.AI is writing the summary&hellip;</div></template>
                        </label>
                        <div class="cq-splitline cq-mt16">
                            <button class="cq-btn-outline ibtn" onclick={handleSuggestSummary} disabled={sumWriting}><lightning-icon icon-name="utility:summary" size="xx-small" class="cq-ai-icon" alternative-text=""></lightning-icon>{sumLabel}</button>
                            <template if:true={sumNote}><span class="cq-note">{sumNote}</span></template>
                        </div>
                        <template if:true={sumConfirm}>
                            <div class="cq-msg warn sumask"><span class="cq-grow">Replace the summary in the box with a new one from CQ.AI?</span><button class="cq-btn-outline" onclick={handleSumReplace}>Replace It</button><button class="cq-btn-outline" onclick={handleSumKeep}>Keep Mine</button></div>
                        </template>
                        <template if:true={sumError}><div class="cq-msg crit errbox">{sumError}</div></template>
                        <div class="cq-infobox cq-mt16"><strong>On {completeLabel}:</strong> {onCompleteText}</div>
                    </template>

                    <!-- done -->
                    <template if:true={showDone}>
                        <div class="cq-donehead">
                            <template if:true={doneOk}><span class="cq-okdot">&#10003;</span></template>
                            <template if:true={waiting}><lightning-spinner alternative-text="Waiting for CQ" size="small" class="cq-spin"></lightning-spinner></template>
                            <h3 class="cq-step-title nom">{doneHeading}</h3>
                        </div>
                        <template if:true={waiting}><p class="cq-step-intro">CQ finishes this in the background; it takes a few seconds.</p></template>
                        <template if:true={stillWaiting}><div class="cq-msg warn">CQ has not finished yet. Refresh the page in a minute to see the investigation complete.</div></template>
                        <div class="cq-tblwrap cq-sum"><table class="cq-tbl">
                            <thead><tr><th>Item</th><th>Recorded</th></tr></thead>
                            <tbody><template for:each={doneRows} for:item="r"><tr key={r.key}><td class="k">{r.k}</td><td class="v">{r.v}</td></tr></template></tbody>
                        </table></div>
                        <div class="cq-opts"><button class="cq-btn-primary" onclick={handleFinish}>Done</button></div>
                    </template>

                    <template if:true={showSaveRoots}><button slot="foot" class="cq-btn-primary" onclick={handleSaveRoots} disabled={cantSaveRoots}>{saveRootsLabel}</button></template>
                    <template if:true={showActions}><button slot="foot" class="cq-btn-primary" onclick={handleSaveActions} disabled={cantSaveActions}>{saveActionsLabel}</button></template>
                    <template if:true={showConclusion}><button slot="foot" class="cq-btn-primary" onclick={handleComplete} disabled={cantComplete}>{completeLabel}</button></template>

            <template if:true={planFormOpen}>
                <div class="cq-modal-back" onkeydown={handlePlanFormKey}>
                    <section class="cq-modal popov" role="dialog" aria-modal="true" aria-labelledby="plan-head">
                        <header class="cq-modal-head">
                            <h2 id="plan-head" class="cq-modal-title">{planFormTitle}</h2>
                            <button class="cq-modal-x" aria-label="Close" onclick={handlePlanFormCancel}>&times;</button>
                        </header>
                        <div class="cq-modal-body">
                            <label class="cq-field"><span class="cq-label">Title<span class="cq-req">*</span></span>
                                <input class="planta" type="text" maxlength="255" value={planForm.title} data-f="title" oninput={handlePlanFormInput} placeholder="For example, replace the locating pin on fixture BF-02">
                            </label>
                            <label class="cq-field"><span class="cq-label">Description</span>
                                <textarea class="plandesc" rows="3" value={planForm.description} data-f="description" oninput={handlePlanFormInput} placeholder="What will be done, where, and how you will know it worked"></textarea>
                            </label>
                            <div class="cq-field"><span class="cq-label">Type<span class="cq-req">*</span></span>
                                <div class="cq-chips">
                                    <template for:each={planFormTypes} for:item="t">
                                        <button key={t.label} class={t.cls} data-type={t.label} aria-pressed={t.pressed} onclick={handlePlanFormType}>{t.label}</button>
                                    </template>
                                </div>
                            </div>
                            <div class="cq-fields">
                                <div class="cq-field owner"><span class="cq-label">Owner</span>
                                    <lightning-record-picker label="Owner" variant="label-hidden" object-api-name="User" placeholder="You, if left empty" value={planForm.userId} onchange={handlePlanFormOwner}></lightning-record-picker>
                                </div>
                                <label class="cq-field"><span class="cq-label">Due<span class="cq-req">*</span></span>
                                    <input class="date" type="date" value={planForm.due} data-f="due" onchange={handlePlanFormInput}>
                                </label>
                            </div>
                            <div class="cq-note sm0">A correction fixes what is broken now; a corrective action removes the cause; a preventive action stops it happening elsewhere. Save Actions saves it to CQ.</div>
                        </div>
                        <footer class="cq-modal-foot">
                            <span class="cq-blocker">{planFormBlocker}</span>
                            <button class="cq-btn-outline" onclick={handlePlanFormCancel}>Cancel</button>
                            <button class="cq-btn-primary" onclick={handlePlanFormSave} disabled={cantSavePlanForm}>{planFormSaveLabel}</button>
                        </footer>
                    </section>
                </div>
            </template>
            <template if:true={hypOpen}>
                <div class="cq-modal-back" onkeydown={handleHypKey}>
                    <section class="cq-modal" role="dialog" aria-modal="true" aria-labelledby="hyp-head">
                        <header class="cq-modal-head">
                            <h2 id="hyp-head" class="cq-modal-title">Add as Hypothesis</h2>
                            <button class="cq-modal-x" aria-label="Close" onclick={handleHypCancel}>&times;</button>
                        </header>
                        <div class="cq-modal-body">
                            <div class="cq-fromcard">
                                <div class="cq-note sm0">From</div>
                                <div><template if:true={hypFromHasHref}><a class="cq-link" href={hypForm.fromHref} target="_blank">{hypForm.fromName}</a></template><template if:false={hypFromHasHref}><span class="cq-strong">{hypForm.fromName}</span></template> &middot; {hypForm.fromText}</div>
                                <template if:true={hypForm.fromSub}><div class="cq-note sm0">{hypForm.fromSub}</div></template>
                            </div>
                            <label class="cq-field"><span class="cq-label">Hypothesis<span class="cq-req">*</span></span>
                                <textarea class="hypta" rows="3" value={hypForm.title} oninput={handleHypTitle}></textarea>
                            </label>
                            <div class="cq-field"><span class="cq-label">Category<span class="cq-req">*</span></span>
                                <div class="cq-chips">
                                    <template for:each={hypCatOpts} for:item="c">
                                        <button key={c.label} class={c.cls} data-c={c.label} aria-pressed={c.pressed} onclick={handleHypCat}>{c.label}</button>
                                    </template>
                                </div>
                            </div>
                            <div class="cq-note sm0">It starts Open; you test it in Find the Cause.</div>
                        </div>
                        <footer class="cq-modal-foot">
                            <span class="cq-blocker">{hypBlocker}</span>
                            <button class="cq-btn-outline" onclick={handleHypCancel}>Cancel</button>
                            <button class="cq-btn-primary" onclick={handleHypSave} disabled={cantAddHyp}>Add Hypothesis</button>
                        </footer>
                    </section>
                </div>
            </template>
        </c-cq-ws-shell>
    </template>
</template>
