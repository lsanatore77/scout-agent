<template>
    <div class="wrap">
        <template if:true={loadInv}>
            <div class={invCls}>
                <c-cq-investigation-workspace record-id={recordId}></c-cq-investigation-workspace>
            </div>
        </template>
        <template if:true={loadDisp}>
            <div class={dispCls}>
                <c-cq-disposition-workspace record-id={recordId}></c-cq-disposition-workspace>
            </div>
        </template>
        <template if:true={none}>
            <div class="cq-infobox">You can view this NC. Working on its investigation or disposition needs the CQ.AI Can Investigate or Can Disposition permission set.</div>
        </template>
    </div>
</template>
