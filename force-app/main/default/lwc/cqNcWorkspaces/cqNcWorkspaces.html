<template>
    <div class="wrap">
        <template if:true={hasTabs}>
            <div class="parts" role="tablist" aria-label="Part of the nonconformance" onkeydown={handleTabKey}>
                <template for:each={tabs} for:item="t">
                    <button key={t.key} id={t.id} class={t.cls} role="tab" aria-selected={t.selected} data-key={t.key} onclick={handleTab}>{t.label}</button>
                </template>
            </div>
        </template>
        <template if:true={loadInv}>
            <div class={invCls} role="tabpanel" aria-label="Investigation">
                <c-cq-investigation-workspace record-id={recordId}></c-cq-investigation-workspace>
            </div>
        </template>
        <template if:true={loadDisp}>
            <div class={dispCls} role="tabpanel" aria-label="Disposition">
                <c-cq-disposition-workspace record-id={recordId}></c-cq-disposition-workspace>
            </div>
        </template>
        <template if:true={none}>
            <div class="cq-infobox">You can view this NC. Working on its investigation or disposition needs the CQ.AI Can Investigate or Can Disposition permission set.</div>
        </template>
    </div>
</template>
