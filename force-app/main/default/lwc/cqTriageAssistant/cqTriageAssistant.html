<template>
    <div class={veilCls} role={dlgRole} aria-modal={dlgModal} aria-label={heading}>
        <div class={boxCls}>
            <template if:true={popup}>
            <header class="top">
                <div class="tt"><div class="h"><span class="star">&#10022;</span> {heading}</div><div class="sub">{title}</div></div>
                <template if:true={popup}><button class="x" onclick={handleClose} aria-label="Close">&times;</button></template>
                <template if:true={topNav}>
                    <div class="topnav">
                        <span class="cq-blocker">{blocker}</span>
                        <button class="cq-btn-outline" onclick={handleBack} disabled={cantBack}>Back</button>
                        <button class="cq-btn-primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                    </div>
                </template>
            </header>
            </template>
            <div class="cq-ws-body body">
                <nav class="cq-rail" aria-label="Triage Steps">
                    <div class="cq-rail-title"><span class="star">&#10022;</span> CQ.AI Triage Steps</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt">
                                <span class="lbl">{s.label}</span>
                                <span class="ssub">{s.sub}</span>
                            </span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                    <template if:true={canRestart}><button class="cq-restart" onclick={handleRestart}>Start Over</button></template>
                </nav>
                <div class="cq-ws-main main">
                    <template if:true={showResumed}><div class="resumed">Picked up where you left off.</div></template>
                    <template if:true={isGlance}><template if:true={inline}><h3 class="cq-step-title">Triage at a Glance</h3></template><slot></slot>
                        <template if:true={showRepGlance}>
                            <div class="cq-recur">
                                <div class="cq-recur-head"><span aria-hidden="true">&#9888;</span> Happened Before, and the Fix Didn&rsquo;t Hold</div>
                                <div class="lh"><a class="cq-link" href={repBox.ncHref} target="_blank">{repBox.ncName}</a>{repBox.text1}<a class="cq-link" href={repBox.capaHref} target="_blank">{repBox.capaName}</a>{repBox.text2}</div>
                                <template if:true={repBox.efrText}><div class={repBox.efrCls}><a class="cq-redlink" href={repBox.efrHref} target="_blank">{repBox.efrName}</a>{repBox.efrText}</div></template>
                                <template if:true={repBox.noReview}><div class="lh cq-muted">{repBox.capaName} closed with no effectiveness review on record.</div></template>
                                <div class="lh"><strong>What this changes in triage:</strong> {repBox.changes}</div>
                                <div class="repacts">
                                    <a class="cq-btn-outline cq-linkbtn" href={repBox.ncHref} target="_blank">Open {repBox.ncName}</a>
                                    <a class="cq-btn-outline cq-linkbtn" href={repBox.capaHref} target="_blank">Open {repBox.capaName}</a>
                                    <button class="smalllink" onclick={handleNotSame} disabled={repBusy}>Not the Same Problem</button>
                                </div>
                            </div>
                        </template>
                        <template if:true={showRepDismissed}>
                            <div class="repoff">
                                <span class="cq-muted">Marked Not the Same Problem:</span>
                                <template for:each={repDismissed} for:item="d">
                                    <span key={d.key} class="repoffitem">{d.name} <button class="cq-btn-outline" data-id={d.id} onclick={handleRepRestore} disabled={repBusy}>Restore</button></span>
                                </template>
                            </div>
                        </template>
                    </template>
                    <template if:true={is0}>
                        <h3 class="cq-step-title">Containment</h3>
                        <div class="cgrid">
                            <div class="cq-card-title">Possible Actions</div>
                            <div class="chead">
                                <template if:false={showAdd}>
                                    <button class="cq-btn-outline addbtn" onclick={handleShowAdd}>Add Containment</button>
                                </template>
                            </div>
                            <div class="cq-col">
                                <div class="cq-tblwrap" style="margin-top: 0">
                                    <table class="cq-tbl">
                                        <thead><tr><th class="center">Select</th><th>Action</th><th>Recommendation</th></tr></thead>
                                        <tbody>
                                            <template for:each={actions} for:item="a">
                                                <tr key={a.id}>
                                                    <td class="center"><input type="checkbox" class="cb" data-id={a.id} checked={a.on} onchange={handleAct} aria-label={a.label}></td>
                                                    <td class="wide"><div class="cq-strong">{a.label}</div><div class="isum">{a.why}</div></td>
                                                    <td class="cq-nowrap"><template if:true={a.cq}><c-cq-ai-why variant="pill" subject={a.label} tail=" here?"></c-cq-ai-why></template></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <template if:true={hasActs}>
                                    <label class="cq-field"><span class="cq-label">Due Date for the Ticked Actions<span class="cq-req">*</span></span>
                                        <input class="date" type="date" data-f="due" value={due} onchange={handleInput} />
                                    </label>
                                    <p class="cq-note">On Complete Triage, each ticked action is created as a CQ containment on this NC, assigned to you.</p>
                                </template>
                                <template if:true={noAction}>
                                    <label class="cq-field"><span class="cq-label">Why is No Action Needed?<span class="cq-req">*</span></span>
                                        <textarea rows="2" data-f="noActionWhy" value={noActionWhy} oninput={handleInput}></textarea>
                                    </label>
                                </template>
                            </div>
                            <div class="cq-col">
                                <template for:each={added} for:item="a">
                                    <div key={a.key} class="cq-kv added"><span class="ic">&#10003;</span><span class="cq-kv-v">{a.name} &middot; {a.title}</span></div>
                                </template>
                                <template if:true={showAdd}>
                                    <div class="addform">
                                        <div class="cq-card-title">New Containment</div>
                                        <label class="cq-field"><span class="cq-label">Title<span class="cq-req">*</span></span>
                                            <input type="text" data-f="cTitle" value={cTitle} oninput={handleInput} />
                                        </label>
                                        <label class="cq-field"><span class="cq-label">Description</span>
                                            <textarea rows="1" data-f="cDesc" value={cDesc} oninput={handleInput}></textarea>
                                        </label>
                                        <div class="pair">
                                            <label class="cq-field"><span class="cq-label">Due Date<span class="cq-req">*</span></span>
                                                <input type="date" data-f="cDue" value={cDue} onchange={handleInput} />
                                            </label>
                                            <div class="cq-field">
                                                <lightning-record-picker label="Assignee" object-api-name="User" value={cAssignee} onchange={handleAssignee}></lightning-record-picker>
                                            </div>
                                        </div>
                                        <template if:true={addError}><div class="cq-msg crit errbox">{addError}</div></template>
                                        <div class="cq-opts">
                                            <button class="cq-btn-primary" onclick={handleCreate} disabled={cantCreate}>{createLabel}</button>
                                            <button class="cq-btn-outline" onclick={handleCancelAdd}>Cancel</button>
                                        </div>
                                    </div>
                                </template>
                                <div class="factcard">
                                    <div class="cq-ai-card fsug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" subject={suggestedAct}></c-cq-ai-why> <strong>{suggestedAct}</strong></div>
                                    <details class="cq-know">
                                        <summary>What We Know</summary>
                                        <ul class="flist">
                                            <template for:each={factLines} for:item="f"><li key={f.key} class={f.cls}>{f.text}</li></template>
                                        </ul>
                                    </details>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <h3 class="cq-step-title">Data Check</h3>
                        <p class="cq-step-intro">What was reported, and is it enough to send on? Photos and a description may be all you get.</p>
                        <div class="cq-tblwrap" style="margin-top: 0">
                            <table class="cq-tbl">
                                <thead><tr><th class="center">Status</th><th>Data</th><th>Recorded</th></tr></thead>
                                <tbody>
                                    <template for:each={dataRows} for:item="r">
                                        <tr key={r.key}>
                                            <td class="center"><template if:true={r.ok}><span class="ic" style="width: 24px; margin: 0 auto">&#10003;</span></template><template if:false={r.ok}><span class="warn"><span class="ic" style="width: 24px; margin: 0 auto">!</span></span></template></td>
                                            <td class="cq-nowrap" style="color: #5b6470">{r.k}</td>
                                            <td class="wide cq-strong">{r.v}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <div class="cq-opts">
                            <template for:each={dataOpts} for:item="o">
                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handleData} aria-pressed={o.pressed}>{o.label}</button>
                            </template>
                        </div>
                        <template if:true={dataAsk}>
                            <div class="cq-card-title cq-mt16">What Do You Need? *</div>
                            <div class="cq-chips">
                                <template for:each={askChips} for:item="c">
                                    <button key={c.label} class={c.cls} data-id={c.label} onclick={handleAsk} aria-pressed={c.pressed}>{c.label}</button>
                                </template>
                            </div>
                            <div class="cq-field asknote"><textarea rows="2" placeholder="Anything else" data-f="askNote" value={askNote} oninput={handleInput}></textarea></div>
                            <p class="cq-note">The request is recorded on the nonconformance. Sending it to the reporter is not built yet.</p>
                        </template>
                    </template>

                    <template if:true={is2}>
                        <h3 class="cq-step-title">Confirm the Risk</h3>
                        <template if:false={riskReady}><p class="cq-step-intro">Working out the risk&hellip;</p></template>
                        <template if:true={riskReady}>
                            <div class="riskwrap">
                                <div class="heat">
                                    <div class="hrow">
                                        <span class="axis">Severity</span>
                                    </div>
                                    <template for:each={heatRows} for:item="r">
                                        <div key={r.key} class="hrow">
                                            <span class="hlab"><span class="cnum">{r.num}</span>{r.rest}</span>
                                            <template for:each={r.cells} for:item="c">
                                                <button key={c.key} class={c.cls} data-s={c.s} data-l={c.l} onclick={handleCell} aria-label={c.aria} aria-pressed={c.pressed}>
                                                    <template if:true={c.sug}><span class="cstar">&#10022;</span></template>{c.text}
                                                    <span class="tip" role="tooltip">
                                                        <template if:true={c.sug}><span class="tips">&#10022; CQ.AI Suggests</span></template>
                                                        <span class="tiph"><span class={c.lvlCls}>{c.text}</span><span class="tipdot">&middot;</span><span>Score {c.n} of 25</span></span>
                                                        <span class="tipc">{c.tipSev}</span>
                                                        <span class="tipx">&times;</span>
                                                        <span class="tipc">{c.tipLik}</span>
                                                    </span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <template for:each={heatCols} for:item="c">
                                            <span key={c.key} class="clab"><span class="cnum">{c.num}</span><span>{c.word}</span></span>
                                        </template>
                                    </div>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <span class="axis across">Likelihood</span>
                                    </div>
                                </div>
                                <div class="rside">
                                    <div class="cq-ai-card">
                                        <div class="cq-ai-eyebrow"><c-cq-ai-why variant="label" text="CQ.AI Suggests" lead="Why does CQ.AI suggest risk " subject={suggestedRisk}></c-cq-ai-why></div>
                                        <div class="sughead"><span class={sugCls}>{suggestedRisk}</span><span class="cq-sub">Score {suggestedScore} of 25</span></div>
                                        <div class="why">
                                            <div class="whyk">Severity: {sevHead}</div>
                                            <div class="cq-ai-says">{sevWhy}</div>
                                        </div>
                                        <div class="why">
                                            <div class="whyk">Likelihood: {likHead} <span class="raised">{likRaised}</span></div>
                                            <div class="cq-ai-says">{likWhy}</div>
                                            <template if:true={rep}><div class="cq-ai-says redtext">{repRiskLine}</div></template>
                                            <template if:true={recentList}><div class="cq-ai-says cq-muted">Latest: {recentList}</div></template>
                                        </div>
                                        <template if:true={escaped}><div class="why bad">{escapedWhy}. Risk is High whatever cell is chosen.</div></template>
                                    </div>
                                    <div class="yours">
                                        <div class="cq-card-title">Selected</div>
                                        <div class="sughead"><span class={riskCls}>{risk}</span><span class="cq-sub">Score {score} of 25</span></div>
                                        <div class="cq-ai-says">{sevLabel} severity &times; {likLabel} likelihood</div>
                                    </div>
                                </div>
                            </div>
                            <p class="cq-note">The purple &#10022; cell is CQ.AI's suggestion and is already selected. Click another cell to change it; hover over a cell for its score.</p>
                        </template>
                    </template>

                    <template if:true={is3}>
                        <h3 class="cq-step-title">Next Steps</h3>
                        <p class="cq-step-intro">CQ.AI suggests; you decide. Complete Triage moves the NC to Disposition / Investigate.</p>
                        <div class="cards">
                            <c-cq-field-action-review record-id={recordId}></c-cq-field-action-review>
                            <template if:true={nextReady}>
                                <div class="kard">
                                    <div>
                                        <div class="cq-dcard-name">Disposition</div>
                                        <div class="cq-dcard-state">{dispState}<template if:true={dispReq}> &middot; <button class="smalllink" data-kind="disp" onclick={handleDlgEdit}>Edit</button></template></div>
                                    </div>
                                    <div class="cq-dcard-sug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Does this nonconformance need a disposition?"></c-cq-ai-why> <strong>{dispSugText}.</strong> {nx.dispWhy}</div>
                                    <div class="cq-dcard-chips">
                                        <template for:each={dispOpts} for:item="o">
                                            <button key={o.id} class={o.cls} data-id={o.id} onclick={handleDisp} aria-pressed={o.pressed}>{o.label}</button>
                                        </template>
                                    </div>
                                </div>
                                <div class="kard">
                                    <div>
                                        <div class="cq-dcard-name">Investigation</div>
                                        <div class="cq-dcard-state">{invState}<template if:true={invReq}> &middot; <button class="smalllink" data-kind="inv" onclick={handleDlgEdit}>Edit</button></template></div>
                                    </div>
                                    <div class="cq-dcard-sug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Should this nonconformance be investigated or logged only?"></c-cq-ai-why> <strong>{invSugText}.</strong> {nx.invWhy}</div>
                                    <div class="cq-dcard-chips">
                                        <template for:each={invOpts} for:item="o">
                                            <button key={o.id} class={o.cls} data-id={o.id} onclick={handleInv} aria-pressed={o.pressed}>{o.label}</button>
                                        </template>
                                    </div>
                                </div>
                                <template if:true={rep}>
                                    <div class="kard warnk">
                                        <div><div class="cq-dcard-name">CAPA</div><div class="cq-dcard-state">Happened before</div></div>
                                        <div class="cq-dcard-sug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Should this repeat problem be escalated to a CAPA?"></c-cq-ai-why> <strong>Escalate to CAPA.</strong> {capaWhy}</div>
                                        <div class="cq-dcard-chips">
                                            <template for:each={capaOpts} for:item="o">
                                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handleCapa} aria-pressed={o.pressed}>{o.label}</button>
                                            </template>
                                        </div>
                                        <template if:true={capaNeedsReason}>
                                            <label class="cq-field"><span class="cq-label">Why Not Escalated<span class="cq-req">*</span></span>
                                                <input type="text" data-f="capaReason" value={capaReason} oninput={handleInput} placeholder="For example, the cause is different: a new adhesive lot, not the fixture" />
                                            </label>
                                        </template>
                                    </div>
                                </template>
                            </template>
                        </div>
                        <template if:false={nextReady}><p class="cq-note">Working out the next steps&hellip;</p></template>
                        <template if:true={nextReady}>
                        <template if:true={rep}>
                            <p class="cq-note lh"><strong>Escalate to CAPA:</strong> sets CQ&rsquo;s Initiate CAPA on this NC and records {rep.ncName} as what it repeats. A closed CAPA is not reopened. <strong>Link to {capaLinkName}:</strong> sets it as this NC&rsquo;s Related CAPA, with no new CAPA.</p>
                        </template>
                        <template if:true={dlg}>
                            <div class="cq-modal-back" onkeydown={handleDlgKey}>
                                <section class="cq-modal modal" role="dialog" aria-modal="true" aria-labelledby="dlg-head">
                                    <header class="cq-modal-head">
                                        <h2 id="dlg-head" class="cq-modal-title">{dlgTitle}</h2>
                                        <button class="cq-modal-x" aria-label="Close" onclick={handleDlgCancel}>&times;</button>
                                    </header>
                                    <div class="cq-modal-body">
                                        <div class="mrow">
                                            <label class="cq-field"><span class="cq-label">{dlgDueLabel}<span class="cq-req">*</span></span>
                                                <input class="date" type="date" data-f="due" value={dlg.due} onchange={handleDlgInput} />
                                            </label>
                                            <button class="cq-chip" onclick={handleDlgAppr} aria-pressed={dlgApprPressed}>Needs Approval</button>
                                        </div>
                                        <template if:true={dlgShowMatrix}>
                                            <label class="cq-field"><span class="cq-label">Approval Matrix<span class="cq-req">*</span></span>
                                                <select onchange={handleDlgMatrix}>
                                                    <template for:each={dlgMatrixOpts} for:item="m"><option key={m.value} value={m.value} selected={m.selected}>{m.label}</option></template>
                                                </select>
                                                <template if:true={dlgNoMatrix}><span class="cq-hint">No nonconformance approval matrix covers this approval. Add a step for it in CQ's Approval Matrix.</span></template>
                                                <template if:false={dlgNoMatrix}><span class="cq-hint">Approvers come from the matrix. CQ asks them when it is submitted.</span></template>
                                            </label>
                                        </template>
                                        <label class="cq-field"><span class="cq-label">{dlgNoteLabel}</span>
                                            <textarea rows="3" data-f="note" value={dlg.note} oninput={handleDlgInput} placeholder={dlgNotePh}></textarea>
                                            <span class="cq-hint">{dlgNoteHint}</span>
                                        </label>
                                        <template if:true={dlgIsDisp}><p class="cq-note mnote">The disposition itself is decided in the Disposition workspace after triage.</p></template>
                                    </div>
                                    <footer class="cq-modal-foot">
                                        <button class="cq-btn-outline" onclick={handleDlgCancel}>Cancel</button>
                                        <button class="cq-btn-primary" onclick={handleDlgSave} disabled={dlgCantSave}>Save</button>
                                    </footer>
                                </section>
                            </div>
                        </template>
                        <template if:true={invReq}>
                            <div class="cq-card-title cq-mt16">Relevant Investigations to Link for Research</div>
                            <p class="cq-note lead">Optional. Linked investigations are for research only and do not replace this NC&rsquo;s own investigation.</p>
                                <template if:false={linksReady}><p class="cq-note">Looking for relevant investigations&hellip;</p></template>
                                <template if:true={linksReady}>
                                    <template if:true={noLinks}><p class="cq-note">No other investigations were found on this part.</p></template>
                                    <template if:true={hasSug}>
                                        <div class="cq-tblwrap">
                                            <table class="cq-tbl">
                                                <thead><tr><th class="center">Link</th><th>Investigation</th><th>From NC</th><th>Status</th><th>Match</th><th>Recommendation</th></tr></thead>
                                                <tbody>
                                                    <template for:each={sugPg.shown} for:item="v">
                                                        <tr key={v.id}>
                                                            <td class="center"><input type="checkbox" class="cb" data-id={v.id} checked={v.on} disabled={v.linked} onchange={handleLink} aria-label={v.name}></td>
                                                            <td class="wide"><div class="cq-strong">{v.name}</div><template if:true={v.summary}><div class="isum">{v.summary}</div></template></td>
                                                            <td class="cq-nowrap">{v.ncName}</td>
                                                            <td class="cq-nowrap">{v.status}</td>
                                                            <td class="cq-nowrap"><template if:true={v.linked}>Already linked</template><template if:false={v.linked}>{v.why}</template></td>
                                                            <td class="cq-nowrap"><template if:true={v.suggested}><c-cq-ai-why variant="pill" lead="Why does CQ.AI suggest linking " subject={v.name}></c-cq-ai-why></template></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <template if:true={sugPg.has}>
                                            <div class="cq-pager">
                                                <nav class="cq-pages" aria-label="Investigation pages">
                                                    <button class="pg" data-w="sug" data-p="prev" onclick={handleLinkPage} disabled={sugPg.prevOff} aria-label="Previous page">&laquo;</button>
                                                    <template for:each={sugPg.items} for:item="p">
                                                        <button key={p.key} class={p.cls} data-w="sug" data-p={p.p} onclick={handleLinkPage} disabled={p.off} aria-current={p.current} aria-label={p.label}>{p.text}</button>
                                                    </template>
                                                    <button class="pg" data-w="sug" data-p="next" onclick={handleLinkPage} disabled={sugPg.nextOff} aria-label="Next page">&raquo;</button>
                                                </nav>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={hasOther}>
                                        <details class="cq-know">
                                            <summary>{otherLabel}</summary>
                                            <div class="cq-tblwrap">
                                                <table class="cq-tbl">
                                                    <thead><tr><th class="center">Link</th><th>Investigation</th><th>From NC</th><th>Status</th><th>Match</th><th>Recommendation</th></tr></thead>
                                                    <tbody>
                                                        <template for:each={otherPg.shown} for:item="v">
                                                            <tr key={v.id}>
                                                                <td class="center"><input type="checkbox" class="cb" data-id={v.id} checked={v.on} disabled={v.linked} onchange={handleLink} aria-label={v.name}></td>
                                                                <td class="wide"><div class="cq-strong">{v.name}</div><template if:true={v.summary}><div class="isum">{v.summary}</div></template></td>
                                                                <td class="cq-nowrap">{v.ncName}</td>
                                                                <td class="cq-nowrap">{v.status}</td>
                                                                <td class="cq-nowrap"><template if:true={v.linked}>Already linked</template><template if:false={v.linked}>{v.why}</template></td>
                                                                <td class="cq-nowrap"><template if:true={v.suggested}><c-cq-ai-why variant="pill" lead="Why does CQ.AI suggest linking " subject={v.name}></c-cq-ai-why></template></td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <template if:true={otherPg.has}>
                                                <div class="cq-pager">
                                                    <nav class="cq-pages" aria-label="Investigation pages">
                                                        <button class="pg" data-w="other" data-p="prev" onclick={handleLinkPage} disabled={otherPg.prevOff} aria-label="Previous page">&laquo;</button>
                                                        <template for:each={otherPg.items} for:item="p">
                                                            <button key={p.key} class={p.cls} data-w="other" data-p={p.p} onclick={handleLinkPage} disabled={p.off} aria-current={p.current} aria-label={p.label}>{p.text}</button>
                                                        </template>
                                                        <button class="pg" data-w="other" data-p="next" onclick={handleLinkPage} disabled={otherPg.nextOff} aria-label="Next page">&raquo;</button>
                                                    </nav>
                                                </div>
                                            </template>
                                        </details>
                                    </template>
                                    <div class="addinv">
                                        <lightning-record-picker label="Add Another Investigation" placeholder="Search by investigation number"
                                            object-api-name="compliancequest__SQX_Investigation__c" onchange={handlePick}></lightning-record-picker>
                                    </div>
                                    <template if:true={linkError}><div class="cq-msg crit errbox">{linkError}</div></template>
                                    <p class="cq-note">Ticked investigations are linked to this NC when you click Complete Triage.</p>
                                </template>
                        </template>
                        </template>
                    </template>

                    <template if:true={showSummary}>
                        <div class="cq-donehead"><span class="cq-okdot">&#10003;</span><h3 class="cq-step-title nom">Triage Complete</h3></div>
                        <div class="cq-tblwrap cq-sum"><table class="cq-tbl">
                            <thead><tr><th>Item</th><th>Recorded</th></tr></thead>
                            <tbody><template for:each={summary} for:item="r"><tr key={r.key}><td class="k">{r.k}</td><td class="v">{r.v}</td></tr></template></tbody>
                        </table></div>
                        <template if:true={warning}><div class="cq-msg warn">{warning}</div></template>
                        <template if:true={popup}><div class="cq-opts"><button class="cq-btn-primary" onclick={handleClose}>Back to the Nonconformance</button></div></template>
                        <template if:true={inline}><div class="cq-opts"><button class="cq-btn-primary" onclick={handleFinish}>Done</button></div></template>
                    </template>
                    <template if:true={error}><div class="cq-msg crit errbox">{error}</div></template>
                    <template if:true={inline}><template if:true={footNav}>
                        <footer class="cq-ws-foot">
                            <span class="cq-blocker">{blocker}</span>
                            <button class="cq-btn-outline" onclick={handleBack} disabled={cantBack}>Back</button>
                            <button class="cq-btn-primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                        </footer>
                    </template></template>
                </div>
            </div>
            <template if:true={popup}><template if:true={footNav}>
                <footer class="foot">
                    <span class="cq-grow"></span>
                    <span class="cq-blocker">{blocker}</span>
                    <button class="cq-btn-outline" onclick={handleBack} disabled={cantBack}>Back</button>
                    <button class="cq-btn-primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                </footer>
            </template></template>
        </div>
    </div>
</template>
