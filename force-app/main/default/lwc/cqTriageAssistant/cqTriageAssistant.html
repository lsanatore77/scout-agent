<template>
    <div class={veilCls} role={dlgRole} aria-modal={dlgModal} aria-label={heading}>
        <div class={boxCls}>
            <template if:true={popup}>
            <header class="top">
                <div class="tt"><div class="h"><span class="star">&#10022;</span> {heading}</div><div class="sub">{title}</div></div>
                <template if:true={popup}><button class="x" onclick={handleClose} aria-label="Close">&times;</button></template>
                <template if:true={topNav}>
                    <div class="topnav">
                        <span class="blocker">{blocker}</span>
                        <button class="btn" onclick={handleBack} disabled={cantBack}>Back</button>
                        <button class="btn primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                    </div>
                </template>
            </header>
            </template>
            <div class="body">
                <nav class="steps" aria-label="Triage Steps">
                    <div class="steps-title"><template if:true={inline}><span class="star">&#10022;</span> </template>{stepsTitle}</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt">
                                <span class="lbl">{s.label}</span>
                                <span class="ssub">{s.sub}</span>
                            </span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                    <template if:true={canRestart}><button class="restart" onclick={handleRestart}>Start Over</button></template>
                </nav>
                <div class="main">
                    <template if:true={showResumed}><div class="resumed">Picked up where you left off.</div></template>
                    <template if:true={isGlance}><template if:true={inline}><h3 class="q">Triage at a Glance</h3></template><slot></slot></template>
                    <template if:true={is0}>
                        <h3 class="q">Containment</h3>
                        <div class="cgrid">
                            <div class="lab">Possible Actions</div>
                            <div class="chead">
                                <template if:false={showAdd}>
                                    <button class="btn addbtn" onclick={handleShowAdd}>Add Containment</button>
                                </template>
                            </div>
                            <div class="col">
                                <template for:each={actions} for:item="a">
                                    <button key={a.id} class={a.cls} data-id={a.id} onclick={handleAct} aria-pressed={a.pressed}>
                                        <span class="tick">{a.tick}</span>
                                        <span class="rt"><span class="rv">{a.label}</span><span class="rk">{a.why}</span></span>
                                        <template if:true={a.cq}><c-cq-ai-why variant="star" subject={a.label} tail=" here?"></c-cq-ai-why></template>
                                    </button>
                                </template>
                                <template if:true={hasActs}>
                                    <label class="fl">Due Date for the Ticked Actions *
                                        <input class="ta date" type="date" data-f="due" value={due} onchange={handleInput} />
                                    </label>
                                    <p class="note">On Complete Triage, each ticked action is created as a CQ containment on this NC, assigned to you.</p>
                                </template>
                                <template if:true={noAction}>
                                    <label class="fl">Why is No Action Needed? *
                                        <textarea class="ta" rows="2" data-f="noActionWhy" value={noActionWhy} oninput={handleInput}></textarea>
                                    </label>
                                </template>
                            </div>
                            <div class="col">
                                <template for:each={added} for:item="a">
                                    <div key={a.key} class="row slim added"><span class="ic">&#10003;</span><span class="dv">{a.name} &middot; {a.title}</span></div>
                                </template>
                                <template if:true={showAdd}>
                                    <div class="addform">
                                        <div class="lab">New Containment</div>
                                        <label class="fl">Title *
                                            <input class="ta sm" type="text" data-f="cTitle" value={cTitle} oninput={handleInput} />
                                        </label>
                                        <label class="fl">Description
                                            <textarea class="ta sm" rows="1" data-f="cDesc" value={cDesc} oninput={handleInput}></textarea>
                                        </label>
                                        <div class="pair">
                                            <label class="fl">Due Date *
                                                <input class="ta sm" type="date" data-f="cDue" value={cDue} onchange={handleInput} />
                                            </label>
                                            <div class="fl">
                                                <lightning-record-picker label="Assignee" object-api-name="User" value={cAssignee} onchange={handleAssignee}></lightning-record-picker>
                                            </div>
                                        </div>
                                        <template if:true={addError}><div class="errbox">{addError}</div></template>
                                        <div class="opts">
                                            <button class="btn sm primary" onclick={handleCreate} disabled={cantCreate}>{createLabel}</button>
                                            <button class="btn sm" onclick={handleCancelAdd}>Cancel</button>
                                        </div>
                                    </div>
                                </template>
                                <div class="factcard">
                                    <div class="fsug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" subject={suggestedAct}></c-cq-ai-why> <strong>{suggestedAct}</strong></div>
                                    <details class="know">
                                        <summary>What We Know</summary>
                                        <ul class="flist">
                                            <template for:each={factLines} for:item="f"><li key={f.key} class={f.cls}>{f.text}</li></template>
                                        </ul>
                                    </details>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <h3 class="q">Data Check</h3>
                        <p class="p">What was reported, and is it enough to send on? Photos and a description may be all you get.</p>
                        <template for:each={dataRows} for:item="r">
                            <div key={r.key} class={r.cls}><span class="ic">{r.icon}</span><span class="dk">{r.k}</span><span class="dv">{r.v}</span></div>
                        </template>
                        <div class="opts">
                            <template for:each={dataOpts} for:item="o">
                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handleData}>{o.label}</button>
                            </template>
                        </div>
                        <template if:true={dataAsk}>
                            <div class="lab top8">What Do You Need? *</div>
                            <div class="chips">
                                <template for:each={askChips} for:item="c">
                                    <button key={c.label} class={c.cls} data-id={c.label} onclick={handleAsk} aria-pressed={c.pressed}>{c.label}</button>
                                </template>
                            </div>
                            <textarea class="ta" rows="2" placeholder="Anything else" data-f="askNote" value={askNote} oninput={handleInput}></textarea>
                            <p class="note">The request is recorded on the nonconformance. Sending it to the reporter is not built yet.</p>
                        </template>
                    </template>

                    <template if:true={is2}>
                        <h3 class="q">Confirm the Risk</h3>
                        <template if:false={riskReady}><p class="p">Working out the risk&hellip;</p></template>
                        <template if:true={riskReady}>
                            <div class="riskwrap">
                                <div class="heat">
                                    <div class="hrow">
                                        <span class="axis">Severity</span>
                                    </div>
                                    <template for:each={heatRows} for:item="r">
                                        <div key={r.key} class="hrow">
                                            <span class="hlab"><span class="cnum">{r.num}</span>{r.rest}</span>
                                            <template for:each={r.cells} for:item="c">
                                                <button key={c.key} class={c.cls} data-s={c.s} data-l={c.l} onclick={handleCell} aria-label={c.aria} aria-pressed={c.pressed}>
                                                    <template if:true={c.sug}><span class="cstar">&#10022;</span></template>{c.text}
                                                    <span class="tip" role="tooltip">
                                                        <template if:true={c.sug}><span class="tips">&#10022; CQ.AI Suggests</span></template>
                                                        <span class="tiph"><span class={c.lvlCls}>{c.text}</span><span class="tipdot">&middot;</span><span>Score {c.n} of 25</span></span>
                                                        <span class="tipc">{c.tipSev}</span>
                                                        <span class="tipx">&times;</span>
                                                        <span class="tipc">{c.tipLik}</span>
                                                    </span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <template for:each={heatCols} for:item="c">
                                            <span key={c.key} class="clab"><span class="cnum">{c.num}</span><span>{c.word}</span></span>
                                        </template>
                                    </div>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <span class="axis across">Likelihood</span>
                                    </div>
                                </div>
                                <div class="rside">
                                    <div class="sugbox">
                                        <div class="rec"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" lead="Why does CQ.AI suggest risk " subject={suggestedRisk}></c-cq-ai-why></div>
                                        <div class="sughead"><span class={sugCls}>{suggestedRisk}</span><span class="rk">Score {suggestedScore} of 25</span></div>
                                        <div class="why">
                                            <div class="whyk">Severity: {sevHead}</div>
                                            <div class="whyv">{sevWhy}</div>
                                        </div>
                                        <div class="why">
                                            <div class="whyk">Likelihood: {likHead}</div>
                                            <div class="whyv">{likWhy}</div>
                                            <template if:true={recentList}><div class="whyv muted">Latest: {recentList}</div></template>
                                        </div>
                                        <template if:true={escaped}><div class="why bad">{escapedWhy}. Risk is High whatever cell is chosen.</div></template>
                                    </div>
                                    <div class="yours">
                                        <div class="lab">Selected</div>
                                        <div class="sughead"><span class={riskCls}>{risk}</span><span class="rk">Score {score} of 25</span></div>
                                        <div class="whyv">{sevLabel} severity &times; {likLabel} likelihood</div>
                                    </div>
                                </div>
                            </div>
                            <p class="note">The purple &#10022; cell is CQ.AI's suggestion and is already selected. Click another cell to change it; hover over a cell for its score.</p>
                        </template>
                    </template>

                    <template if:true={is3}>
                        <h3 class="q">Next Steps</h3>
                        <p class="p">What happens after triage. CQ.AI suggests; you decide. Complete Triage moves the NC to Disposition / Investigate.</p>
                        <div class="farwrap"><c-cq-field-action-review record-id={recordId}></c-cq-field-action-review></div>
                        <template if:false={nextReady}><p class="p">Working out the next steps&hellip;</p></template>
                        <template if:true={nextReady}>
                        <div class="cgrid">
                            <div class="col">
                                <div class="lab">Disposition</div>
                                <div class="fsug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Does this nonconformance need a disposition?"></c-cq-ai-why> <strong>{dispSugText}.</strong> {nx.dispWhy}</div>
                                <div class="opts">
                                    <template for:each={dispOpts} for:item="o">
                                        <button key={o.id} class={o.cls} data-id={o.id} onclick={handleDisp} aria-pressed={o.pressed}>{o.label}</button>
                                    </template>
                                </div>
                                <template if:true={dispReq}>
                                    <label class="fl">Disposition Due *
                                        <input class="ta date" type="date" data-f="dispDue" value={dispDue} onchange={handleInput} />
                                    </label>
                                    <div class="opts"><button class={dispApprCls} onclick={handleDispAppr} aria-pressed={dispApprPressed}>Needs Approval</button></div>
                                    <p class="note">Decided in the Disposition workspace after triage.</p>
                                </template>
                            </div>
                            <div class="col">
                                <div class="lab">Investigation</div>
                                <div class="fsug"><c-cq-ai-why variant="label" text="CQ.AI Suggests:" question="Should this nonconformance be investigated or logged only?"></c-cq-ai-why> <strong>{invSugText}.</strong> {nx.invWhy}</div>
                                <div class="opts">
                                    <template for:each={invOpts} for:item="o">
                                        <button key={o.id} class={o.cls} data-id={o.id} onclick={handleInv} aria-pressed={o.pressed}>{o.label}</button>
                                    </template>
                                </div>
                                <template if:true={invReq}>
                                    <label class="fl">Investigation Due *
                                        <input class="ta date" type="date" data-f="invDue" value={invDue} onchange={handleInput} />
                                    </label>
                                    <div class="opts"><button class={invApprCls} onclick={handleInvAppr} aria-pressed={invApprPressed}>Needs Approval</button></div>
                                </template>
                            </div>
                        </div>
                        <template if:true={needMatrix}>
                            <label class="fl">Approval Matrix *
                                <select class="sel" onchange={handleMatrix}>
                                    <template for:each={matrixOpts} for:item="m"><option key={m.value} value={m.value} selected={m.selected}>{m.label}</option></template>
                                </select>
                            </label>
                            <template if:true={noMatrix}><p class="note">No nonconformance approval matrix covers this approval. Add a step for it in CQ's Approval Matrix.</p></template>
                            <p class="note">Approvers come from the matrix. CQ asks them when the disposition or investigation is submitted.</p>
                        </template>
                        <template if:true={invReq}>
                            <div class="lab top8">Investigations to Link for Research</div>
                            <div class="ownbox"><strong>{ownLine}</strong> Linked investigations are for research only and do not replace it. Linking is optional.</div>
                                <template if:false={linksReady}><p class="p">Looking for related investigations&hellip;</p></template>
                                <template if:true={linksReady}>
                                    <div class="lab">Related Investigations</div>
                                    <template if:true={noLinks}><p class="note">No other investigations were found on this part.</p></template>
                                    <template if:true={hasSug}>
                                        <div class="invlist">
                                            <template for:each={sugItems} for:item="v">
                                            <button key={v.id} class={v.cls} data-id={v.id} onclick={handleLink} aria-pressed={v.pressed}>
                                                <span class="tick">{v.tick}</span>
                                                <span class="rt">
                                                    <span class="rv">{v.name}</span>
                                                    <span class="rk">{v.meta}</span>
                                                    <template if:true={v.summary}><span class="isum">{v.summary}</span></template>
                                                </span>
                                                <template if:true={v.suggested}><c-cq-ai-why variant="pill" lead="Why does CQ.AI suggest linking " subject={v.name}></c-cq-ai-why></template>
                                            </button>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:true={hasOther}>
                                        <details class="know">
                                            <summary>{otherLabel}</summary>
                                            <div class="invlist">
                                                <template for:each={otherItems} for:item="v">
                                                <button key={v.id} class={v.cls} data-id={v.id} onclick={handleLink} aria-pressed={v.pressed}>
                                                    <span class="tick">{v.tick}</span>
                                                    <span class="rt">
                                                        <span class="rv">{v.name}</span>
                                                        <span class="rk">{v.meta}</span>
                                                        <template if:true={v.summary}><span class="isum">{v.summary}</span></template>
                                                    </span>
                                                    <template if:true={v.suggested}><c-cq-ai-why variant="pill" lead="Why does CQ.AI suggest linking " subject={v.name}></c-cq-ai-why></template>
                                                </button>
                                                </template>
                                            </div>
                                        </details>
                                    </template>
                                    <div class="addinv">
                                        <lightning-record-picker label="Add Another Investigation" placeholder="Search by investigation number"
                                            object-api-name="compliancequest__SQX_Investigation__c" onchange={handlePick}></lightning-record-picker>
                                    </div>
                                    <template if:true={linkError}><div class="errbox">{linkError}</div></template>
                                    <p class="note">Ticked investigations are linked to this NC when you click Complete Triage.</p>
                                </template>
                        </template>
                        </template>
                    </template>

                    <template if:true={showSummary}>
                        <div class="donehead"><span class="okdot">&#10003;</span><h3 class="q nom">Triage Complete</h3></div>
                        <template for:each={summary} for:item="r">
                            <div key={r.key} class="row slim"><span class="dk">{r.k}</span><span class="dv">{r.v}</span></div>
                        </template>
                        <template if:true={warning}><div class="warnbox">{warning}</div></template>
                        <template if:true={popup}><div class="opts"><button class="btn primary" onclick={handleClose}>Back to the Nonconformance</button></div></template>
                        <template if:true={inline}><div class="opts"><button class="btn primary" onclick={handleFinish}>Done</button></div></template>
                    </template>
                    <template if:true={error}><div class="errbox">{error}</div></template>
                </div>
            </div>
            <template if:true={footNav}>
                <footer class="foot">
                    <span class="grow"></span>
                    <span class="blocker">{blocker}</span>
                    <button class="btn" onclick={handleBack} disabled={cantBack}>Back</button>
                    <button class="btn primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                </footer>
            </template>
        </div>
    </div>
</template>
