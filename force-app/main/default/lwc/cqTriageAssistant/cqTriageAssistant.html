<template>
    <div class="veil" role="dialog" aria-modal="true" aria-label="Triage Assistant">
        <div class="box">
            <header class="top">
                <div class="tt"><div class="h"><span class="star">&#10022;</span> Triage Assistant</div><div class="sub">{title}</div></div>
                <button class="x" onclick={handleClose} aria-label="Close">&times;</button>
            </header>
            <div class="body">
                <nav class="steps" aria-label="Triage steps">
                    <div class="steps-title">Triage steps</div>
                    <template for:each={steps} for:item="s">
                        <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked}>
                            <span class="mark">
                                <template if:true={s.done}>&#10003;</template>
                                <template if:true={s.notDone}>{s.n}</template>
                            </span>
                            <span class="txt">
                                <span class="lbl">{s.label}</span>
                                <span class="ssub">{s.sub}</span>
                            </span>
                        </button>
                    </template>
                    <div class="progress">{progress}</div>
                </nav>
                <div class="main">
                    <template if:true={is0}>
                        <h3 class="q">Containment</h3>
                        <div class="cols">
                            <div class="col">
                                <div class="lab">Possible actions</div>
                                <template for:each={actions} for:item="a">
                                    <button key={a.id} class={a.cls} data-id={a.id} onclick={handleAct} aria-pressed={a.pressed}>
                                        <span class="tick">{a.tick}</span>
                                        <span class="rt"><span class="rv">{a.label}</span><span class="rk">{a.why}</span></span>
                                        <template if:true={a.cq}><span class="star" title="CQ.AI Suggestion">&#10022;</span></template>
                                    </button>
                                </template>
                                <template if:true={hasActs}>
                                    <label class="fl">Due date for the ticked actions *
                                        <input class="ta date" type="date" data-f="due" value={due} onchange={handleInput} />
                                    </label>
                                    <p class="note">On Complete triage, each ticked action is created as a CQ containment on this NC, assigned to you.</p>
                                </template>
                                <template if:true={noAction}>
                                    <label class="fl">Why is no action needed? *
                                        <textarea class="ta" rows="2" data-f="noActionWhy" value={noActionWhy} oninput={handleInput}></textarea>
                                    </label>
                                </template>
                            </div>
                            <div class="col">
                                <template for:each={added} for:item="a">
                                    <div key={a.key} class="row slim added"><span class="ic">&#10003;</span><span class="dv">{a.name} &middot; {a.title}</span></div>
                                </template>
                                <template if:false={showAdd}>
                                    <button class="btn addbtn" onclick={handleShowAdd}>Add Containment</button>
                                </template>
                                <template if:true={showAdd}>
                                    <div class="addform">
                                        <div class="lab">New containment</div>
                                        <label class="fl">Title *
                                            <input class="ta sm" type="text" data-f="cTitle" value={cTitle} oninput={handleInput} />
                                        </label>
                                        <label class="fl">Description
                                            <textarea class="ta sm" rows="1" data-f="cDesc" value={cDesc} oninput={handleInput}></textarea>
                                        </label>
                                        <div class="pair">
                                            <label class="fl">Due date *
                                                <input class="ta sm" type="date" data-f="cDue" value={cDue} onchange={handleInput} />
                                            </label>
                                            <div class="fl">
                                                <lightning-record-picker label="Assignee" object-api-name="User" value={cAssignee} onchange={handleAssignee}></lightning-record-picker>
                                            </div>
                                        </div>
                                        <template if:true={addError}><div class="errbox">{addError}</div></template>
                                        <div class="opts">
                                            <button class="btn sm primary" onclick={handleCreate} disabled={cantCreate}>{createLabel}</button>
                                            <button class="btn sm" onclick={handleCancelAdd}>Cancel</button>
                                        </div>
                                    </div>
                                </template>
                                <div class="factcard">
                                    <div class="fsug"><span class="rec">&#10022; CQ.AI Suggests:</span> <strong>{suggestedAct}</strong></div>
                                    <details class="know">
                                        <summary>What we know</summary>
                                        <ul class="flist">
                                            <template for:each={factLines} for:item="f"><li key={f.key} class={f.cls}>{f.text}</li></template>
                                        </ul>
                                    </details>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={is1}>
                        <h3 class="q">Data Check</h3>
                        <p class="p">What was reported, and is it enough to send on? Photos and a description may be all you get.</p>
                        <template for:each={dataRows} for:item="r">
                            <div key={r.key} class={r.cls}><span class="ic">{r.icon}</span><span class="dk">{r.k}</span><span class="dv">{r.v}</span></div>
                        </template>
                        <div class="opts">
                            <template for:each={dataOpts} for:item="o">
                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handleData}>{o.label}</button>
                            </template>
                        </div>
                        <template if:true={dataAsk}>
                            <div class="lab top8">What do you need? *</div>
                            <div class="chips">
                                <template for:each={askChips} for:item="c">
                                    <button key={c.label} class={c.cls} data-id={c.label} onclick={handleAsk} aria-pressed={c.pressed}>{c.label}</button>
                                </template>
                            </div>
                            <textarea class="ta" rows="2" placeholder="Anything else" data-f="askNote" value={askNote} oninput={handleInput}></textarea>
                            <p class="note">The request is recorded on the nonconformance. Sending it to the reporter is not built yet.</p>
                        </template>
                    </template>

                    <template if:true={is2}>
                        <h3 class="q">Confirm the risk</h3>
                        <template if:false={riskReady}><p class="p">Working out the risk&hellip;</p></template>
                        <template if:true={riskReady}>
                            <div class="riskwrap">
                                <div class="heat">
                                    <div class="hrow">
                                        <span class="axis">Severity</span>
                                    </div>
                                    <template for:each={heatRows} for:item="r">
                                        <div key={r.key} class="hrow">
                                            <span class="hlab"><span class="cnum">{r.num}</span>{r.rest}</span>
                                            <template for:each={r.cells} for:item="c">
                                                <button key={c.key} class={c.cls} data-s={c.s} data-l={c.l} onclick={handleCell} aria-label={c.aria} aria-pressed={c.pressed}>
                                                    <template if:true={c.sug}><span class="cstar">&#10022;</span></template>{c.text}
                                                    <span class="tip" role="tooltip">
                                                        <template if:true={c.sug}><span class="tips">&#10022; CQ.AI Suggests</span></template>
                                                        <span class="tiph"><span class={c.lvlCls}>{c.text}</span><span class="tipdot">&middot;</span><span>Score {c.n} of 25</span></span>
                                                        <span class="tipc">{c.tipSev}</span>
                                                        <span class="tipx">&times;</span>
                                                        <span class="tipc">{c.tipLik}</span>
                                                    </span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <template for:each={heatCols} for:item="c">
                                            <span key={c.key} class="clab"><span class="cnum">{c.num}</span><span>{c.word}</span></span>
                                        </template>
                                    </div>
                                    <div class="hrow">
                                        <span class="hlab"></span>
                                        <span class="axis across">Likelihood</span>
                                    </div>
                                </div>
                                <div class="rside">
                                    <div class="sugbox">
                                        <div class="rec">&#10022; CQ.AI Suggests:</div>
                                        <div class="sughead"><span class={sugCls}>{suggestedRisk}</span><span class="rk">Score {suggestedScore} of 25</span></div>
                                        <div class="why">
                                            <div class="whyk">Severity: {sevHead}</div>
                                            <div class="whyv">{sevWhy}</div>
                                        </div>
                                        <div class="why">
                                            <div class="whyk">Likelihood: {likHead}</div>
                                            <div class="whyv">{likWhy}</div>
                                            <template if:true={recentList}><div class="whyv muted">Latest: {recentList}</div></template>
                                        </div>
                                        <template if:true={escaped}><div class="why bad">{escapedWhy}. Risk is High whatever cell is chosen.</div></template>
                                    </div>
                                    <div class="yours">
                                        <div class="lab">Selected</div>
                                        <div class="sughead"><span class={riskCls}>{risk}</span><span class="rk">Score {score} of 25</span></div>
                                        <div class="whyv">{sevLabel} severity &times; {likLabel} likelihood</div>
                                    </div>
                                </div>
                            </div>
                            <p class="note">The purple &#10022; cell is CQ.AI's suggestion and is already selected. Click another cell to change it; hover over a cell for its score.</p>
                        </template>
                    </template>

                    <template if:true={is3}>
                        <h3 class="q">Decide the path</h3>
                        <p class="p">Please make your selection below.</p>
                        <div class="paths">
                            <template for:each={pathOpts} for:item="o">
                                <button key={o.id} class={o.cls} data-id={o.id} onclick={handlePath}>
                                    <template if:true={o.cq}><span class="pill">&#10022; CQ.AI Suggests</span></template>
                                    <span class="pl">{o.label}</span>
                                    <span class="rk">{o.why}</span>
                                </button>
                            </template>
                        </div>
                        <template if:true={pathLog}>
                            <label class="fl">Disposition *
                                <select class="sel" data-f="disp" onchange={handleInput}>
                                    <option value="">Choose</option>
                                    <template for:each={dispOpts} for:item="d"><option key={d.value} value={d.value} selected={d.selected}>{d.value}</option></template>
                                </select>
                            </label>
                            <label class="fl">Why no investigation? *
                                <textarea class="ta" rows="2" data-f="logWhy" value={logWhy} oninput={handleInput}></textarea>
                            </label>
                        </template>
                    </template>

                    <template if:true={done}>
                        <div class="donehead"><span class="okdot">&#10003;</span><h3 class="q nom">Triage complete</h3></div>
                        <template for:each={summary} for:item="r">
                            <div key={r.key} class="row slim"><span class="dk">{r.k}</span><span class="dv">{r.v}</span></div>
                        </template>
                        <template if:true={warning}><div class="warnbox">{warning}</div></template>
                        <div class="opts"><button class="btn primary" onclick={handleClose}>Back to the nonconformance</button></div>
                    </template>
                    <template if:true={error}><div class="errbox">{error}</div></template>
                </div>
            </div>
            <template if:true={working}>
                <footer class="foot">
                    <button class="btn" onclick={handleBack} disabled={cantBack}>Back</button>
                    <span class="grow"></span>
                    <span class="blocker">{blocker}</span>
                    <button class="btn primary" onclick={handleNext} disabled={cantNext}>{nextLabel}</button>
                </footer>
            </template>
        </div>
    </div>
</template>
