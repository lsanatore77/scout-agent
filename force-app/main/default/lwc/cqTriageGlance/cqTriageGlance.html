<template>
    <section class={panelCls}>
        <template if:true={standalone}><h2 class="h">Triage at a Glance</h2></template>
        <template if:true={error}><div class="err">{error}</div></template>
        <template if:true={ready}>
            <template if:true={triaged}><div class="triaged" title={triageNotes}><span class="okdot">&#10003;</span>{triageLine}</div></template>
            <div class="problem">
                <div class={photoCls} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                    <input class="file" type="file" accept="image/*" onchange={handleFile} />
                    <template if:true={photoUrl}>
                        <img src={photoUrl} alt="Photo of the problem" />
                        <button class="replace" onclick={handlePick} disabled={uploading}>Replace</button>
                    </template>
                    <template if:false={photoUrl}>
                        <button class="add" onclick={handlePick} disabled={uploading}>
                            <lightning-icon icon-name="utility:photo" size="small" alternative-text="Photo"></lightning-icon>
                            <span class="addt">{addLabel}</span>
                            <span class="adds">or drop an image here</span>
                        </button>
                    </template>
                    <template if:true={photoError}><div class="perr">{photoError}</div></template>
                </div>
                <div class="ptext">
                    <div class="plabel">The problem</div>
                    <div class="quote">{description}</div>
                    <div class="prow">
                        <div class="tiles">
                            <template for:each={tiles} for:item="t">
                                <div key={t.key} class="tile"><div class="tl">{t.label}</div><div class={t.cls}>{t.value}</div></div>
                            </template>
                        </div>
                        <div class="actions">
                            <template if:true={standalone}><button class="btn primary" onclick={handleAssistant}><span class="star w">&#10022;</span>Triage Assistant</button></template>
                            <button class="btn outline" onclick={handleEdit}>Edit</button>
                            <template if:true={hasGaps}><button class="btn" onclick={handleGaps}>{gapsLabel}</button></template>
                        </div>
                    </div>
                    <template if:true={showGaps}>
                        <ul class="gaps">
                            <template for:each={gaps} for:item="x"><li key={x.key}>{x.text}</li></template>
                        </ul>
                    </template>
                </div>
            </div>
            <div class="cards">
                <template for:each={cards} for:item="c">
                    <div key={c.id} class={c.cls}>
                        <div class="chead"><span class="ct">{c.title}</span><template if:true={c.isSuggestion}><span class="star" title="CQ.AI Suggestion">&#10022;</span></template></div>
                        <div class="cheadline">{c.headline}</div>
                        <div class="cwhy">{c.why}</div>
                        <template if:true={c.flag}><div class="cflag">{c.flag}</div></template>
                        <template if:true={c.isOpen}>
                            <ul class="facts">
                                <template for:each={c.facts} for:item="f">
                                    <li key={f.key}><span class="fk">{f.k}</span><span class={f.cls}>{f.v}</span></li>
                                </template>
                            </ul>
                        </template>
                        <div class="grow"></div>
                        <button class="more" data-id={c.id} onclick={handleToggle} aria-expanded={c.isOpen}>{c.toggleLabel}</button>
                    </div>
                </template>
            </div>
            <template if:true={showAssistant}>
                <c-cq-triage-assistant record-id={recordId} glance={g} has-photo={hasPhoto} onclose={handleAssistantClose} ondone={handleTriageDone}></c-cq-triage-assistant>
            </template>
        </template>
    </section>
</template>
