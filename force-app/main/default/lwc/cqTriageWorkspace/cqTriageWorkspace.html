<template>
    <template if:true={error}><div class="err">{error}</div></template>
    <template if:true={ready}>
        <div class="box">
            <header class="hl">
                <div class="hl-top">
                    <div class="hl-who">
                        <span class="hl-icon"><lightning-icon icon-name="standard:incident" size="medium" alternative-text="Nonconformance"></lightning-icon></span>
                        <div class="hl-name">
                            <span class="hl-obj">Nonconformance</span>
                            <span class="hl-title">{g.name}</span>
                        </div>
                    </div>
                    <div class="hl-actions">
                        <c-ask-cq-popover record-id={recordId} agent-name="CQAI_Quality" placeholder="Ask about this nonconformance…" step={askStep} suggestions={askSuggestions}></c-ask-cq-popover>
                        <button class="btn" onclick={handleEdit}>Edit</button>
                    </div>
                </div>
                <div class="hl-fields">
                    <div class="f"><span class="k">Title</span><span class="v">{titleText}</span></div>
                    <div class="f"><span class="k">Part</span>
                        <template if:true={g.partId}><a class="v link" href={partHref} target="_blank">{g.partNumber}</a></template>
                        <template if:false={g.partId}><span class="v">&mdash;</span></template>
                    </div>
                    <div class="f"><span class="k">Lot</span><span class="v">{lotText}</span></div>
                    <div class="f"><span class="k">Type</span><span class="v">{typeText}</span></div>
                    <div class="f"><span class="k">Severity</span><span class="v">{severityText}</span></div>
                    <div class="f"><span class="k">Status</span><span class="v">{statusText}</span></div>
                    <div class="f"><span class="k">Owner</span><span class="v">{ownerText}</span></div>
                    <div class="f"><span class="k">Occurred</span><span class="v">{occurredText}</span></div>
                </div>
            </header>
            <c-cq-triage-assistant inline record-id={recordId} glance={g} has-photo={hasPhoto} onchanged={handleChanged} ondone={handleChanged} onstepchange={handleStep}>
                <c-cq-triage-glance embedded record-id={recordId} onchanged={handleChanged}></c-cq-triage-glance>
            </c-cq-triage-assistant>
        </div>
    </template>
</template>
