<template>
    <div class="cq-box">
        <header class="cq-hl">
            <div class="cq-hl-top">
                <div class="cq-hl-who">
                    <span class="cq-hl-icon"><lightning-icon icon-name={icon} style={iconStyle} size="medium" alternative-text={objectLabel}></lightning-icon></span>
                    <div class="cq-hl-name">
                        <span class="cq-hl-obj">{objectLabel}</span>
                        <span class="cq-hl-title">{recordName}</span>
                    </div>
                </div>
                <div class="cq-hl-actions">
                    <slot name="actions"></slot>
                    <template if:true={auditTrail}><c-cq-audit-trail record-id={recordId}></c-cq-audit-trail></template>
                    <template if:true={agentName}><c-ask-cq-popover record-id={recordId} agent-name={agentName} placeholder={askPlaceholder} step={askStep} suggestions={askSuggestions} pin-label={pinLabel} onaskcqaction={handleAskAction} onaskcqpin={handleAskPin}></c-ask-cq-popover></template>
                    <template if:true={showEdit}><button class="cq-btn-outline" onclick={handleEdit}>Edit</button></template>
                </div>
            </div>
            <template if:true={hasBottom}>
                <div class="hlbottom">
                <template if:true={hasFields}>
                    <div class="cq-hl-fields">
                        <template for:each={fieldRows} for:item="f">
                            <div key={f.key} class="cq-hl-f"><span class="cq-hl-k">{f.label}</span>
                                <template if:true={f.isLink}><button class="cq-hl-v link" data-id={f.id} onclick={handleOpen}>{f.value}</button></template>
                                <template if:false={f.isLink}><span class={f.vcls}>{f.value}</span></template>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:true={hasWorkspaces}>
                    <div class="wsmenu" onkeydown={handleWsKey}>
                        <button class="wslink" aria-haspopup="menu" aria-expanded={wsExpanded} onclick={toggleWs}>Change Workspace</button>
                        <template if:true={wsOpen}>
                            <div class="wsveil" onclick={closeWs}></div>
                            <div class="wslist" role="menu" aria-label="Change Workspace">
                                <template for:each={wsRows} for:item="w">
                                    <button key={w.key} class={w.cls} role="menuitemradio" aria-checked={w.checked} data-key={w.key} onclick={pickWs}>
                                        <span class="wstick" aria-hidden="true">{w.tick}</span>{w.label}
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                </div>
            </template>
        </header>
        <div class={bodyCls}>
            <nav class={railCls} aria-label={railTitle}>
                <div class="cq-rail-title">{railTitle}</div>
                <template for:each={stepRows} for:item="s">
                    <button key={s.i} class={s.cls} data-i={s.i} onclick={handleStep} disabled={s.locked} aria-current={s.current}>
                        <span class="mark">
                            <template if:true={s.done}>&#10003;</template>
                            <template if:false={s.done}>{s.n}</template>
                        </span>
                        <span class="txt"><span class="lbl">{s.label}</span><span class={s.subCls}>{s.sub}</span></span>
                    </button>
                </template>
                <template if:true={canRestart}><button class="cq-restart" onclick={handleRestart}>Start Over</button></template>
                <template if:true={canReopen}><button class="cq-restart" onclick={handleReopen}>{reopenLabel}</button></template>
                <template if:true={progress}><div class="progress">{progress}</div></template>
            </nav>
            <div class="cq-ws-main">
                <template if:true={resumed}><div class="resumed">Picked up where you left off.</div></template>
                <div class="cq-ws-cols">
                    <div class="cq-ws-content"><slot></slot></div>
                    <aside class={sideCls}><slot name="side" onslotchange={handleSideChange}></slot></aside>
                </div>
                <template if:true={error}><div class="cq-msg crit errbox">{error}</div></template>
                <template if:true={showFoot}>
                    <div class="cq-ws-foot stack">
                        <div class={footActsCls}>
                            <span class="cq-blocker">{blocker}</span>
                            <slot name="foot" onslotchange={handleFootChange}></slot>
                            <template if:true={nextIsAction}><button class={nextCls} onclick={handleNext} disabled={nextDisabled}>{nextLabel}</button></template>
                        </div>
                        <span class="navarrows">
                            <button class="arrow" onclick={handleBack} disabled={backDisabled} aria-label="Back" title="Back">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
                            </button>
                            <button class="arrow" onclick={handleNext} disabled={nextArrowOff} aria-label={nextTitle} title={nextTitle}>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                            </button>
                        </span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
