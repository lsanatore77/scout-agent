<template>
    <div class="slds-var-p-around_medium">
        <template lwc:if={loading}>
            <div class="spinner-holder">
                <lightning-spinner alternative-text="Loading the complaint" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={loadError}>
            <p class="slds-text-color_error">{loadError}</p>
        </template>

        <template lwc:else>
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-gutters_x-small slds-var-m-bottom_medium">
                <div class="slds-col slds-grow-none">
                    <span class="slds-badge slds-theme_info">Stage: {data.stage}</span>
                </div>
                <template lwc:if={inTriage}>
                    <div class="slds-col slds-grow-none slds-text-body_small slds-text-color_weak">{screenLabel}</div>
                </template>
            </div>

            <template lwc:if={notInTriage}>
                <p class="slds-text-color_weak">This complaint is not in Triage, so there is nothing to complete here.</p>
            </template>

            <template lwc:elseif={onDraftScreen}>
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-bottom_x-small">
                    <h3 class="slds-text-heading_small">Draft investigation summary</h3>
                    <span class="slds-text-body_small slds-text-color_weak">{draftSourceLabel}</span>
                </div>

                <template lwc:if={generating}>
                    <div class="draft-box draft-waiting">
                        <lightning-spinner alternative-text="Writing the draft investigation summary" size="small"></lightning-spinner>
                        <p class="slds-text-color_weak waiting-text">Writing the draft investigation summary. This usually takes 10 to 30 seconds.</p>
                    </div>
                </template>
                <template lwc:elseif={draftError}>
                    <div class="draft-box">
                        <p class="slds-text-color_error">{draftError}</p>
                        <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
                            You can try again, or continue to the steps without a summary.
                        </p>
                    </div>
                </template>
                <template lwc:elseif={editing}>
                    <lightning-input-rich-text value={draftHtml} onchange={handleDraftEdit}
                        label="Draft investigation summary"></lightning-input-rich-text>
                </template>
                <template lwc:elseif={hasDraftText}>
                    <div class="draft-box draft-view">
                        <lightning-formatted-rich-text value={draftHtml}></lightning-formatted-rich-text>
                    </div>
                </template>

                <div class="slds-grid slds-grid_align-spread slds-wrap slds-var-m-top_medium">
                    <div class="slds-col slds-grow-none slds-grid slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label={regenerateLabel} icon-name="utility:refresh" onclick={handleRegenerate}
                                disabled={generating}></lightning-button>
                        </div>
                        <template lwc:if={hasDraftText}>
                            <div class="slds-col">
                                <lightning-button label={editLabel} icon-name="utility:edit" onclick={handleToggleEdit}
                                    disabled={generating}></lightning-button>
                            </div>
                        </template>
                    </div>
                    <div class="slds-col slds-grow-none slds-grid slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button label="Skip summary" onclick={handleSkip} disabled={generating}></lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Next" onclick={handleNext}
                                disabled={nextDisabled}></lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_x-small">
                    <h3 class="slds-text-heading_small">Workflow steps</h3>
                    <span class="slds-text-body_small slds-text-color_weak">From CQ Tasks flagged Transfer To Workflow</span>
                </div>

                <div class="steps-table">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="col-include"><span class="slds-assistive-text">Include</span></th>
                                <th scope="col">Step</th>
                                <th scope="col">Assigned to</th>
                                <th scope="col" class="col-days">Days</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rows} for:item="row">
                                <tr key={row.key}>
                                    <td class="col-include">
                                        <lightning-input type="checkbox" variant="label-hidden" label="Include this step"
                                            checked={row.include} data-key={row.key} onchange={handleInclude} disabled={busy}>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={row.name}>{row.label}</div>
                                        <template lwc:if={row.isNew}>
                                            <span class="slds-text-body_small slds-text-color_weak">New</span>
                                        </template>
                                    </td>
                                    <td>
                                        <lightning-record-picker object-api-name="User" label="Assigned to" variant="label-hidden"
                                            placeholder="Search users" value={row.assigneeId} data-key={row.key}
                                            onchange={handleAssignee} disabled={busy}>
                                        </lightning-record-picker>
                                    </td>
                                    <td class="col-days">{row.allowedDays}</td>
                                </tr>
                            </template>
                            <template lwc:if={noRows}>
                                <tr><td colspan="4" class="slds-text-color_weak">No draft steps yet. Add one below.</td></tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small slds-var-m-top_small slds-wrap">
                    <div class="slds-col add-picker">
                        <lightning-combobox label="Add a step from CQ Tasks" placeholder="Choose a CQ Task"
                            options={templateOptions} value={selectedTemplateId} onchange={handleTemplate} disabled={busy}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-grow-none">
                        <lightning-button label="Add step" icon-name="utility:add" onclick={handleAddStep}
                            disabled={addDisabled}></lightning-button>
                    </div>
                </div>

                <div class="summary-note slds-var-m-top_medium slds-var-p-around_small">
                    <p class="slds-text-body_small">{summaryNote}</p>
                </div>

                <div class="slds-var-m-top_medium">
                    <lightning-textarea label="Comment" value={comment} onchange={handleComment} disabled={busy}
                        max-length="32000"></lightning-textarea>
                </div>

                <template lwc:if={statusMessage}>
                    <p class={statusClass}>{statusMessage}</p>
                </template>

                <div class="slds-grid slds-grid_align-spread slds-var-m-top_medium">
                    <div class="slds-col slds-grow-none">
                        <lightning-button label="Back" icon-name="utility:back" onclick={handleBack} disabled={busy}></lightning-button>
                    </div>
                    <div class="slds-col slds-grow-none slds-grid slds-gutters_x-small">
                        <div class="slds-col">
                            <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}></lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Complete triage" onclick={handleComplete}
                                disabled={busy}></lightning-button>
                        </div>
                    </div>
                </div>

                <template lwc:if={busy}>
                    <lightning-spinner alternative-text={busyText} size="small"></lightning-spinner>
                </template>
            </template>
        </template>
    </div>
</template>
