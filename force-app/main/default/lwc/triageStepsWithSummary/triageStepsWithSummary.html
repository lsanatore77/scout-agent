<template>
    <template lwc:if={hasRecord}>
        <div class="slds-var-p-around_small">
            <cqext-cqui-complaint-steps-grid
                record-id={complaintRecordId}
                task={task}
                purpose={purpose}
                onclose={handleStepsDone}
                onsave={handleStepsDone}
                onsaved={handleStepsDone}
                onsuccess={handleStepsDone}
                oncomplete={handleStepsDone}
                onfinish={handleStepsDone}>
            </cqext-cqui-complaint-steps-grid>
        </div>

        <div class="slds-var-m-horizontal_small slds-var-m-bottom_small slds-var-p-around_small summary-box">
            <lightning-input
                type="checkbox"
                label="Include draft summary"
                checked={includeSummary}
                onchange={handleToggle}
                disabled={saving}>
            </lightning-input>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-left_large">
                {hint}
            </p>
            <template lwc:if={message}>
                <p class={messageClass}>{message}</p>
            </template>
            <template lwc:if={saving}>
                <lightning-spinner alternative-text="Saving the draft summary" size="small"></lightning-spinner>
            </template>
        </div>
    </template>
    <template lwc:else>
        <p class="slds-var-p-around_medium">The complaint for this task could not be found.</p>
    </template>
</template>
